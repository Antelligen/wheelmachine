openapi: 3.1.0
info:
  title: Wheelmachine API
  version: "1.0.0"
  summary: Cloud machines for people and agents, paid by the second.
  description: |
    One API for machines that usually start in about a second, pause with their memory kept, fork while they run, and
    keep their files encrypted.

    Every call carries an API key: `Authorization: Bearer ak_live_...`. A key holds only the scopes it was made with.

    People sign in at the dashboard, https://app.wheelmachine.ai, with GitHub or Google. `wm login` gets a program its
    key through the browser: the person approves it at https://app.wheelmachine.ai/device. A key acts in its own account,
    and a key's call naming another account in `X-Account` is refused (`400`). The dashboard's sign-in acts in the
    person's own account, or in an organisation named with `X-Account: acc_...`, where it may do what their role gives. A
    route under `/v1/orgs/{org_id}/` acts on that organisation and writes in its audit: a call naming another organisation
    in `X-Account` is refused (`400`).

    Errors are `application/problem+json` (RFC 9457) with a stable `code`. Every answer carries `X-Request-Id`;
    give it when you ask us about a call. Calls that create something accept an `Idempotency-Key`, so a retry after
    a dropped connection never makes two.
servers:
  - url: https://api.wheelmachine.ai
    description: Wheelmachine
  - url: https://app.wheelmachine.ai
    description: The dashboard, where people sign in; it calls the same routes with their sign-in
security:
  - key: []
  - session: []
    csrf: []
tags:
  - name: Account
    description: Who you are, what was done in your account, and what it costs.
  - name: Billing
    description: |
      Every account has a balance of credit: prepaid usage credit in US dollars, for Wheelmachine alone. Your own account
      gets $5 of free credit, once for each person: at once with a GitHub sign-in; with a Google sign-in, once you link a
      GitHub account at least `github_min_days` old on the dashboard's Code page (`free_credit` says so while it waits).
      Another account of the same person gets none, and a new organisation starts with none.

      Machines' running time is taken from credit every minute, at the prices the API shows. Folders cost $0.03 a GB a
      month, counted by the day. Machines' disks, backups and archived machines are not charged today.

      At zero or below, the account's running machines are paused with their memory kept, and making, starting or forking
      a machine, running a command or reaching a file answers `402 payment_required` until the balance is above $0. Its
      folders turn read-only, and their files are deleted 30 days later unless credit is bought first; each e-mail gives
      the day. In an organisation the credit is the organisation's: its owners, admins and billing read it, and its owners
      and billing buy it.

      Credit is bought in $10, $25, $50 or $100 at a time, from Paddle, the merchant of record: Paddle takes the
      payment, adds any sales tax or VAT where you are, and sends you the receipt and the tax invoice. `POST
      /v1/credit/purchases` starts a checkout for one amount, which you pay in Paddle's checkout - the dashboard's
      Billing page opens it - and the credit is there once Paddle says the payment is complete. Credit Paddle refunds,
      or your bank takes back, is taken away again. `buy.open` says whether credit can be bought.
  - name: Sign-in
    description: How people and programs sign in.
  - name: Organisations
    description: |
      An organisation is an account of its own - its machines, keys, secrets and spending are its own - shared by people
      with roles (see `Role`). In an organisation, a project is a team. Each person sees their own machines; a team's
      managers also see those its members hold there, never an owner's or an admin's; owners and admins see every machine.
      Only the person who holds a machine uses it; others who see it can only watch its screen, each time written in the
      audit (`access`). `held_by` says whose a machine is. A key made there holds no more than the person who made it may
      do now, and stops when they leave or when a change of their role or teams takes away what it holds. People join by
      an invitation from an owner or admin: a link, also e-mailed when it names an address, that works once, for seven
      days, for the e-mail address, GitHub login or @handle it names. Each person has an @handle, which the API takes
      wherever it takes their id or e-mail address, and may have limits of their own: machines held, CPUs running at once,
      GPU machines and monthly spend.
  - name: Projects
    description: Groups of machines in an account. In an organisation, a project is a team.
  - name: Keys
    description: API keys, each limited to the scopes it was made with.
  - name: Machines
    description: Make, start, pause, stop, archive, fork and hand off machines.
  - name: Files and commands
    description: Commands, terminals, the screen, files and SSH in a machine.
  - name: Ports
    description: |
      A program listening on a port inside a machine, at a web address of its own:
      `https://<port>-<the machine's id without m_>.run.wheelmachine.ai`. HTTP, WebSockets and streams pass
      through; a paused, stopped or archived machine is started by the first visit (a browser is shown a page that says so
      while it starts). An address is private unless the port was opened `public`: it answers a call that carries
      an API key able to see the machine (`Authorization: Bearer ak_live_...`, which never reaches the program) and
      a browser that opened a link made for it; anyone else is answered 401, and an address of a port that is not
      open, or of another account's machine, 404. In an organisation a link works only while the person who made it may still
      use the machine. A WebSocket at a private address ends when its key is revoked, its person is taken out or loses
      access, or the account is on hold. A private address's pages may be framed by the dashboard and no other site; a
      public address's pages are framed as their program says.
  - name: Apps
    description: |
      Programs a machine carries: a desktop and a code editor in the browser and an agent's own web page (`web`), a
      model server reached from inside the machine (`service`), and agents that each keep a session of their own in
      the machine's terminal (`agent`). A new machine runs them all but the desktop and Gemini CLI, which stay off until
      turned on; turning one off frees the machine's memory. The code editor is always on: turning it off is refused
      (`409`). A web app is reached at the machine's private web address for its port (see Ports): turning it on, or
      asking for a link into it, opens that port private when it is not open, and answers a one-time link that lands
      on the app's own page. An app can also be shown on the machine's own screen, signed in, with nothing to open or
      approve. An agent's session keeps the AI keys it began with: one begun before the machine's keys changed says
      so (`keys_changed`), and turning the agent off and on again starts its next session with them. Each call asks
      the machine itself, so a paused machine is woken for it, as for a command. A machine with no apps answers
      `409` with the code `no_apps`.
  - name: Secrets
    description: |
      Values a machine's commands, terminals and SSH sessions get as environment variables. A secret kept outside the
      machines never enters one: a machine holds a placeholder (`wm_secret_<NAME>_<hex>`), and the value is added on the
      way out, only to requests going to the secret's
      hosts. An AI key - a secret set under a name `GET /v1/secrets/presets` lists, such as `ANTHROPIC_API_KEY` - is
      kept outside by that name's preset, which says where it is sent and how, and is on every machine of the account
      unless it is narrowed to the machines that name it. An open machine always gets a secret kept outside; one with an
      allow list only if the list allows one of the secret's hosts, and then only to hosts both name; a closed machine
      never.
  - name: Code
    description: |
      The repositories on GitHub and GitLab a team's machines may read and write, with no token ever in a machine. An
      account connects GitHub through Wheelmachine's GitHub App, installed on the repositories it chooses. It connects
      GitLab by approving Wheelmachine's GitLab application, or (gitlab.com or a company's own) with a group access token,
      never shown again. A team is given repositories, each to read or to write. A machine fetches only from repositories
      its team may read and pushes only to those it may write, while its holder is in the team and its internet reaches
      the code's host. Each person links their own GitHub or GitLab account so pushes carry their name; until then their
      machines can fetch but not push.
  - name: Folders
    description: |
      Files a team shares, on the dashboard and in every one of its machines. An organisation's owners and admins make
      team folders; a team's full managers, owners and admins give them to teams to view or edit. In a person's own
      account, its projects take the place of teams. Each person also has My files: theirs alone in the account (owners and
      admins see only its size), kept 30 days after they leave the organisation for its owners to take what they need. A
      machine has its team's folders and its holder's own at `~/folders` while its holder is in the team; no key of ours is
      ever in a machine. Deleted files stay in the folder's Trash for 30 days. Files are encrypted and kept in the EU. An
      account keeps up to 25 GB, Trash included; one file is at most 5 GB. Folders cost $0.03 per GB a month, counted by the
      day, taken from credit. While the credit is used up they are read-only (`402 payment_required`), and their files are
      deleted 30 days later unless credit is bought first. Needs `cloud:folders:read` to look and `cloud:folders:write` to
      change.
  - name: Models
    description: |
      The models your AI keys can use, as each model's provider lists them for the key, and the model each agent in your
      machines starts on. The lists are read from each provider with your key, and kept for an hour; only the
      models an agent codes with are listed. Choose a model for one agent, or one for every agent: each agent takes it where
      it can use the model's provider, and starts on its default where it cannot. In your own account a choice is for every
      machine; in an organisation it is yours, for the machines you hold in one of its teams. It reaches running machines
      at once and the others when they next start; an agent already running takes it at its next start, and says so
      (`model_changed`). An agent's own setting also works until a model is chosen for it here again, and the newer one
      wins, unless a list refuses it.

      In an organisation, its owners and admins may keep lists of the models its people may choose from
      (`/v1/models/allowed`): for the whole organisation, a team, a role - a person's level in the team their choice is
      for - or one person. The most specific list a person has applies to their choices: theirs, then their role's, then
      their team's, then the organisation's; with none, every model. Owners and admins are never limited to one.

      A list also applies inside the machines its people hold, whatever an agent's own model setting says: a request an
      agent makes with one of the organisation's AI keys goes on only as a chat with a model on the list, or as something
      that costs next to nothing, such as reading or embeddings. Anything else is refused with that provider's own kind
      of error (403), naming the models on the list. A list covers the organisation's AI keys, not a person's own. A
      list, or a change of a person's role or teams, reaches their running machines at once, and the others when they
      next start.
  - name: Catalogue
    description: Sizes, places and GPUs, with prices.
paths:
  /v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The account and key this call is made with
      responses:
        "200":
          description: Who is calling
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/handle:
    put:
      tags: [Account]
      operationId: setHandle
      summary: Change your @handle
      description: |
        Signed in to the dashboard. Lower-case letters, digits and -, 2 to 30, beginning and ending with a letter or
        digit; an @ and capitals are ignored. Yours alone, whatever its case, and never
        another person's GitHub login; a few words are reserved. It names you at once wherever you are
        named, and the API and wm take `@yours` wherever they take your id or e-mail address.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Your handle now
          content:
            application/json:
              schema:
                type: object
                required: [object, handle]
                properties:
                  object: { const: handle }
                  handle: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Not a handle, or a reserved word
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: It is another person's handle, or their GitHub login - said alike, "that handle can't be used"
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/me/name:
    put:
      tags: [Account]
      operationId: setName
      summary: Give or change your name
      description: |
        Signed in to the dashboard. Shown with your @handle wherever you are named ("Ada Lovelace · @ada"). Cut to 80
        characters; not the first part of your e-mail address.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Your name now
          content:
            application/json:
              schema:
                type: object
                required: [object, name]
                properties:
                  object: { const: name }
                  name: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: No name, or your e-mail address's first part
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/me/close:
    post:
      tags: [Account]
      operationId: closeAccount
      summary: Close your own account
      description: |
        Your own account closes for good once you type your GitHub login or e-mail address, signed in to the dashboard - never
        with a key or for an organisation. Your machines, files and backups are deleted, as is each organisation you are the
        only person in. You leave other organisations: machines you made there stay theirs, and their audit keeps what you
        did. Your keys and sign-ins end; your name, e-mail address, GitHub login, secrets, AI keys, model choices and
        invitations are deleted. What the law makes us keep stays: your machines' running time and what it came to, without
        your name; and a record of who had the account - name, e-mail address, GitHub login and number, when and from which IP
        address you signed up, and when and at which IP addresses your machines ran - kept apart and locked for 180 days (5
        years for an account verified in India), then deleted. Signing in again starts a new, empty account, with no free
        credit.

        Refused while you are the primary owner of an organisation others are in, and while a machine that would go is being
        handed off or forked. It also needs the code we e-mail you (`X-Confirm-Code`; see `POST /v1/confirm-codes`).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/ConfirmCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountClose" }
      responses:
        "204": { description: Closed; this browser is signed out }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`confirm` is not your GitHub login or e-mail address, `X-Account` names an organisation, or `X-Confirm-Code` is not 6 digits"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: |
            Made with a key, which never closes an account; or `confirm_required` or `confirm_wrong`: see `POST /v1/confirm-codes`.
        "409":
          $ref: "#/components/responses/Conflict"
          description: You are the primary owner of an organisation other people are in, or one of your machines is being handed off or forked
        "503":
          $ref: "#/components/responses/Unavailable"
          description: |
            A machine could not be deleted just now - try again in a moment; your keys and your other sign-ins have
            stopped already

  /v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: The account's projects
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`limit` or `after` is not right"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Make a project
      description: Needs the `cloud:projects:write` scope. A key limited to some projects cannot make new ones.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: The new project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          $ref: "#/components/responses/BadRequest"
          description: "This `Idempotency-Key` was used with a different request"
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProject
      summary: One project
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Rename a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: The project as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete an empty project
      description: A project that still holds machines is refused with `409 project_not_empty`.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Organisations]
      operationId: listTeamMembers
      summary: The people of a project's team
      description: |
        In an organisation the call acts in. Owners, admins and billing see every team; members see their own, and are
        told their teammates' names alone - not their e-mail addresses, GitHub logins or roles. A person's
        own account's projects have no members: `409`.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: The team, by when each was put in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's projects have members

  /v1/projects/{project_id}/members/{person_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PersonId"
    put:
      tags: [Organisations]
      operationId: setTeamMember
      summary: Put a person in a project's team, or change their level as its manager
      description: |
        Owners and admins, and the team's team managers and full managers. `level` makes a member a manager - `approver`,
        `manager` or `full` - or none (null); `lead` true means a team manager, false none; with neither, a person in the
        team keeps their level. Owners and admins give any level; a full manager makes or unmakes approvers below them. A
        person no longer a manager loses their open terminals and screens in the organisation, and can open again what
        they still may.
      security:
        - session: []
          csrf: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamMemberSet" }
      responses:
        "200":
          description: Their place in the team, changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "201":
          description: Put in the team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such project, or no such person in the organisation
        "409":
          $ref: "#/components/responses/Conflict"
          description: "Only an organisation's projects have members, or `lead` for one whose role is not member: only a member manages a team"
    delete:
      tags: [Organisations]
      operationId: removeTeamMember
      summary: Take a person out of a project's team
      description: |
        Owners and admins; and the team's team managers and full managers, of those with no level in it, or themselves.
        Their keys that reach the project stop working, and their open terminals and screens in the organisation end: they
        can open again what they still may.
      security:
        - session: []
          csrf: []
      responses:
        "204": { description: Taken out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's projects have members

  /v1/projects/{project_id}/rules:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Organisations]
      operationId: getTeamRules
      summary: A team's rules
      description: |
        In an organisation: whether its machines are handed off freely (`free`), with a manager's OK (`ask`) or not at all
        (`off`); whether its members fork them, with an OK (`ask`) or not at all (`off`); whether GPU machines and open
        internet are allowed; its monthly budget and what it has spent; the largest machine, in CPUs; the longest its machines
        stay idle; whether ports may be public (`on`), shared by a five-minute link only (`links_only`) or neither (`off`);
        and whether its members make machines from its types alone (`types_only`). With none set, hand-offs and forks ask,
        GPUs, open internet and public ports are on, and there is no budget, size or idle limit. An error names the team,
        rule, value and who can change it (`rule`). Off refuses anyone below an owner or admin; an owner's or admin's own goes
        past it, as the audit says (`past_rule`). Across teams always needs an admin.
      responses:
        "200":
          description: The team's rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamRules" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's teams have rules
    put:
      tags: [Organisations]
      operationId: setTeamRules
      summary: Set a team's rules
      description: |
        Its full managers, owners and admins. `hand_offs`, `forks`, `gpus`, `open_internet` and `month_budget_usd` must all
        be given; the others, left out, stay as they are. Machines already open stay open until changed; bigger machines keep
        running but do not start again in the team. The rules then apply at once, counted in `applied`: idle times above the
        limit are lowered (a running machine takes it when it next wakes or starts); under `links_only` or `off` no port
        stays public; under `off` every link into a port ends.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamRulesSet" }
      responses:
        "200":
          description: The team's rules, set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamRules" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: A rule left out, or one that cannot be
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's teams have rules
    patch:
      tags: [Organisations]
      operationId: changeTeamRules
      summary: Change some of a team's rules
      description: |
        As `PUT`, by the same people, for the rules named; the others stay as they are.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamRulesChange" }
      responses:
        "200":
          description: The team's rules, changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamRules" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's teams have rules

  /v1/projects/{project_id}/types:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Organisations]
      operationId: listMachineTypes
      summary: A team's machine types
      description: |
        In an organisation: the kinds of machine its people make, by name - each a size, the apps it has on, what it may
        reach on the internet, when it sleeps and when it is archived, and which of the team's repositories and folders
        its machines reach. With them, `apps`: the apps a type may turn on. Everyone who sees the team sees them.
      responses:
        "200":
          description: The team's types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineTypeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's teams have types
    post:
      tags: [Organisations]
      operationId: createMachineType
      summary: Save a machine type
      description: |
        Owners and admins. Its name is the team's own. It must fit the team's rules as they are: GPUs, open internet,
        the largest machine and the longest idle.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachineTypeSet" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The team has a type of that name, or 50 types already"

  /v1/projects/{project_id}/types/{type_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: type_id
        in: path
        required: true
        schema: { type: string, examples: [mty_01jb2xk3n4p5q6r7s8t9v0w1x2] }
    put:
      tags: [Organisations]
      operationId: replaceMachineType
      summary: Change a machine type
      description: |
        Owners and admins. Said whole: a field left out takes its default, as in a new type - but `repos` and `folders`,
        which stay as they are (`null` for every one the team is given). Machines made from it keep what they were made
        with; which of the team's repositories and folders they reach follows it.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachineTypeSet" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "Another of the team's types has that name"
    delete:
      tags: [Organisations]
      operationId: deleteMachineType
      summary: Delete a machine type
      description: |
        Owners and admins, once no machine of the team is of it: until then it is refused (`409`), saying how many are.
      security:
        - session: []
          csrf: []
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "Machines of the team are of it; or not an organisation's team"

  /v1/requests:
    get:
      tags: [Organisations]
      operationId: listRequests
      summary: The requests to fork a machine for someone, or hand it off
      description: |
        Newest first: those you asked, those of machines you hold, those that would give you a machine - and to a
        manager of a team, those of the machines they reach in it, never an owner's or an admin's; to owners and admins,
        every one. A key limited to projects lists those of its projects alone.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
        - name: open
          in: query
          description: "`true` for those still waiting or being carried out alone."
          schema: { type: boolean }
        - name: machine
          in: query
          description: Those of this machine - its own, and the forks made of it.
          schema: { type: string }
      responses:
        "200":
          description: The requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's machines are handed off
    post:
      tags: [Organisations]
      operationId: askRequest
      summary: Ask a teammate for a fork of one of their machines, or for one of them
      description: |
        The teammate you name (`of`) picks which of their machines as they approve. Then it waits for what the team's rules
        need: a manager's OK, or an admin's across teams. Off refuses it, unless you are an owner or admin. Made with a key, it
        first waits for your OK in the dashboard (`waiting_on` `asker`). Asking again while it waits returns the same request.
        It expires after a day.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestAsk" }
      responses:
        "200":
          description: The same ask, waiting already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "201":
          description: The request, waiting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Billing holds no machines
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such teammate, or no such project
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's machines are handed off; or your machines are yours already

  /v1/requests/{request_id}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Organisations]
      operationId: getRequest
      summary: A request
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such request - one you do not see is not found, in the same words
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's machines are handed off
    delete:
      tags: [Organisations]
      operationId: takeBackRequest
      summary: Withdraw a request you asked, while it waits
      description: Withdrawing it again answers the request as it is.
      responses:
        "200":
          description: The request, withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Only the one who asked it withdraws it
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such request
        "409":
          $ref: "#/components/responses/Conflict"
          description: Decided already, or expired

  /v1/requests/{request_id}/approve:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [Organisations]
      operationId: approveRequest
      summary: Approve the step a request waits on
      description: |
        Signed in, by whoever may decide this step: the person who made the key, for one given or asked with a key; its holder,
        for their OK (and, for an ask, picking the machine with `machine`); a manager of the machine's team (any level for a
        hand-off, a full manager for a fork), an owner or an admin, for a manager's OK; an owner or admin for an admin's. Nobody
        approves a machine coming to them. Once no step is left, the machine is handed off or forked. If that takes over a
        minute, the answer says approved and it carries on. Sending the same decision again returns the request as it is now.
      security:
        - session: []
          csrf: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestDecide" }
      responses:
        "200":
          description: The request as it is after
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Only the person who made it, the holder, a manager of its team or an admin decides this; or the team's rules are Off
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such request, or no such machine of yours
        "409":
          $ref: "#/components/responses/Conflict"
          description: Decided already another way, expired, or its machine is being handed off

  /v1/requests/{request_id}/decline:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [Organisations]
      operationId: declineRequest
      summary: Decline the step a request waits on
      description: |
        Signed in, by whoever may approve it. The request ends. Declining it again answers the request as it is.
      security:
        - session: []
          csrf: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestDecide" }
      responses:
        "200":
          description: The request, declined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such request
        "409":
          $ref: "#/components/responses/Conflict"
          description: Decided already, or expired

  /v1/orgs:
    get:
      tags: [Organisations]
      operationId: listOrgs
      summary: The organisations you are in
      description: With the dashboard's sign-in, or a key of your own account. A key of an organisation's lists none.
      responses:
        "200":
          description: The organisations, the newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Organisations]
      operationId: createOrg
      summary: Make an organisation
      description: |
        You are its primary owner, and it has a first project, `Default`. It has the limits your own account
        has, and a person is primary owner of at most 5 organisations at once.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgCreate" }
      responses:
        "201":
          description: The new organisation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The first call with this `Idempotency-Key` is still running"
        "422":
          $ref: "#/components/responses/BadRequest"
          description: "This `Idempotency-Key` was used with a different request"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "You are primary owner of 5 organisations already (`limit_reached`), or made too many just now (`rate_limited`)"

  /v1/orgs/{org_id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Organisations]
      operationId: getOrg
      summary: One organisation you are in
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: The organisation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`X-Account` names another account than the organisation in the path"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such organisation - none of that id, or one you are not in, alike
    patch:
      tags: [Organisations]
      operationId: updateOrg
      summary: Rename an organisation
      description: Owners and admins.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgUpdate" }
      responses:
        "200":
          description: The organisation as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "Not a name, or `X-Account` names another account than the organisation in the path"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Organisations]
      operationId: deleteOrg
      summary: Delete an organisation
      description: |
        Its primary owner, once it holds no machine - another owner never. Its secrets are deleted, its keys stop
        working, and its people are taken out of it. It needs the code we e-mail you for it (`X-Confirm-Code`), bound to
        this organisation - see `POST /v1/confirm-codes`.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/ConfirmCode"
      responses:
        "204": { description: Deleted }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`X-Account` names another account than the organisation in the path, or `X-Confirm-Code` is not 6 digits"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: |
            Not its primary owner; or `confirm_required` or `confirm_wrong`: see `POST /v1/confirm-codes`.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: It still holds machines - delete them first
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "Deleting it: we can't send a confirm code just now - try again later"

  /v1/orgs/{org_id}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Organisations]
      operationId: listMembers
      summary: The people of an organisation
      description: |
        Owners, admins and billing. Also team managers and full managers, who see only the names of people outside the
        teams they manage.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: Its people, by when they joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`X-Account` names another account than the organisation in the path"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/orgs/{org_id}/members/{person_id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/PersonId"
    patch:
      tags: [Organisations]
      operationId: updateMember
      summary: Change a person's role, or transfer the organisation to them
      description: |
        Owners change anyone's role; admins change everyone's but an owner's, and make nobody an owner. Only the primary owner
        transfers the organisation (`primary_owner`), to one of its owners. Keys there that hold more than the new role gives
        stop working, and their open terminals and screens there end. A team manager or full manager can change limits only
        for a member with no level, all of whose teams they manage, within each team's budget and GPU rule, and never above
        what an owner, admin or billing set. Transferring it, and making someone an owner, need the code we e-mail you
        (`X-Confirm-Code`).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/ConfirmCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Their place as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "Nothing to change, a role or limits that cannot be, `X-Account` names another account than the organisation in the path, or `X-Confirm-Code` is not 6 digits"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: |
            Your role does not allow it; or, transferring it or making an owner, `confirm_required` or `confirm_wrong`: see `POST /v1/confirm-codes`.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: |
            An organisation keeps one owner at least, and its primary owner transfers it before their role changes; the
            primary owner is one of its owners; or their role, or yours, changed meanwhile
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "Transferring it, or making an owner: we can't send a confirm code just now - try again later"
    delete:
      tags: [Organisations]
      operationId: removeMember
      summary: Take a person out of an organisation, or leave it
      description: |
        Owners take anyone out but the primary owner; admins anyone but an owner; anyone may leave, but the primary
        owner, who transfers the organisation first. Their keys there stop working, and their open terminals and screens there end;
        the machines they made stay the organisation's. One who may take nobody out but themselves is refused alike
        whether the person is in it or not.
      security:
        - session: []
          csrf: []
      responses:
        "204": { description: Taken out }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`X-Account` names another account than the organisation in the path"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: The primary owner transfers the organisation first; or their role, or yours, changed meanwhile

  /v1/orgs/{org_id}/invites:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Organisations]
      operationId: listInvites
      summary: An organisation's invitations
      description: Owners and admins. Links are shown only once.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: The invitations, the newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`X-Account` names another account than the organisation in the path"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Organisations]
      operationId: createInvite
      summary: Invite a person
      description: |
        Owners and admins; an admin invites no owner. By one of an e-mail address, a GitHub login or an @handle, with a role,
        teams and limits. The answer holds the link to send them, this once. By e-mail address or @handle it is also e-mailed
        (`emailed`); by GitHub login it is not. It works once, for seven days, while you stay in the organisation with a role
        that can invite. At most 100 invitations wait at once, and an organisation e-mails 100 a day, 5 to one address.
        Inviting an owner needs the code we e-mail you (`X-Confirm-Code`).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/ConfirmCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteCreate" }
      responses:
        "201":
          description: The invitation, and its link this once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "Not whom, a role or limits that cannot be, `lead` in `teams` for a role other than member, or `X-Account` names another account than the organisation in the path"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: |
            Your role does not allow it; or, inviting an owner, `confirm_required` or `confirm_wrong`: see `POST /v1/confirm-codes`.
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such organisation, or a project in `teams` is not one of it
        "409":
          $ref: "#/components/responses/Conflict"
          description: A person of that address, login or handle is in the organisation already; or the handle is also another person's GitHub login
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "100 invitations wait already (`limit_reached`), or too many were made just now (`rate_limited`)"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "Inviting an owner: we can't send a confirm code just now - try again later"

  /v1/orgs/{org_id}/invites/{invite_id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InviteId"
    delete:
      tags: [Organisations]
      operationId: revokeInvite
      summary: Cancel an invitation
      description: Owners and admins. Its link works no more. One used, cancelled or expired is not found.
      security:
        - session: []
          csrf: []
      responses:
        "204": { description: Cancelled }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`X-Account` names another account than the organisation in the path"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/orgs/{org_id}/invites/{invite_id}/resend:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InviteId"
    post:
      tags: [Organisations]
      operationId: resendInvite
      summary: Send an invitation again
      description: |
        Owners and admins; an owner's invitation, owners alone. A waiting invitation gets a new link, good for seven days,
        shown this once and e-mailed as before; the old link stops working. Sending an owner's invitation again needs the code
        we e-mail you (`X-Confirm-Code`).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/ConfirmCode"
      responses:
        "200":
          description: The invitation, and its new link this once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreated" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`X-Account` names another account than the organisation in the path"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: |
            Your role does not allow it; or, an owner's invitation, `confirm_required` or `confirm_wrong`: see `POST /v1/confirm-codes`.
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such invitation waiting - used, cancelled or expired
        "409":
          $ref: "#/components/responses/Conflict"
          description: Sent again, used or cancelled a moment ago; by @handle, it cannot be e-mailed again now, or its person has no @handle now; or it could not be sent again just now - nothing changed, the link before still works
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "An owner's invitation: we can't send a confirm code just now - try again later"

  /v1/orgs/{org_id}/handles/{handle}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: handle
        in: path
        required: true
        schema: { type: string, maxLength: 31 }
    get:
      tags: [Organisations]
      operationId: lookupHandle
      summary: Who an @handle is
      description: |
        Owners and admins, before they invite someone by their @handle: their name and handle alone, so whom each handle
        names is seen before it is sent.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: The person, by their name and handle
          content:
            application/json:
              schema:
                type: object
                required: [object, name, handle]
                properties:
                  object: { const: handle }
                  name: { type: string, description: "Their name; empty when they gave none - name them by their handle alone then." }
                  handle: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: Nobody has that handle
        "409":
          $ref: "#/components/responses/Conflict"
          description: It is also another person's GitHub login - they are invited by their e-mail address
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/invites/preview:
    post:
      tags: [Organisations]
      operationId: previewInvite
      summary: What an invitation's link is for, before you sign in
      description: |
        No key and no sign-in: the token from the link (what follows `#`), in the body. Says the organisation, who
        invites you and the role - nothing of whom it is for, nor its teams - so its page can say them before you sign
        in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The invitation, as far as its page says it before you sign in
          content:
            application/json:
              schema:
                type: object
                required: [object, org, made_by, role, expires_at]
                properties:
                  object: { const: invite_preview }
                  org:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                  made_by:
                    type: object
                    required: [name, handle]
                    properties:
                      name: { type: string }
                      handle: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such invitation - used, cancelled, expired, or the person who made it may no longer invite, alike
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/invites/lookup:
    post:
      tags: [Organisations]
      operationId: lookupInvite
      summary: What an invitation's link offers
      description: |
        Signed in, with the token from the link (what follows `#`). The token goes in the body, never in an address.
        Says who invites you, to what, whether it is for you, and what you read before you join.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteToken" }
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteSeen" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such invitation - used, cancelled, expired, or the person who made it may no longer invite, alike
        "409":
          $ref: "#/components/responses/Conflict"
          description: It is for a role that is no longer offered - ask for a new one
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/invites/accept:
    post:
      tags: [Organisations]
      operationId: acceptInvite
      summary: Join an organisation by its invitation
      description: |
        Signed in, as the person it is for, having read its `notice` (`notice_seen`). You join with its role, teams and
        limits; the link works no more.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteAccept" }
      responses:
        "200":
          description: The organisation you joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`notice_seen` is not true"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: It is for another e-mail address or GitHub account than yours, or the organisation is on hold
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such invitation - used, cancelled, expired, or the person who made it may no longer invite, alike
        "409":
          $ref: "#/components/responses/Conflict"
          description: You are in the organisation already, or it is for a role that is no longer offered - ask for a new one
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/audit:
    get:
      tags: [Account]
      operationId: listAuditEvents
      summary: What was done in the account, the newest first
      description: |
        Needs `cloud:*`; in an organisation, its owners and admins alone. Each event says who did it - the person, and
        the key or sign-in they did it with - what, to which thing, and from where. What the company's staff did says
        `wheelmachine`, and no more.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: after
          in: query
          description: The `next` of the page before.
          schema: { type: string }
        - name: person
          in: query
          description: The events of one person, by their id.
          schema: { type: string, maxLength: 255 }
        - name: action
          in: query
          description: The events whose action begins with this, such as `machine.` or `member.`.
          schema: { type: string, maxLength: 100 }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Before this.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/audit/export:
    get:
      tags: [Account]
      operationId: exportAuditEvents
      summary: The account's audit as a file
      description: |
        As the audit is read, whole, as CSV or a JSON array, the newest first. A year at most (the last one when `since` is left
        out), and 100,000 events at most. CSV fields are quoted, and one that begins with `=`, `+`, `-` or `@` gets a leading
        `'` so a spreadsheet never runs it. One export runs at a time; if it cannot finish, the connection is cut.
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, json] }
        - name: person
          in: query
          schema: { type: string, maxLength: 255 }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The events, to save (`Content-Disposition` names the file)
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now, or the account's audit is being exported now (`rate_limited`): try again once that is done"

  /v1/keys:
    get:
      tags: [Keys]
      operationId: listKeys
      summary: The account's API keys
      description: A key's secret is shown only once, when it is made.
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Keys]
      operationId: createKey
      summary: Make a key
      description: |
        Needs `cloud:keys:write`. A new key holds only scopes and projects the calling key holds, so a key can never make a
        stronger one. The secret is in this answer only. In an organisation, a key never holds more than the person may do
        there, and is limited to their teams when their role is. A key with full access (`cloud:*`), or one that can make keys
        (`cloud:keys:write`), also needs a code we e-mail to the person (`X-Confirm-Code`; see `POST /v1/confirm-codes`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ConfirmCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyCreate" }
      responses:
        "201":
          description: The new key, with its secret shown this once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: |
            A scope or a rate this key does not hold; or, for a key with full access, `confirm_required` or `confirm_wrong`: see `POST /v1/confirm-codes`.
        "404":
          $ref: "#/components/responses/NotFound"
          description: "A project in `projects` is not one this key reaches"
        "409":
          $ref: "#/components/responses/Conflict"
          description: |
            The first call with this `Idempotency-Key` is still running; or it made its key already, and this is the
            call sent again: `Location` names that key. A key's secret is in the first answer only and is kept nowhere,
            not even for a retry, so revoke that key and make another.
        "422":
          $ref: "#/components/responses/BadRequest"
          description: "This `Idempotency-Key` was used with a different request"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or the account holds 50 keys that work already - or you hold 10 in the organisation (`limit_reached`): revoke one first"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "A key with full access: we can't send a confirm code just now - try again later"

  /v1/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    delete:
      tags: [Keys]
      operationId: revokeKey
      summary: Revoke a key
      description: The key stops working within seconds, everywhere. A key can revoke itself.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ssh/certificates:
    post:
      tags: [Files and commands]
      operationId: signSSHCertificate
      summary: Sign a short-lived SSH certificate for a machine
      description: |
        Needs the `cloud:machines:exec` scope. Give a public key and a machine; get back an SSH certificate good for
        at most an hour, for that machine alone (its one principal is the machine's id, which is also the SSH user to
        connect as). Present it to the SSH server (`ssh_host`) to open a real SSH session - for `scp`, `sftp` and
        editors' remote-SSH. Each session gets the machine's secrets as environment variables, as a terminal does.
        There is no password or bare public-key login. `wm ssh-config` prints the matching
        `~/.ssh/config` block. A certificate works only while the key or the sign-in that asked for it does: revoking
        that key, or signing out, ends the SSH sessions it opened, and it opens no more.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHCertificateRequest" }
      responses:
        "201":
          description: The signed certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHCertificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The first call with this `Idempotency-Key` is still running"
        "422":
          $ref: "#/components/responses/BadRequest"
          description: "This `Idempotency-Key` was used with a different request"
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/ssh:
    get:
      tags: [Files and commands]
      operationId: getSSH
      summary: Whether SSH is open, and how to reach and trust it
      description: |
        What `wm ssh-config` needs to point your own `ssh`, `scp` and `sftp` at a machine. Public keys only.
      responses:
        "200":
          description: How to reach the SSH server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/backups:
    get:
      tags: [Machines]
      operationId: listBackups
      summary: The account's backups, newest first
      description: |
        Needs the `cloud:machines:read` scope. Every backup of a machine that is not deleted, in the projects this key
        reaches - each one a fork of its machine can be made from, with `backup`. A deleted machine's backups go with
        it. In an organisation, those of the machines the caller reaches: none to billing; and those taken of a machine
        before it was last handed off are its owners' and admins' alone.
      parameters:
        - $ref: "#/components/parameters/BackupLimit"
      responses:
        "200":
          description: The backups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`limit` is not between 1 and 200"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/machines:
    get:
      tags: [Machines]
      operationId: listMachines
      summary: Machines, newest first
      description: |
        In an organisation, the machines the caller reaches: owners and admins every one; a member those they hold in
        their teams, and in a team they manage those its members hold; billing none (what they cost is in `GET
        /v1/usage`).
      parameters:
        - name: project
          in: query
          description: Only this project's machines.
          schema: { type: string }
        - name: state
          in: query
          description: "Only machines in this state: `failed` lists the machines that never came up, with why; a deleted machine is never listed."
          schema: { $ref: "#/components/schemas/MachineState" }
        - name: label
          in: query
          description: "`key=value`; repeat to ask for every one of several labels."
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: A page of machines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "A `state`, `label`, `limit` or `after` that is not right"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "The `project` is not one this key reaches"
    post:
      tags: [Machines]
      operationId: createMachine
      summary: Make a machine
      description: |
        Answers when the machine is running (201), usually in about a second. If that takes longer than `wait_s`, the
        answer is `202` with the machine `starting`, and `GET /v1/machines/{machine_id}/wait` follows it. A GPU machine
        can take minutes: it is answered `202` within about a second, whatever `wait_s` says.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachineCreate" }
      responses:
        "201":
          description: Running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "202":
          description: Starting; follow it with the wait call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "The `project` is not one this key reaches; or the machine was deleted while it was being made"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The first call with this `Idempotency-Key` is still running; or its internet policy cannot be applied just now (`not_open`)"
        "422":
          $ref: "#/components/responses/BadRequest"
          description: "This `Idempotency-Key` was used with a different request"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or the account - or you, in an organisation - holds as many machines, or runs as many CPUs at once, as it may (`limit_reached`)"
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/machines/batch:
    post:
      tags: [Machines]
      operationId: createMachines
      summary: Make machines for people
      description: |
        In an organisation: machines of one of a team's types (`GET /v1/projects/{project_id}/types`), for people of the
        team - those named in `people`, or `everyone` in it - `each` for each of them, named by the `names` pattern. Owners
        and admins make them for anyone; a team's managers for its plain members; a member for themselves. What the
        organisation and the team may spend is held for the whole batch before anything is made (`402`); then each
        machine is answered on its own - made, on its way or refused (a person's limit, a team's rule, or none available just now) - and one
        refused leaves the others made. Each is its person's own from the start: they hold it, its limits are theirs,
        their own folder (My files) is in it, and the person who made it never takes it back - they may give it back
        (`give-back`). With an `Idempotency-Key`, the same batch asked again makes none of its machines twice, however
        the first call ended: what it made is answered, and what it did not finish is made. A machine on its way
        (`status` 202) is followed with `GET /v1/machines/{machine_id}/wait`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachineBatchCreate" }
      responses:
        "200":
          description: Each machine, made or not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineBatch" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "No such type in the team; a person named who is nobody here, or more than one; more than 100 machines"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: "The organisation, or the team, has nothing left to spend this month"
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "A member naming anyone but themselves"
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "Not in an organisation, or nobody in the team yet"
        "422":
          $ref: "#/components/responses/BadRequest"
          description: "This `Idempotency-Key` was used with a different request"
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/machines/{machine_id}:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Machines]
      operationId: getMachine
      summary: One machine
      responses:
        "200":
          description: The machine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Machines]
      operationId: updateMachine
      summary: Rename a machine, move it to another project, or change its labels, secrets or internet
      description: |
        Labels merge: a label given `null` is taken off. A machine moves only to a project this key reaches; terminals, its
        screen, SSH sessions and WebSockets at its address end as it moves. Everything asked changes, or nothing does. Its size
        and when it sleeps cannot change; a fork from a backup can be another size.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachineUpdate" }
      responses:
        "200":
          description: The machine as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "The machine, or the `project` it is moved to, is not one this key reaches"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "Its new internet policy cannot be applied while it runs (`not_open`): it is kept, and takes effect when the machine next starts"
    delete:
      tags: [Machines]
      operationId: deleteMachine
      summary: Delete a machine, its files and its backups
      description: |
        In an organisation, a machine handed to you - or forked for you by a teammate - is given back, not deleted
        (`give-back`), while the one who handed it off may still take it back; its organisation's owners and admins delete
        it as they delete any.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Not yours to delete, or handed to you and to be given back
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/machines/{machine_id}/start:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: startMachine
      summary: Run it again, from paused, stopped or archived
      description: |
        Answers when it is running (200). If that takes longer than
        `wait_s`, the answer is `202` with the machine `starting` - for a GPU machine within about a second, whatever
        `wait_s` says - and `GET /v1/machines/{machine_id}/wait` follows it.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitOptions" }
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "202":
          description: Starting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`wait_s` is not between 0 and 600"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine cannot start in the state it is in; it `failed` - it could not be made, so make a new one; or its internet policy cannot be applied just now (`not_open`)"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now, or the account has as many machines running or kept as it may"
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/machines/{machine_id}/pause:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: pauseMachine
      summary: Pause it with its memory kept
      description: Nothing runs and no running time is charged; `start` brings it back where it was.
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/machines/{machine_id}/stop:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: stopMachine
      summary: Stop it; its files stay
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine cannot stop in the state it is in"

  /v1/machines/{machine_id}/archive:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: archiveMachine
      summary: Archive its files
      description: "`start` brings it back."
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine cannot be archived in the state it is in"

  /v1/machines/{machine_id}/fork:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: forkMachine
      summary: A fork of this machine - a new machine of its own, made from it as it is now or from one of its backups
      description: |
        Held by whoever forks it.
        It sleeps as the original does; its name is the original's with `-fork` after it, and its labels are the
        original's, unless given. A fork of the machine as it is now is the original's size, and carries on from where the
        machine is when it can, otherwise from its files; a fork from a backup (`backup`) starts afresh from the backup's
        files, at the size `cpus` asks or the original's. The
        fork has the original's internet policy; when that cannot be applied just now, the answer is `409 not_open`. A
        fork of a GPU machine can take minutes: it is answered `202` within about a second, whatever `wait_s` says. In an organisation, a member's fork - of the machine
        as it is or from a backup - waits for the OK of a full manager of the machine's team, an owner or an admin: it
        is answered `202` with the request (`object` `request`, its `holder` and `receiver` both you, its `backup` and
        `cpus` as asked), and the fork is made once it is approved - named, labelled and sized as asked, from the
        machine as it is then or from the backup. Asked with a key, it waits for your own OK in the dashboard first. A full manager's own fork, an owner's and an admin's are made at once; a team whose Forks rule
        is Off refuses every member's (`Forks: Off in Lab`). A fork of another person's machine is cleared before it is
        yours, as a fork for a teammate is; a machine that cannot be cleared yet is refused (`409 not_open`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachineFork" }
      responses:
        "200":
          description: In an organisation, a member's fork of it asked already and still waiting - that request, as it is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "201":
          description: The fork, running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "202":
          description: |
            The fork, starting (a GPU machine can take minutes; a fork of another person's machine is being
            cleared); or, in an organisation, a member's fork waiting for its OK - the request (`object` says which)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Machine"
                  - $ref: "#/components/schemas/Request"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "A name, label, `wait_s`, `backup` or `cpus` that is not right - `cpus` without a `backup` among them"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No such machine, or no such backup of it"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The first call with this `Idempotency-Key` is still running; or `backup` is `latest` and the machine has no backup yet - in an organisation, none since it was handed to you"
        "422":
          $ref: "#/components/responses/BadRequest"
          description: "This `Idempotency-Key` was used with a different request"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or the account - or you, in an organisation - holds as many machines, or runs as many CPUs at once, as it may (`limit_reached`)"
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/machines/{machine_id}/copy:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: copyMachine
      deprecated: true
      summary: The same as forking it
      description: "Deprecated: does what `POST /v1/machines/{machine_id}/fork` does."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachineFork" }
      responses:
        "200":
          description: In an organisation, a member's fork of it asked already and still waiting - that request, as it is
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "201":
          description: The fork, running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "202":
          description: |
            The fork, starting (a GPU machine can take minutes; a fork of another person's machine is being
            cleared); or, in an organisation, a member's fork waiting for its OK - the request (`object` says which)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Machine"
                  - $ref: "#/components/schemas/Request"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "A name, label or `wait_s` that is not right"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The first call with this `Idempotency-Key` is still running"
        "422":
          $ref: "#/components/responses/BadRequest"
          description: "This `Idempotency-Key` was used with a different request"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or the account - or you, in an organisation - holds as many machines, or runs as many CPUs at once, as it may (`limit_reached`)"
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/machines/{machine_id}/fork-for:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: forkMachineFor
      summary: Fork a machine for a teammate
      description: |
        By its holder, or an owner or admin of the organisation. The teammate (`to`: their @handle, id, e-mail address or
        GitHub login) gets a live fork - its memory, its programs and its screen as they are - cleared of the other person's
        sign-ins: the browser's windows and tabs stay and open again signed out; cookies, saved passwords, sites' data and the
        apps' and agents' own sign-ins go. The machine itself is untouched. A machine that holds no memory is forked by its
        files. Until it is cleared the fork has no internet and no outside secret. Wheelmachine keys found in it are revoked
        (`keys_revoked`). It waits for what the team's rules need: the OK of a full manager, an owner or an admin; an admin's
        for another team; Off refuses it. An owner's, admin's or full manager's own, signed in, is made at once; made with a
        key, it first waits for the OK of the person who made the key in the dashboard (`waiting_on` `asker`). If it takes over
        a minute, the answer says approved and it carries on. The person who forked it (`given_by`) sees it and can take it back
        at any time; the teammate gives it back and cannot delete it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiveTo" }
      responses:
        "200":
          description: The same request, open already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "201":
          description: The request - done, waiting, or approved and being carried out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not yours to give, or the team's rules say Off (`Forks: Off in Lab`)"
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such machine, no such teammate, or no such project of theirs
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's machines are handed off; it is being handed off; or it is theirs already
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "The teammate may hold no more machines (`limit_reached`)"

  /v1/machines/{machine_id}/hand-off:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: handOffMachine
      summary: Hand a machine off to a teammate
      description: |
        By the person who made it, while they hold it - or by an owner or admin once its holder has left the organisation, or
        holds no machine there. A machine handed to you is given back (`give-back`), not handed off again.

        It goes to the teammate (`to`) exactly as it is: programs, terminals, files and every sign-in in it, its browsers' too.
        Whoever holds it can act as you wherever you are signed in there, Wheelmachine included (you sign in through GitHub or
        Google): sign out in its browser first if that is not what you want. Two things never go with it: your Wheelmachine keys
        found in it are revoked (`keys_revoked`), and your dashboard sign-ins in its browsers end - every one of yours if its
        browsers cannot all be read (`POST /v1/machines/{machine_id}/check` says which).

        Everything open into it ends until it is handed off, and links made before stop working. A machine you hand off arrives
        paused with its memory kept; one they asked for goes as it is. You then watch it (`access` `watch`, `given_by` you) and
        can take it back whenever you choose (`take-back`). It waits for what the team's rules need, as for a fork; made with a
        key, for the OK of the person who made the key in the dashboard. What it cost this month so far stays yours. If it
        cannot be made ready to go, it comes back `failed`, saying why.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiveTo" }
      responses:
        "200":
          description: The same request, open already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "201":
          description: The request - done, waiting, or approved and being carried out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not yours to hand off - not made by you, or handed off by you already - or the team's rules say Off (`Hand-offs: Off in Lab`)"
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such machine, no such teammate, or no such project of theirs
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's machines are handed off; it is being handed off, or a hand-off of it to another is waiting
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "The teammate may hold no more machines (`limit_reached`)"

  /v1/machines/{machine_id}/take-back:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: takeBackMachine
      summary: Take back a machine you handed off
      description: |
        By the person who handed it off (its `given_by`), whenever they choose, with nobody's OK. It comes straight back
        to you exactly as it is - what its holder put in it, their sign-ins included - paused with its memory kept, under
        no rule of a team and no limit of yours. The holder's Wheelmachine keys found in it are revoked, and their
        sign-ins to the dashboard in its browsers end, as yours did as you handed it off; what is open into it ends. It
        goes into the team it is in where you may hold machines there; else the one it was handed off from; else your
        only team - or the one you name (`team`). It is a request of its own (`way` `back`), in the machine's history;
        made with a key, it waits for the OK of the person who made the key in the dashboard.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackTo" }
      responses:
        "200":
          description: The same request, open already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "201":
          description: The request - done, waiting for the OK of the person who made the key, or approved and being carried out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Not handed off by you
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such machine, or no such project of yours
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's machines are handed off; it is yours already; it is being handed off, or a hand-off of it is waiting

  /v1/machines/{machine_id}/give-back:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: giveBackMachine
      summary: Give back a machine handed to you
      description: |
        By the person a machine was handed to: straight back to the one who handed it off, as `take-back` takes it - with
        what you put in it, your sign-ins included, but for your Wheelmachine keys found in it, revoked, and your
        sign-ins to the dashboard in it, ended. A machine handed to you is given back, never handed off again, and not
        deleted while the one who handed it off may still take it back. It goes into a team of theirs as `take-back`
        says (`team`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackTo" }
      responses:
        "200":
          description: The same request, open already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "201":
          description: The request - done, waiting for the OK of the person who made the key, or approved and being carried out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: You do not hold it
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such machine, or no such project of theirs
        "409":
          $ref: "#/components/responses/Conflict"
          description: Only an organisation's machines are handed off; it was not handed to you; the one who handed it off can no longer hold it, so it stays yours; it is being handed off, or a hand-off of it is waiting

  /v1/machines/{machine_id}/check:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: checkGiving
      summary: What a hand-off or a fork for a teammate would clear, and what would stay
      description: |
        Nothing is cleared, but the machine is woken to be asked, and may restart first, its files kept and its programs ended
        (`restarted`). The answer says what would be cleared, what would stay - settings, files, repositories' addresses, by
        name and never by value - and what the team's rules need. A hand-off clears nothing: everything goes with it (`goes`);
        the check says how many Wheelmachine keys would be revoked, how many of your dashboard sign-ins would end, and whether
        every one of yours would (`every_sign_in_ends`). Asked by whoever may do what it checks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GivingAsk" }
      responses:
        "200":
          description: What it would leave
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GivingCheck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such machine, or no such teammate
        "409":
          $ref: "#/components/responses/Conflict"
          description: "Only an organisation's machines are handed off; it is being handed off; or this machine cannot be cleared yet (`not_open`)"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "The machine's answer could not be read, or its sign-out stopped partway: ask again after `Retry-After`"

  /v1/machines/{machine_id}/backups:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Machines]
      operationId: backupMachine
      summary: Back it up - keep its files as they are now
      description: |
        A backup keeps the machine's files, not what runs in it. A fork of the machine is made from one with `backup`,
        at its size or another. The person who holds the machine backs it up, and in an organisation its owners and
        admins.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 200 }
      responses:
        "201":
          description: The backup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The note is longer than 200 characters"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          $ref: "#/components/responses/BadRequest"
          description: "This `Idempotency-Key` was used with a different request"
    get:
      tags: [Machines]
      operationId: listMachineBackups
      summary: The machine's backups, newest first
      description: |
        Needs the `cloud:machines:read` scope. A deleted machine has none. In an organisation, those taken before the
        machine was last handed off are its owners' and admins' alone.
      parameters:
        - $ref: "#/components/parameters/BackupLimit"
      responses:
        "200":
          description: Its backups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`limit` is not between 1 and 200"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/machines/{machine_id}/wait:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Machines]
      operationId: waitForMachine
      summary: Answer when the machine reaches a state
      parameters:
        - name: state
          in: query
          required: true
          schema: { $ref: "#/components/schemas/MachineState" }
        - name: timeout_s
          in: query
          description: How long to wait, in seconds.
          schema: { type: number, minimum: 0, maximum: 600, default: 60 }
      responses:
        "200":
          description: It is in that state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "No `state`, or a `timeout_s` that is not between 0 and 600"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408":
          $ref: "#/components/responses/Timeout"
          description: "The state was not reached in time; or the machine failed, and the answer says why at once"

  /v1/machines/{machine_id}/metrics:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Machines]
      operationId: getMachineMetrics
      summary: What the machine used, step by step, over the last day
      description: |
        Needs the `cloud:machines:read` scope. Its CPUs as a share of its own size, the most memory it held and
        the most it may hold, and the bytes a second it read and wrote on its disk and received and sent on its
        network - a point for each `step` from `since` on. A point a minute is kept, for up to the last day: a step it was
        paused or stopped through has no point, and the numbers can start over at any time
        (`kept_since` says how far back they go). A stopped or archived machine has no points.
      parameters:
        - name: since
          in: query
          description: "From when: a time (RFC 3339), or how long ago (`90s`, `15m`, `6h`, `1d`); the last hour when left out, and at most a day back."
          schema: { type: string, examples: ["6h", "2026-10-23T09:00:00Z"] }
        - name: step
          in: query
          description: "How long each point covers: whole minutes from 1 to 60, in seconds (`300`) or as a span (`5m`)."
          schema: { type: string, default: "60", examples: ["60", "5m", "1h"] }
      responses:
        "200":
          description: Its points, the oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineMetrics" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          $ref: "#/components/responses/NotImplemented"
          description: "This machine has no usage numbers just now"
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/machines/{machine_id}/exec:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    post:
      tags: [Files and commands]
      operationId: execInMachine
      summary: Run a command in the machine and get what it wrote
      description: |
        Needs the `cloud:machines:exec` scope. A paused machine is woken for it. Commands run as the machine's user
        unless `root` is asked for; root is inside the machine only, and its `HOME` is root's own.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: It ran; its exit code says how it ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine cannot run a command in the state it is in; or its internet policy cannot be applied just now (`not_open`)"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "The command's result did not come back: it may or may not have run, so check before running it again"
        "504":
          $ref: "#/components/responses/Timeout"
          description: "The command ran longer than 10 minutes; it may still be running in the machine"

  /v1/machines/{machine_id}/terminal:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Files and commands]
      operationId: openTerminal
      summary: Open an interactive terminal in the machine (WebSocket)
      description: |
        Needs the `cloud:machines:exec` scope. This route is a WebSocket upgrade, not a plain request: connect with
        `Upgrade: websocket` (version 13) and the usual `Authorization: Bearer` header. A paused machine is woken for
        it; the terminal is a login shell unless a command is given, as the machine's user unless `root` is asked for.
        Its programs get the machine's secrets as environment variables, as a command does (a secret kept outside the
        machine as its placeholder), when they are 64 KiB or less together as JSON; past that the terminal opens without
        them. As root, `HOME` is root's own.

        Over the socket, each message is one event. From you: a **binary** message is typed in (keystrokes, bytes as
        they are); a **text** message `{"resize":{"cols":C,"rows":R}}` sets the window. From us: a **binary** message
        is what the program wrote on its terminal; a final **text** message `{"exit_code":N}` (or `{"reason":...,
        "message":...}` when it did not end by itself) says how it ended, just before the socket closes.

        Ask for the protocol `wm.terminal` to be told over the socket why a terminal could not open: one text message
        `{"reason": <the code>, "status": <the status>, "message": ...}`, then a close with code 4000 and that status (4501: not
        available). Without it, the error is an ordinary HTTP answer.

        A terminal ends when the sign-in or key it was opened with ends, or the account can no longer spend, within half a
        minute, with one text message as above (4401 signed out or the key revoked, 4403 the account on hold, 4402 it cannot
        spend; in an organisation also 4403 when your role, teams or limits change or you are taken out, 4404 when you no longer
        reach the machine, 4409 when it moves to another project), then a close with code 4000 and that status.

        We never log what is typed or shown. The audit records only that a terminal opened and closed.
      parameters:
        - { name: cols, in: query, schema: { type: integer, minimum: 1, maximum: 4096, default: 80 } }
        - { name: rows, in: query, schema: { type: integer, minimum: 1, maximum: 4096, default: 24 } }
        - name: user
          in: query
          schema: { type: string, enum: [user, root], default: user }
        - name: term
          in: query
          description: The terminal's kind, set as `TERM` inside (default `xterm-256color`).
          schema: { type: string, maxLength: 64 }
        - name: cwd
          in: query
          description: Where it starts, an absolute path; the work folder when left out.
          schema: { type: string, maxLength: 1024 }
        - name: cmd
          in: query
          description: A word of the command to run; repeat for each word. Left out, a login shell opens.
          schema: { type: string }
      responses:
        "101": { description: "Switching to the terminal's WebSocket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "426": { $ref: "#/components/responses/BadRequest" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/machines/{machine_id}/screen:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Files and commands]
      operationId: openScreen
      summary: Open the machine's screen - its desktop (WebSocket)
      description: |
        Needs the `cloud:machines:exec` scope: whoever holds the screen works the machine, as at a terminal. This
        route is a WebSocket upgrade, not a plain request: connect with `Upgrade: websocket` (version 13) and the usual
        `Authorization: Bearer` header. A paused machine is woken for it, and its `desktop` app (see Apps) is turned on
        when it is not running - no port is opened for it and no link made: the screen is reached here alone, never
        at a web address of the machine's. It can take up to a minute while the desktop starts.

        In an organisation, only the person who holds the machine works its screen. Its owners and admins and its
        team's managers - whose `access` to it is `watch` - are given a screen they only watch: the same desktop,
        which takes no key, no pointer, no clipboard and no new size, and never gives them the clipboard. Nothing is
        woken or turned on for them: a machine that is not running answers 409 (it is watched while it runs), one whose
        desktop is off 409, and one that cannot be watched yet 409 until it next starts.

        Over the socket, **binary** messages carry the screen's own stream both ways - RFB (RFC 6143), the protocol
        VNC viewers speak - so any viewer that speaks it over a WebSocket shows the desktop and works it: keyboard,
        pointer, the desktop's size following the window's, and the clipboard. Text messages you send are not passed
        on. A final **text** message `{"reason": ..., "status": ..., "message": ...}` says why the screen ended when it
        did not end by itself, just before the socket closes; the desktop closing it is a plain close (1000).

        A caller may ask for the protocol `wm.screen` on the socket, and is answered with it (a viewer that asks for
        `binary` is answered with that); the dashboard's page asks for `wm.screen`, beside its sign-in's token
        (`wm.csrf.<token>`), from its own address. Such a caller is told a screen that cannot open over the socket, as
        a terminal is: it is switched, sent one text message, and closed with the code 4000 and the status (4409: the
        machine has no desktop, `no_apps` when it has no apps).

        A screen ends as a terminal does, with the same codes, and after a day at most (4408). One message carries at most 4
        MiB from you.

        We never log what is shown or typed. The audit records only that a screen opened and closed.
      responses:
        "101": { description: "Switching to the screen's WebSocket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine has no apps (`no_apps`), it has no desktop, its desktop did not turn on, or it cannot be reached in the state it is in"
        "426": { $ref: "#/components/responses/BadRequest" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
        "502":
          $ref: "#/components/responses/Unreadable"
          description: "The machine's answer about its apps could not be read, or its desktop did not answer as a screen does (`unavailable`); try again in a moment"
        "503": { $ref: "#/components/responses/Unavailable" }
        "504":
          $ref: "#/components/responses/Timeout"
          description: "The machine's desktop did not answer in time; it may still be starting"

  /v1/machines/{machine_id}/files:
    parameters:
      - $ref: "#/components/parameters/MachineId"
      - name: path
        in: query
        required: true
        description: "Inside the machine's home (`home/...`) or its work folder, where commands start (`work/...`)."
        schema: { type: string, maxLength: 1024 }
    get:
      tags: [Files and commands]
      operationId: readFile
      summary: Read a file
      description: Needs the `cloud:machines:exec` scope.
      responses:
        "200":
          description: The file's bytes
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: "The account cannot spend now, or the person who holds the machine has come to their own limit for the month"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
    put:
      tags: [Files and commands]
      operationId: writeFile
      summary: Write a file, making the folders on the way
      description: Needs the `cloud:machines:exec` scope and a `Content-Length`.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        "204": { description: Written }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: "The account cannot spend now, or the person who holds the machine has come to their own limit for the month"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "411": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
    delete:
      tags: [Files and commands]
      operationId: deleteFile
      summary: Delete a file, or a folder
      description: |
        Needs the `cloud:machines:exec` scope. A folder goes only when it is empty, unless `recursive` is true: then
        everything in it goes with it. A link is taken away as itself, never what it points to. The home and the work
        folder themselves cannot be deleted.
      parameters:
        - name: recursive
          in: query
          description: With a folder, everything in it too.
          schema: { type: boolean, default: false }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The folder is not empty and `recursive` is not true, it belongs to another user of the machine, or the machine cannot reach its files in the state it is in"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"

  /v1/machines/{machine_id}/folder:
    parameters:
      - $ref: "#/components/parameters/MachineId"
      - name: path
        in: query
        required: true
        description: "A folder of the machine's home (`home`, `home/...`) or of its work folder, where commands start (`work`, `work/...`)."
        schema: { type: string, maxLength: 1024 }
    get:
      tags: [Files and commands]
      operationId: listFolder
      summary: What a folder holds
      description: |
        Needs the `cloud:machines:exec` scope. Its own entries, folders first and then by name, each with its kind, its
        size and when it last changed; at most 1,000, and `truncated` says when there were more. A paused machine is
        woken for it.
      responses:
        "200":
          description: The folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "The path is not one of the machine's home or work folder, or it names a file"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine cannot reach its files in the state it is in"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
        "501":
          $ref: "#/components/responses/NotImplemented"
          description: "This machine cannot list its folders"

  /v1/machines/{machine_id}/ports:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Ports]
      operationId: listPorts
      summary: The machine's ports open at web addresses
      description: Needs the `cloud:machines:read` scope.
      responses:
        "200":
          description: Its open ports, lowest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Ports]
      operationId: openPort
      summary: Open a port of the machine at a web address of its own
      description: |
        Needs the `cloud:machines:write` scope. Private unless `public` is true. A port that is open already is
        answered `200`, made public or private as asked (left out, `public` is false). The ports the machine itself
        uses (5900, 6080, 7070, 9222, 9223 and 9224) cannot be opened (`400`), and a machine has at most 20 open
        (`429` with the code `limit_reached`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortOpen" }
      responses:
        "200":
          description: It was open already; it is public or private as asked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Port" }
        "201":
          description: Open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Port" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/machines/{machine_id}/ports/{port}:
    parameters:
      - $ref: "#/components/parameters/MachineId"
      - $ref: "#/components/parameters/Port"
    delete:
      tags: [Ports]
      operationId: closePort
      summary: Close a port's web address
      description: |
        Needs the `cloud:machines:write` scope. The address answers 404 from then on, and links made for it no longer
        open it. Closing a port that is not open is answered `204` all the same.
      responses:
        "204": { description: Closed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "Being handed off: nothing of a machine changes while it is"

  /v1/machines/{machine_id}/ports/{port}/link:
    parameters:
      - $ref: "#/components/parameters/MachineId"
      - $ref: "#/components/parameters/Port"
    post:
      tags: [Ports]
      operationId: linkPort
      summary: A link that lets one browser into a private address for a while
      description: |
        Needs the `cloud:machines:read` scope. The link opens once, within five minutes. The browser that opens it
        is given access to that one address for `access_s` seconds (a cookie for that address alone) and is taken to
        `path` on it; a page that only previews links does not use it up. In an organisation the link and that access
        are yours: they open the address only while you may still go into the machine - in the organisation, with a
        role that goes into machines, and the machine one you reach. It is shown in this answer only; each call makes a new
        one. A port that is not open is
        answered `404`.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortLinkCreate" }
      responses:
        "201":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/machines/{machine_id}/apps:
    parameters:
      - $ref: "#/components/parameters/MachineId"
    get:
      tags: [Apps]
      operationId: listApps
      summary: The apps in the machine, and whether each is on
      description: |
        Needs the `cloud:machines:read` scope. The machine is asked: a paused one is woken for it, as for a command,
        and the account must be able to spend. In an organisation, billing, which sees what machines cost and runs
        nothing in them, is refused (`403`); and one who watches a member's machine and never uses it (`access`
        `watch`) is answered while it runs - nothing is woken for them, and one not running answers `409`.
      responses:
        "200":
          description: Its apps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine has no apps (`no_apps`), or it cannot be reached in the state it is in; or, to one who only watches it, it is not running"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
        "502": { $ref: "#/components/responses/Unreadable" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504":
          $ref: "#/components/responses/Timeout"
          description: "The machine did not answer about its apps in time"

  /v1/machines/{machine_id}/apps/{app}/on:
    parameters:
      - $ref: "#/components/parameters/MachineId"
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Apps]
      operationId: turnAppOn
      summary: Turn an app on
      description: |
        Needs the `cloud:machines:write` scope. It may take up to a minute while the app starts. An app starts with
        the machine's own settings, not its secrets: an app that needs a key takes it in its own settings. A web app's
        port is opened private when it is not open already, with the limits of opening a port by hand; a port open
        already is left as it is. The answer then carries a one-time `link` that lands on the app's own page. An app
        with a token of its own gives it in `token`, in this answer alone. Turning on an app that is on already is
        answered the same way.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppLinkCreate" }
      responses:
        "200":
          description: It is on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No such machine, or no such app in it"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine has no apps (`no_apps`), the app did not turn on (in the machine's own words), or the machine cannot be reached in the state it is in"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "A web app came on, but the machine has as many ports open as it may (`limit_reached`): close one, then turn it on again; or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
        "502": { $ref: "#/components/responses/Unreadable" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504":
          $ref: "#/components/responses/Timeout"
          description: "The machine did not answer within a minute; the app may still come on"

  /v1/machines/{machine_id}/apps/{app}/off:
    parameters:
      - $ref: "#/components/parameters/MachineId"
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Apps]
      operationId: turnAppOff
      summary: Turn an app off
      description: |
        Needs the `cloud:machines:write` scope. A web app's port is closed with it when turning it on opened the port
        and the port is still private; a port you opened yourself, or made public, stays open. Turning off an app that
        is off already is answered the same way. The code editor (`editor`) is always on: turning it off is refused
        (`409`), and nothing is asked of the machine.
      responses:
        "200":
          description: It is off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No such machine, or no such app in it"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The app is the code editor, which is always on; the machine has no apps (`no_apps`), the app did not turn off (in the machine's own words), or the machine cannot be reached in the state it is in"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
        "502": { $ref: "#/components/responses/Unreadable" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504":
          $ref: "#/components/responses/Timeout"
          description: "The machine did not answer about its apps in time"

  /v1/machines/{machine_id}/apps/{app}/link:
    parameters:
      - $ref: "#/components/parameters/MachineId"
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Apps]
      operationId: linkApp
      summary: A fresh link into a web app that is on
      description: |
        Needs the `cloud:machines:read` scope. Made as a port's link is: it opens once, within five minutes, lets the
        browser that opens it reach the app's address for `access_s` seconds, and lands on the app's own page. It is
        shown in this answer only. When the app's address is not open - the machine started the app by itself, or the
        address was closed since - it is opened private first, as turning the app on opens it, and closed again when
        the app is turned off; an address open already is left as it is. An app that is not a web app is answered
        `400`; one that is off, `409` (turn it on first).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppLinkCreate" }
      responses:
        "201":
          description: The app, with its link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No such machine, or no such app in it"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine has no apps (`no_apps`), or the app is off"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "The app's address could not open: the machine has as many ports open as it may (`limit_reached`), close one, then try again; or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
        "502": { $ref: "#/components/responses/Unreadable" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504":
          $ref: "#/components/responses/Timeout"
          description: "The machine did not answer about its apps in time"

  /v1/machines/{machine_id}/apps/{app}/show:
    parameters:
      - $ref: "#/components/parameters/MachineId"
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Apps]
      operationId: showApp
      summary: Show an app on the machine's screen
      description: |
        Needs the `cloud:machines:exec` scope: it acts on the machine's desktop, as its screen does (`openScreen`). The
        machine opens the app's window on its own desktop, signed in where the app signs in, so whoever watches the
        machine's screen sees it there - nothing to copy or approve, no address opened and no link or token made. It
        may take up to two minutes, and is waited for that long: the machine starts its desktop first when it is off,
        and gives the app's window up to a minute and a half to open. Showing an app that is shown already brings its
        window to the front. An app that is off, or has no window (a service), is answered `409` in the machine's own
        words.
      responses:
        "200":
          description: It is shown on the machine's screen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No such machine, or no such app in it"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "The machine has no apps (`no_apps`), the app is off, has no window or could not be shown (in the machine's own words), or the machine cannot be reached in the state it is in"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Too many calls just now (`rate_limited`), or waking the machine would run more CPUs at once than its account, or the person who holds it, may (`limit_reached`): pause or stop another first"
        "502": { $ref: "#/components/responses/Unreadable" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504":
          $ref: "#/components/responses/Timeout"
          description: "The machine did not answer within two minutes; the app may still come up on its screen, by itself"

  /v1/secrets:
    get:
      tags: [Secrets]
      operationId: listSecrets
      summary: The account's secrets, by name, and the machines that get each
      description: |
        Needs the `cloud:machines:read` scope. A secret's value is never shown again once it is set: not here, not in
        any other answer, not in the audit. A key limited to some projects lists only the secrets its projects'
        machines get, and sees only those machines.
      responses:
        "200":
          description: The secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/NotSetUp" }

  /v1/secrets/presets:
    get:
      tags: [Secrets]
      operationId: listSecretPresets
      summary: The AI keys the API knows by their names
      description: |
        Any key of the account may read these. Each is a model provider's key: the names it is set under, the hosts it is
        sent to and the headers it goes in, in the order agents choose between the keys present. A secret set under
        one of these names is kept outside the machines by its preset unless it is set with `outside: false`, and is on
        every machine of the account unless it is set with `every_machine: false`.
      responses:
        "200":
          description: The presets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretPresetList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/SecretName"
    put:
      tags: [Secrets]
      operationId: setSecret
      summary: Set a secret, or set it anew
      description: |
        Needs the `cloud:secrets:write` scope and a key not limited to some projects: secrets belong to the account, and a key
        limited to some projects cannot set, delete or give them (403). The value is encrypted at once and never
        shown again; the machines that get the secret get the new value from their next command,
        terminal or SSH session, and one kept outside changes on those that run within moments.
        `outside` and `every_machine`, left out, go back to their defaults. An account keeps at most 200 secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretSet" }
      responses:
        "200":
          description: Set anew
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "201":
          description: Set for the first time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/NotSetUp" }
    delete:
      tags: [Secrets]
      operationId: deleteSecret
      summary: Delete a secret
      description: |
        Needs the `cloud:secrets:write` scope and a key not limited to some projects. The secret is taken off every machine
        that was given it or held it, within moments: one set
        again later under the same name goes to none of the machines that named it until it is given anew.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/NotSetUp" }

  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: The models your AI keys can use
      description: |
        Needs the `cloud:machines:read` scope; in an organisation, a role that runs nothing in machines (billing) is
        refused. The models of each AI key - a secret kept outside the machines by its name's preset - as its provider lists
        them for the key, grouped by provider in the order agents choose between keys, the newest first where the provider says
        when each came out. Each list is read with its key and kept for an hour; a key set anew is read afresh. A
        provider that turns the request away or does not answer is said so in `suppliers`, with the list it last gave, for
        a day, and when that was read; one that refuses the key is said so with no list at all. A key limited to some projects lists the models of the AI keys its
        projects' machines get; in an organisation the keys are the organisation's, and nobody sees their values.

        Each model says what it costs and how it scores, where these are known. Its `price` is the list price of the
        provider that bills for it - the one whose key it is - a million tokens in and out, in US dollars: OpenRouter's
        from its own list for your key, the others' from each provider's own price page, with
        the day it was checked. Wheelmachine charges nothing for a model: you pay its provider with your own key. Its
        `intelligence` is its score on LMArena's text leaderboard (CC BY 4.0): the best
        score the model has there, with the day the board
        was published. A model a price page or the board does not name has none - never another model's.

        In an organisation that keeps lists of the models its people may use, a person limited to one is shown its models
        alone, and the list in `allowed`: the one for the team `project` names, which may be left out when they are in
        one team. Owners and admins are shown every model.
      parameters:
        - $ref: "#/components/parameters/Team"
        - name: refresh
          in: query
          description: Read each list again now, when it was read more than a minute ago. A person's lists are read thirty times a minute at most, and an organisation's people's 120 a minute all told.
          schema: { type: boolean }
        - name: agent
          in: query
          description: Only the models this agent can use - those of the providers it works with (`GET /v1/agents`).
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$", examples: [codex] }
      responses:
        "200":
          description: The models, and how each provider's list stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "A `refresh` that is not `true` or `false`; or, limited to a list, no team named where you are in several"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No agent of that name in your machines, or the `project` is not a team you reach"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "Models cannot be read just now (`unavailable`)"

  /v1/models/allowed:
    get:
      tags: [Models]
      operationId: listAllowedModels
      summary: The lists of the models your organisation's people may use
      description: |
        For an organisation's owners and admins, with a key for the whole organisation (`cloud:machines:read`). Every
        list it keeps, the widest first: the organisation's, each team's, each role's, each person's. A person's choices
        are limited to the most specific list they have - theirs, then their role's in the team, then the team's, then the
        organisation's - and with none to every model. Owners and admins are never limited to one.
      responses:
        "200":
          description: The lists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedModelsList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not an owner or an admin of the organisation, or a key limited to some projects"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A person's own account, which keeps no lists"

  /v1/models/allowed/organisation:
    put:
      tags: [Models]
      operationId: setOrganisationAllowedModels
      summary: Set the models everyone in the organisation may use
      description: |
        For owners and admins, with a key for the whole organisation (`cloud:machines:write`). One to ten models, each
        one a provider of the organisation's AI keys lists for the key now (`GET /v1/models`), in order: the first is the
        one an agent starts on where its person's choice is not one of them, or they chose none. It holds everyone
        without a list of a team, a role or their own. A choice a person made that is not on it is set aside - their
        agent starts on the first model of the list it can use - and is theirs again should a list come to include it. It
        reaches running machines at once, and the others when they next start; inside them, the
        organisation's AI keys go on only for a chat with its models, and for what costs next to nothing (Models).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowedModelsSet" }
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedModels" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "None, or more than ten, a model named twice, of no known provider or not written as `provider/model`, or one its provider does not list for the key"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not an owner or an admin of the organisation, or a key limited to some projects"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A person's own account; or the organisation has no key of a model's provider, or the provider refused it"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "A provider did not answer, so its model could not be checked; or models cannot be read just now"
    delete:
      tags: [Models]
      operationId: clearOrganisationAllowedModels
      summary: Let everyone in the organisation use every model again
      description: |
        For owners and admins (`cloud:machines:write`). Those it applied to are limited to the lists of their team, role or own,
        where they have one, else to none. Doing it twice changes nothing.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not an owner or an admin of the organisation, or a key limited to some projects"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A person's own account"

  /v1/models/allowed/teams/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      tags: [Models]
      operationId: setTeamAllowedModels
      summary: Set the models a team may use
      description: |
        As the organisation's list (`PUT /v1/models/allowed/organisation`), for the people of one team, in place of the
        organisation's: it applies to their choices in this team, unless a list of their role or their own does.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowedModelsSet" }
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedModels" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "None, or more than ten, a model named twice, of no known provider or not written as `provider/model`, or one its provider does not list for the key"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not an owner or an admin of the organisation, or a key limited to some projects"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No such project in the organisation"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A person's own account; or the organisation has no key of a model's provider, or the provider refused it"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "A provider did not answer, so its model could not be checked; or models cannot be read just now"
    delete:
      tags: [Models]
      operationId: clearTeamAllowedModels
      summary: Take a team's list away
      description: |
        For owners and admins (`cloud:machines:write`): the team's people are limited to the organisation's list again,
        where it keeps one. A list of a team since deleted is taken away too. Doing it twice changes nothing.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not an owner or an admin of the organisation, or a key limited to some projects"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Not a project's id"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A person's own account"

  /v1/models/allowed/roles/{role}:
    parameters:
      - name: role
        in: path
        required: true
        description: |
          A person's level in the team their choice is for: `member` (a plain member), `approver`, `manager` (a team
          manager) or `full` (a full manager).
        schema: { type: string, enum: [member, approver, manager, full] }
    put:
      tags: [Models]
      operationId: setRoleAllowedModels
      summary: Set the models people of a team level may use
      description: |
        As the organisation's list (`PUT /v1/models/allowed/organisation`), for everyone of this level in the team their
        choice is for, in place of their team's and the organisation's: it applies to them unless a list of their own does.
        The path says `roles`, but a level here is a person's place in a team (member, approver, manager, full), not
        their role in the organisation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowedModelsSet" }
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedModels" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "None, or more than ten, a model named twice, of no known provider or not written as `provider/model`, or one its provider does not list for the key"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not an owner or an admin of the organisation, or a key limited to some projects"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No such role"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A person's own account; or the organisation has no key of a model's provider, or the provider refused it"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "A provider did not answer, so its model could not be checked; or models cannot be read just now"
    delete:
      tags: [Models]
      operationId: clearRoleAllowedModels
      summary: Take a role's list away
      description: For owners and admins (`cloud:machines:write`). Doing it twice changes nothing.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not an owner or an admin of the organisation, or a key limited to some projects"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No such role"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A person's own account"

  /v1/models/allowed/people/{person_id}:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    put:
      tags: [Models]
      operationId: setPersonAllowedModels
      summary: Set the models one person may use
      description: |
        As the organisation's list (`PUT /v1/models/allowed/organisation`), for one person of the organisation, in every
        team, in place of every other list. Never for an owner or an admin, to whom no list applies, nor for billing, which
        chooses no model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowedModelsSet" }
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedModels" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "None, or more than ten, a model named twice, of no known provider or not written as `provider/model`, or one its provider does not list for the key"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not an owner or an admin of the organisation, or a key limited to some projects"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No such person in the organisation"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "An owner, an admin or billing; a person's own account; or the organisation has no key of a model's provider, or the provider refused it"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "A provider did not answer, so its model could not be checked; or models cannot be read just now"
    delete:
      tags: [Models]
      operationId: clearPersonAllowedModels
      summary: Take a person's own list away
      description: |
        For owners and admins (`cloud:machines:write`): the person is limited to their role's, team's or organisation's
        list again, where there is one. A list of a person since gone is taken away too. Doing it twice changes nothing.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Not an owner or an admin of the organisation, or a key limited to some projects"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Not a person's id"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A person's own account"

  /v1/agents:
    get:
      tags: [Models]
      operationId: listAgents
      summary: The agents in your machines, and the model each starts on
      description: |
        Needs the `cloud:machines:read` scope; in an organisation, a role that runs nothing in machines (billing) is
        refused. The agents your machines carry, as the newest of them said it - and OpenClaw, a web app with an agent of
        its own - each with the providers whose AI keys it can use, the model chosen for it and by whom, and what it starts
        on with your keys. In an organisation they are those of the machines you hold: another person's machines never
        shape them. Before any machine has said, one of yours that is running is asked; with none, the list is empty. In an
        organisation, `project` names the team whose choices of yours these are; it may be left out when you are in one
        team. Limited to a list of the models you may use there, it says the list (`allowed`), and each agent stands by it.
      parameters:
        - $ref: "#/components/parameters/Team"
      responses:
        "200":
          description: The agents, and the model chosen for every agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "You are in more than one team of the organisation, and `project` names none of them"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "The `project` is not a team you reach"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A `project` named in a person's own account, which has no teams"

  /v1/agents/model:
    put:
      tags: [Models]
      operationId: chooseEveryAgentModel
      summary: Choose one model for every agent
      description: |
        Needs the `cloud:machines:write` scope; in a person's own account, a key not limited to some projects. The model is one
        that a provider of your AI keys lists for the key (`GET /v1/models`), checked with the provider as it is chosen - and,
        limited to a list of the models you may use, one of the list. Each agent that can use its provider starts on it, the
        others on their defaults; it takes the place of each agent's own choice. It reaches your running machines
        at once, and the others when they next start.
      parameters:
        - $ref: "#/components/parameters/Team"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelChoice" }
      responses:
        "200":
          description: Chosen; the agents, as they stand now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "A model of no known provider or not written as `provider/model`, one its provider does not list for your key, or no team named where you are in several"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Your role or key does not allow it; or the model is not one of those you may use"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "The `project` is not a team you reach"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "You have no key of the model's provider, or the provider refused it; you keep 64 choices already, or you chose too many models; or a `project` named in a person's own account"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "The provider did not answer, so the model could not be checked; or models cannot be read just now"
    delete:
      tags: [Models]
      operationId: clearEveryAgentModel
      summary: Stop using one model for every agent
      description: |
        Needs the `cloud:machines:write` scope; in a person's own account, a key not limited to some projects. Each agent starts
        on its own choice again, else on its default. Doing it twice changes nothing.
      parameters:
        - $ref: "#/components/parameters/Team"
      responses:
        "204": { description: Done }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "No team named where you are in several"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "The `project` is not a team you reach"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A `project` named in a person's own account"

  /v1/agents/{agent}/model:
    parameters:
      - $ref: "#/components/parameters/AgentName"
    put:
      tags: [Models]
      operationId: chooseAgentModel
      summary: Choose the model an agent starts on
      description: |
        Needs the `cloud:machines:write` scope; in a person's own account, a key not limited to some projects. The model is one
        of a provider the agent can use (`GET /v1/agents`), that the provider lists for your key (`GET /v1/models`), checked
        with the provider as it is chosen - and, limited to a list of the models you may use, one of the list. It reaches your
        running machines at once, and the others when they next start; the agent, where it runs, starts on it
        at its next start.
      parameters:
        - $ref: "#/components/parameters/Team"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelChoice" }
      responses:
        "200":
          description: Chosen; the agent, as it stands now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "A model of no known provider or not written as `provider/model`, of a provider the agent cannot use, or one its provider does not list for your key; or no team named where you are in several"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "Your role or key does not allow it; or the model is not one of those you may use"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "No agent of that name in your machines, or the `project` is not a team you reach"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "You have no key of the model's provider, or the provider refused it; you keep 64 choices already, or you chose too many models; or a `project` named in a person's own account"
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "The provider did not answer, so the model could not be checked; or models cannot be read just now"
    delete:
      tags: [Models]
      operationId: clearAgentModel
      summary: Let an agent start on its default again
      description: |
        Needs the `cloud:machines:write` scope; in a person's own account, a key not limited to some projects. The agent starts on
        the model chosen for every agent where it can use it, else on its default. Doing it twice changes nothing.
      parameters:
        - $ref: "#/components/parameters/Team"
      responses:
        "204": { description: Done }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "No team named where you are in several"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "Not an agent's name, or the `project` is not a team you reach"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "A `project` named in a person's own account"

  /v1/sizes:
    get:
      tags: [Catalogue]
      operationId: listSizes
      summary: The sizes a machine without a GPU comes in, and what an hour of each costs
      description: What an hour of a machine of each size running comes to - the price its running time is counted at. A paused machine runs no time. Only the sizes offered now are listed.
      responses:
        "200":
          description: The sizes, the smallest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SizeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/regions:
    get:
      tags: [Catalogue]
      operationId: listRegions
      summary: Places a machine can be asked to run near
      description: Only the places machines run in now. The machine says where it actually runs in `location`.
      responses:
        "200":
          description: The places
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Region" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/gpus:
    get:
      tags: [Catalogue]
      operationId: listGpus
      summary: GPUs, where they are and what an hour costs
      responses:
        "200":
          description: The GPUs on offer now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GpuList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/usage:
    get:
      tags: [Account]
      operationId: getUsage
      summary: Each machine's running time and cost in a month
      description: |
        Each machine the caller reaches, by its name - and in an organisation whose it is; to billing, which reaches no
        machine, every machine of the organisation.
      parameters:
        - name: month
          in: query
          description: "`YYYY-MM`; this month when left out."
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The month's usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`month` is not `YYYY-MM`"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "The `project` is not one this key reaches"

  /v1/usage/limits:
    get:
      tags: [Account]
      operationId: getLimits
      summary: Every limit that holds the account, and how near each is
      description: |
        The limits for the month, in one place: the account's own and Wheelmachine's for it, the lower of which holds;
        in an organisation each team's budget and each person's own limits; those that apply to you, with how much of each
        is used; and the thresholds told this month (50%, 75%, 90% and 100% of each). A limit left unset is no limit of
        its own: the ones above it still hold. Limits for the month lift at the start of the next, in UTC
        (`resets_at`).

        What you are shown is what you may see. Your own account: everything. In an organisation, its owners, admins
        and billing see every team and person with what each spent; a team's manager sees the teams they manage, with
        what each spent, and the members of them; a member sees the budgets of their own teams and their own limits.
        The organisation's own amounts are null to anyone but its owners, admins and billing: `limited` and `percent`
        still say whether a limit holds it, and how near it is.
      responses:
        "200":
          description: The limits, as you may see them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageLimits" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`X-Account` names an organisation you are not in"

  /v1/usage/limits/account:
    put:
      tags: [Account]
      operationId: setAccountLimit
      summary: Set the account's own limit for the month
      description: |
        Dollars a month, from 0 to 10000000, to the cent; null takes it away. Once the account's machines come to it,
        they pause with everything in them kept, and nothing starts until the next month or a higher limit. Set in your
        own account, with a key that holds `cloud:*`; in an organisation by its owners (with a key, one that holds
        `cloud:*`) and by billing, signed in to the dashboard - billing's keys only read. It may not be above
        Wheelmachine's limit for the account, where that is set (`account.wheelmachine.month_cap_usd`). Each change is
        in the audit (`account.limit`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountLimitSet" }
      responses:
        "200":
          description: The limits as they are now, as `GET /v1/usage/limits` answers them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageLimits" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`month_cap_usd` is left out, is neither null nor dollars from 0 to 10000000, or is above Wheelmachine's limit"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "In an organisation, you are not an owner or billing; or billing called with a key"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`X-Account` names an organisation you are not in"

  /v1/usage/alerts:
    get:
      tags: [Account]
      operationId: getSpendAlerts
      summary: The account's spend alert, and what passed this month
      description: |
        An alert only tells; a limit for the month pauses machines. An account may set an alert amount for the month, and each
        limit is told at 50%, 75%, 90% and 100%. Each is e-mailed once a month: in your own account to you; in an organisation
        to its owners, admins and billing, a team's budget also to its full managers, and a person's own limit to that person
        alone. Turn these e-mails off per account (`/v1/mail/preferences`). The figures are those of `/v1/usage`, about a minute
        behind.
      responses:
        "200":
          description: The alert, the limit, what passed this month, and whether you are e-mailed of it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendAlerts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`X-Account` names an organisation you are not in"
    put:
      tags: [Account]
      operationId: setSpendAlert
      summary: Set the account's spend alert
      description: |
        Dollars a month, from 0.01 to 10000000, to the cent; null takes the alert away. Set in your own account, and in
        an organisation by its owners and admins - with a key, one that holds `cloud:*`. An amount is told once a month;
        moved, it is told again when it is passed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpendAlertSet" }
      responses:
        "200":
          description: The alert as it is now, as `GET` answers it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendAlerts" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`alert_usd` is left out, or is neither null nor dollars from 0.01 to 10000000"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`X-Account` names an organisation you are not in"

  /v1/mail/preferences:
    get:
      tags: [Account]
      operationId: listMailPreferences
      summary: Which e-mails you get
      description: |
        Your choice of spend alerts in your own account and in each organisation you are in, signed in to the dashboard:
        each on until you turn it off. Invitations are not among them: one comes only when someone invites your address.
        `email_on` says whether we can send e-mail just now.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: Your own account first, then each organisation you are in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailPreferenceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/mail/preferences/{account_id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    put:
      tags: [Account]
      operationId: setMailPreference
      summary: Turn spend alerts on or off in one account
      description: |
        In your own account (your own id), or in an organisation you are in, signed in to the dashboard. Any other
        account is answered `404`, whether it is there or not. Written in your own account's audit.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailPreferenceSet" }
      responses:
        "200":
          description: Your choice in that account, as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailPreference" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`spend_alerts` is left out"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such account of yours
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/mail/unsubscribe:
    get:
      tags: [Account]
      operationId: openUnsubscribeLink
      summary: A spend alert's link, opened in a browser
      description: |
        Changes nothing: sends the browser on to the dashboard's page, which asks before it turns the alerts off. The
        link's `token` is carried there after the `#`, where no server sees it.
      security: []
      parameters:
        - name: token
          in: query
          description: The token of a spend alert's link.
          schema: { type: string, maxLength: 1024 }
      responses:
        "303": { description: "On to https://app.wheelmachine.ai/unsubscribe, the token after the `#`" }
    post:
      tags: [Account]
      operationId: unsubscribe
      summary: Turn off spend alerts by a link in one
      description: |
        No key and no sign-in: the link's token is enough, and it does this one thing. Each spend alert carries one, good for 60
        days. Mail programs use one-press unsubscribe (RFC 8058): the alert's `List-Unsubscribe` header gives this address with
        `?token=`, and the program posts `List-Unsubscribe=One-Click`. The dashboard's page posts the token as JSON, with
        `spend_alerts` true to turn them back on. A wrong or expired token answers `404`.
      security: []
      parameters:
        - name: token
          in: query
          description: The token, in a one-press post (RFC 8058), as the `List-Unsubscribe` header gives it.
          schema: { type: string, maxLength: 1024 }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnsubscribeRequest" }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [List-Unsubscribe]
              properties:
                List-Unsubscribe: { const: One-Click }
      responses:
        "200":
          description: The alerts' choice in that account, as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailPreference" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "A form that is not `List-Unsubscribe=One-Click`"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The token is not one of ours, or has run out
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/mail/sign-out:
    post:
      tags: [Sign-in]
      operationId: signOutByLink
      summary: Sign out everywhere by the link in a new sign-in's e-mail
      description: |
        No key and no sign-in: the link's token is enough, and it does this one thing. The e-mail sent when your account signs in
        from a new browser links to https://app.wheelmachine.ai/sign-out with this token after the `#`; the page asks first,
        then posts it here. It names you alone and works once, for 24 hours; used again it answers `409`.

        It does what signing out everywhere does on the Account page (`DELETE /v1/sessions`): every sign-in of yours to
        the dashboard ends; every program signed in through the browser (`wm login`, an app) is signed out, its key
        revoked, in your own account and in each organisation you are in; and every browser you signed in from is
        forgotten, so the next sign-in from any of them is e-mailed again. Keys made on the Keys page, or by another key,
        keep working. It takes JSON alone. The browser that posts it is signed out too when it was signed in as you;
        another person's sign-in there stays. A token that is not one of ours, was changed, has run out, or is of an
        account closed since is answered `404`, in the same words.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignOutRequest" }
      responses:
        "200":
          description: Signed out everywhere
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedOut" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Not JSON, or no `token`
        "404":
          $ref: "#/components/responses/NotFound"
          description: The token is not one of ours, or has run out
        "409":
          $ref: "#/components/responses/Conflict"
          description: The link was used already
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/credit:
    get:
      tags: [Billing]
      operationId: getCredit
      summary: The account's credit and its entries, the newest first
      description: |
        The credit left, whether it has run out, whether credit can be bought, and a page of its entries. In
        an organisation it is the organisation's, read by its owners, admins and billing; in your own account, by you.
        A key limited to some projects does not read it: the credit is the whole account's.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: The credit and a page of its entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: An organisation's member, or a key limited to some projects

  /v1/credit/checkout:
    get:
      tags: [Billing]
      operationId: getCreditCheckout
      summary: Checkout in the page
      description: |
        What the dashboard's Billing page needs to open Paddle's checkout. Read by those who buy the account's credit, as
        `POST /v1/credit/purchases` is.
      responses:
        "200":
          description: What the checkout is opened with
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditCheckout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: An organisation's admin or member, or a key limited to some projects
        "409":
          $ref: "#/components/responses/Conflict"
          description: This account does not buy credit
        "501":
          $ref: "#/components/responses/NotImplemented"
          description: Credit cannot be bought just now (`buy.open` is false)
        "502":
          $ref: "#/components/responses/Unavailable"
          description: Paddle's prices could not be read just now; try again in a moment

  /v1/credit/purchases:
    post:
      tags: [Billing]
      operationId: buyCredit
      summary: Buy credit
      description: |
        Starts a checkout for one of the amounts in `buy.amounts_usd` - $10, $25, $50 or $100 - of credit for the
        account, and answers where it is paid. Nothing is charged until you pay in Paddle's checkout: open
        `checkout.url` in a browser signed in to the dashboard, in the account it is for, and the checkout opens on
        it. Paddle adds any sales tax or VAT where you are and sends you the receipt and the tax invoice; the credit
        itself is there once Paddle says the payment is complete, usually within seconds. In an organisation, its
        owners and billing buy credit - its admins read it, and buy none; in your own account, you. A key limited to some
        projects does not.

        A purchase is paid once, within a day of being started, while whoever started it still buys the account's
        credit and the account is open. Any other payment of it - a second one, a later one, or one after that - gives
        no credit: we ask Paddle to refund it in full.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditPurchaseCreate" }
      responses:
        "201":
          description: The checkout, started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditPurchase" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`amount_usd` is not one of the amounts"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: An organisation's admin or member, or a key limited to some projects
        "409":
          $ref: "#/components/responses/Conflict"
          description: This account does not buy credit
        "501":
          $ref: "#/components/responses/NotImplemented"
          description: Credit cannot be bought just now (`buy.open` is false)
        "502":
          $ref: "#/components/responses/Unavailable"
          description: The payment could not be set up just now; try again in a moment

  /v1/credit/purchases/{purchase_id}:
    parameters:
      - $ref: "#/components/parameters/PurchaseId"
    get:
      tags: [Billing]
      operationId: getCreditPurchase
      summary: One purchase of credit
      description: |
        A checkout started to buy credit, read by those who buy the account's credit. Another account's purchase answers
        `404`.
      responses:
        "200":
          description: The purchase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditPurchase" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: An organisation's admin or member, or a key limited to some projects
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          $ref: "#/components/responses/NotImplemented"
          description: Credit cannot be bought just now (`buy.open` is false)

  /v1/webhooks/paddle:
    post:
      tags: [Billing]
      operationId: paddleNotification
      summary: Paddle's word of a payment
      description: |
        For Paddle alone: how we learn what became of a payment.
      security: []
      parameters:
        - name: Paddle-Signature
          in: header
          required: true
          description: Paddle's signature of the notification, `ts=<time>;h1=<signature>`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaddleNotification" }
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: Not from Paddle
        "409":
          $ref: "#/components/responses/Conflict"
          description: Not ready yet; Paddle sends it again
        "413": { $ref: "#/components/responses/TooLarge" }
        "501":
          $ref: "#/components/responses/NotImplemented"
          description: Credit cannot be bought just now

  /v1/login/devices:
    post:
      tags: [Sign-in]
      operationId: startDeviceLogin
      summary: Start signing a program in through the browser
      description: |
        For a program on a computer with a browser (`wm login`): no key is needed. The answer holds `device_code`,
        which the program keeps to itself, and `user_code`, which the person types at `verification_uri`, signed in
        to the dashboard, and approves. The code is never carried in an address (there is no
        `verification_uri_complete`): a link with someone else's code in it is how such sign-ins are stolen. The
        codes last 10 minutes and are used once. Then ask for the key every `interval` seconds
        (`/v1/login/devices/token`).
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginRequest" }
      responses:
        "200":
          description: The sign-in, waiting for the person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLoginStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/login/devices/token:
    post:
      tags: [Sign-in]
      operationId: getDeviceLoginKey
      summary: The program's key, once the person approved
      description: |
        `202` while the person has not decided; `201` with the new key, its secret in this answer only, once they
        approved - named as the program asked ("wm on laptop") and holding the scopes they allowed; `403
        login_denied` when they refused (or signed out since); `410 login_expired` when the code ran out or was
        used. Asked more often than `interval`: `429` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginToken" }
      responses:
        "201":
          description: The new key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreated" }
        "202":
          description: Still waiting for the person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLoginPending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: "Asked more often than every 5 seconds (`rate_limited`), or the account holds 50 keys that work already - or the person who let the program in holds 10 in the organisation (`limit_reached`)"

  /v1/login/devices/lookup:
    post:
      tags: [Sign-in]
      operationId: lookupDeviceLogin
      summary: What a program asks, by the code the person typed
      description: The person types the code, signed in to the dashboard. It is never in a link.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginDecision" }
      responses:
        "200":
          description: The program's sign-in, waiting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLogin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/login/devices/approve:
    post:
      tags: [Sign-in]
      operationId: approveDeviceLogin
      summary: Let a program in
      description: |
        The dashboard's own, signed in. `scopes` narrows what the program asked for; it never widens it. `account` is
        the account its key is made in: your own, or an organisation you are in - the account the call acts in when it
        is left out - and in an organisation, never more than the person may do there. A program given full access
        (`cloud:*`), or what makes keys (`cloud:keys:write`), is approved with the code we e-mail you for that key in
        that account (`X-Confirm-Code`; see `POST /v1/confirm-codes`).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/ConfirmCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginDecision" }
      responses:
        "200":
          description: Approved; the program is given its key when it next asks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLogin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: |
            Your role gives none of what it asks; or, given full access, `confirm_required` or `confirm_wrong`: see `POST /v1/confirm-codes`.
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          $ref: "#/components/responses/Unavailable"
          description: "A program given full access: we can't send a confirm code just now - try again later"

  /v1/login/devices/deny:
    post:
      tags: [Sign-in]
      operationId: denyDeviceLogin
      summary: Refuse a program
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginDecision" }
      responses:
        "200":
          description: Refused; the program is told so
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLogin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/session:
    delete:
      tags: [Sign-in]
      operationId: signOut
      summary: Sign out of the dashboard here
      security:
        - session: []
          csrf: []
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/confirm-codes:
    post:
      tags: [Sign-in]
      operationId: sendConfirmCode
      summary: E-mail a confirm code for a risky step
      description: |
        These steps need a 6-digit code we e-mail you: closing your account; deleting an organisation, and transferring one
        to another owner - each its primary owner's alone; making someone an owner, by their role or by an
        invitation, and sending an owner's invitation again; and making a key with full access (`cloud:*`) or one that
        makes keys (`cloud:keys:write`) - by a key or signed in, and for a program given either as it signs in through
        the browser. Made without it, the step is refused with `403 confirm_required`, and the error's `confirm` says
        what the code must be for: send that here, and the code goes to your e-mail address. Then make the same call
        again with it in `X-Confirm-Code`.

        A code is yours alone, for that step and what `confirm` binds it to, and works once, for 10 minutes. Five wrong tries use
        it up, and a new code cancels the ones before. Too many asks or wrong tries answer `429`. No code goes to an address that
        bounced for good or marked us as spam (`409`). Closing an account, and the steps of an organisation, are done signed in,
        never with a key; a key asks for a code for a key with full access, which goes to its person.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmAsk" }
      responses:
        "201":
          description: The code is on its way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmCodeSent" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`step` is not one of those that take a code"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: A step done signed in, asked with a key; or one your role does not allow
        "404":
          $ref: "#/components/responses/NotFound"
          description: No such organisation of yours, or no such person in it
        "409":
          $ref: "#/components/responses/Conflict"
          description: Your account has no e-mail address to send a code to, or e-mail to it stopped - it bounced for good, or one of ours was marked as spam
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: Five codes sent in 15 minutes, or 20 in a day, or ten wrong ones tried in a day, already - use the last, or wait - or too many asked from here
        "503":
          $ref: "#/components/responses/Unavailable"
          description: We can't send e-mail just now; try again later

  /v1/sessions:
    get:
      tags: [Sign-in]
      operationId: listSessions
      summary: Where the account is signed in to the dashboard
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: Every sign-in that still works, this one marked `current`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Sign-in]
      operationId: signOutEverywhere
      summary: Sign out everywhere
      description: |
        Every sign-in of yours to the dashboard ends, this one too; every program signed in through the browser
        (`wm login`, an app) is signed out, its key revoked, in your own account and in each organisation you are in;
        and every browser you signed in from is forgotten, so the next sign-in from any of them is e-mailed. Keys made
        on the Keys page, or by another key, keep working: revoke any you do not know on their own.
      security:
        - session: []
          csrf: []
      responses:
        "204": { description: Signed out everywhere }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [Sign-in]
      operationId: signOutBrowser
      summary: Sign one browser out of the dashboard
      description: That sign-in ends, and no other; this one too when it is this one. Another account's sign-in, or one that has ended, is not found.
      security:
        - session: []
          csrf: []
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/providers:
    servers:
      - url: https://app.wheelmachine.ai
    get:
      tags: [Sign-in]
      operationId: signInProviders
      summary: Which ways of signing in are open
      description: A way that is closed says `false`; starting it sends the browser back with `signin=not_set_up`.
      security: []
      responses:
        "200":
          description: Each way, open or not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }

  /auth/github/start:
    servers:
      - url: https://app.wheelmachine.ai
    get:
      tags: [Sign-in]
      operationId: signInWithGitHub
      summary: Continue with GitHub
      description: |
        Sends the browser to GitHub, asking only for your profile and e-mail addresses (`read:user user:email`). `then` is a place on the
        dashboard to come back to (`/device`, `/keys`); anything else is dropped.
      security: []
      parameters:
        - $ref: "#/components/parameters/Then"
      responses:
        "302": { description: "On to GitHub, or back to the dashboard with `signin=not_set_up` or `signin=busy`" }

  /auth/github/callback:
    servers:
      - url: https://app.wheelmachine.ai
    get:
      tags: [Sign-in]
      operationId: signInWithGitHubBack
      summary: Back from GitHub
      description: |
        Where GitHub sends the browser back. GitHub must have verified an e-mail address of yours. Otherwise back to the
        dashboard with `signin=` one of `state`, `cancelled`, `unverified`, `held`, `young`, `unavailable`, `failed`.
      security: []
      responses:
        "302": { description: "Signed in and on to the dashboard, or back to it with `signin=` saying why not" }

  /auth/google/start:
    servers:
      - url: https://app.wheelmachine.ai
    get:
      tags: [Sign-in]
      operationId: signInWithGoogle
      summary: Continue with Google
      description: Sends the browser to Google, asking only for your name and e-mail address (`openid email profile`).
      security: []
      parameters:
        - $ref: "#/components/parameters/Then"
      responses:
        "302": { description: "On to Google, or back to the dashboard with `signin=not_set_up` or `signin=busy`" }

  /auth/google/callback:
    servers:
      - url: https://app.wheelmachine.ai
    get:
      tags: [Sign-in]
      operationId: signInWithGoogleBack
      summary: Back from Google
      description: Where Google sends the browser back. Google must have verified your e-mail address. Otherwise back to the dashboard with `signin=`, as for GitHub.
      security: []
      responses:
        "302": { description: "Signed in and on to the dashboard, or back to it with `signin=` saying why not" }

  /v1/code:
    get:
      tags: [Code]
      operationId: getCode
      summary: The account's code hosts, and the repositories its teams are given
      description: |
        Its connections to GitHub and GitLab, whether GitHub can be connected here (`github`) and GitLab in one approval
        (`gitlab`), the repositories given to the teams the caller is in - every team, for owners and admins - the
        branches no machine of the account pushes to (`protected_branches`), and the caller's own GitHub and GitLab
        accounts, linked so their machines' pushes carry their name (`links`).
      responses:
        "200":
          description: The account's code access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Code" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/code/github:
    post:
      tags: [Code]
      operationId: startGitHubInstall
      summary: Where to install Wheelmachine's GitHub App
      description: |
        An organisation's owners and admins, or a person in their own account. The address is on GitHub, good for half an
        hour: there the App is installed on the repositories chosen, and GitHub comes back to the dashboard.
      responses:
        "200":
          description: The address to install the App at
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeInstall" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/code/gitlab:
    post:
      tags: [Code]
      operationId: connectGitLab
      summary: Connect a GitLab group
      description: |
        An organisation's owners and admins, or a person in their own account. A group access token with
        `read_repository` (and `write_repository`, for pushes), for gitlab.com or a company's own GitLab (`address`, its
        https address). GitLab must know the token and let it read repositories; it is never shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                address: { type: string, description: "The GitLab's https address; https://gitlab.com when left out" }
                token: { type: string, writeOnly: true, description: "A group access token" }
      responses:
        "201":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: "GitLab could not check the token just now" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/code/gitlab/connect:
    post:
      tags: [Code]
      operationId: startGitLabConnect
      summary: Where to approve Wheelmachine's GitLab application
      description: |
        An organisation's owners and admins, or a person in their own account, from the dashboard. The address is on
        GitLab, good for half an hour: there the person approves Wheelmachine's GitLab application (the scopes
        `read_user read_api read_repository write_repository`), and GitLab comes back to the dashboard, in the same browser,
        and GitLab is connected as that person, with no token
        to copy or paste. Its projects are those the person may push to (Developer or above). A company's own GitLab connects by a group's
        token (`POST /v1/code/gitlab`).
      responses:
        "200":
          description: The address to approve the application at
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeInstall" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/code/protected:
    put:
      tags: [Code]
      operationId: setProtectedBranches
      summary: Set the branches no machine pushes to
      description: |
        The organisation's owners and admins, or a person in their own account. No machine of the account pushes to
        these branches: changes reach them through a pull request (a merge request on GitLab). `main`, `master` and
        `release/**` until it is set; an empty list protects none. Patterns as GitHub's: `*` is any run of characters
        but `/`, `**` any run with `/` too, `?` one character but `/`. At most 50. Every machine is told at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branches]
              properties:
                branches: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: The branches it protects now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeProtected" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/code/links/github:
    post:
      tags: [Code]
      operationId: startGitHubLink
      summary: Where to link your own GitHub account
      description: |
        Signed in to the dashboard. The address is on GitHub, good for half an hour: there you approve Wheelmachine's
        GitHub App for yourself, and GitHub comes back to the dashboard, in the same browser. Linked, the pushes of the machines you hold go as you, to the repositories both you
        and the App reach; without it they can fetch but not push.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: The address to approve the App at
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeInstall" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/code/links/gitlab:
    post:
      tags: [Code]
      operationId: startGitLabLink
      summary: Where to link your own GitLab account
      description: |
        Signed in to the dashboard. The address is on GitLab, good for half an hour: there you approve Wheelmachine's
        GitLab application for yourself (`read_user read_repository write_repository`), and GitLab comes back to the
        dashboard, in the same browser. Linked, the pushes of the
        machines you hold go as you; without it they can fetch but not push. On a GitLab connected by a group's
        token - a company's own - no account is linked: pushes there go with the group's token.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: The address to approve the application at
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeInstall" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/code/links/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [github, gitlab] }
    delete:
      tags: [Code]
      operationId: unlinkCode
      summary: Unlink your own GitHub or GitLab account
      description: |
        Signed in to the dashboard. Your machines push nothing there until you link it again, and it is revoked at
        GitHub or GitLab too. None linked, nothing changes.
      security:
        - session: []
          csrf: []
      responses:
        "204": { description: Unlinked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/code/connections/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    delete:
      tags: [Code]
      operationId: disconnectCode
      summary: Take a connection away
      description: Its owners and admins, or the person in their own account. Every repository a team was given of it goes with it, and the machines lose them at once. A GitLab connected in one approval has its tokens revoked at GitLab too.
      responses:
        "204": { description: Taken away }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/code/connections/{connection_id}/repos:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [Code]
      operationId: listCodeRepos
      summary: The repositories a connection reaches
      description: "Owners, admins and a team's managers at any level, and a person in their own account."
      responses:
        "200":
          description: The repositories
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, enum: [list] }
                  data: { type: array, items: { $ref: "#/components/schemas/CodeRepo" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: "GitHub or GitLab did not answer just now" }
  /v1/projects/{project_id}/code:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Code]
      operationId: getTeamCode
      summary: The repositories a team is given
      responses:
        "200":
          description: Its repositories
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, enum: [list] }
                  data: { type: array, items: { $ref: "#/components/schemas/CodeGrant" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Code]
      operationId: grantTeamCode
      summary: Give a team a repository
      description: |
        Its full managers, the organisation's owners and admins, or a person in their own account. The repository must
        be one the connection reaches; given again, its access changes. The team's machines reach it at once, reading
        (`read`: fetch and clone) or writing too (`write`: push). At most 500 repositories a team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection, repo, access]
              properties:
                connection: { type: string }
                repo: { type: string, description: "Its path on its host, such as acme/api" }
                access: { type: string, enum: [read, write] }
      responses:
        "200":
          description: What the team was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { description: "GitHub or GitLab did not answer just now" }
  /v1/projects/{project_id}/code/{grant_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: grant_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Code]
      operationId: revokeTeamCode
      summary: Take a repository from a team
      description: Its full managers, the organisation's owners and admins, or a person in their own account. The team's machines lose it at once.
      responses:
        "204": { description: Taken away }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{project_id}/code/{grant_id}/push:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: grant_id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Code]
      operationId: setTeamCodePush
      summary: Set a team's push rule for a repository
      description: |
        Its full managers, the organisation's owners and admins, or a person in their own account, for a repository the
        team was given to push to. Its machines push only to these branches (none: any branch), never to one the account
        protects - a team's rule narrows the account's, never more - and to its tags only with `tags`. Patterns as the
        protected branches'; a protected branch named is refused. The team's machines are told at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branches, tags]
              properties:
                branches: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
                tags: { type: boolean }
      responses:
        "200":
          description: The repository with its rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/folders:
    get:
      tags: [Folders]
      operationId: listFolders
      summary: The folders you see
      description: |
        Your own first (made the first time you ask), then the team folders you may view or edit; to an organisation's
        owners and admins every team folder, and each person's own with its size alone. `on` is false when folders are
        not available. `used_bytes` and `cap_bytes` - what the account keeps, the Trash included, and
        may - are said to an organisation's owners and admins, and to the person in their own account.
      responses:
        "200":
          description: The folders
          content:
            application/json:
              schema:
                type: object
                required: [object, "on", data, file_most_bytes]
                properties:
                  object: { type: string, enum: [list] }
                  "on": { type: boolean }
                  data: { type: array, items: { $ref: "#/components/schemas/SharedFolder" } }
                  used_bytes: { type: integer }
                  cap_bytes: { type: integer }
                  file_most_bytes: { type: integer, description: "The most one file may be" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Folders]
      operationId: createFolder
      summary: Make a team folder
      description: |
        An organisation's owners and admins, or a person in their own account. Its name is 1 to 80 characters, with no
        `/` or `\`, and not My files. Names are unique in the account, ignoring case. At most 200 team folders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: The folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedFolder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/folders/{folder_id}:
    parameters:
      - $ref: "#/components/parameters/FolderId"
    get:
      tags: [Folders]
      operationId: getFolder
      summary: A folder, and its last changes
      description: Its last 12 changes, to those who may view it; none to an owner or an admin seeing another person's own folder.
      responses:
        "200":
          description: The folder
          content:
            application/json:
              schema:
                type: object
                required: [folder, activity]
                properties:
                  folder: { $ref: "#/components/schemas/SharedFolder" }
                  activity: { type: array, items: { $ref: "#/components/schemas/FolderChange" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      tags: [Folders]
      operationId: renameFolder
      summary: Rename a team folder
      description: An organisation's owners and admins, or a person in their own account. Its teams' machines see the new name at their next look.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: The folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedFolder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Folders]
      operationId: deleteFolder
      summary: Delete a team folder
      description: |
        With everything in it and in its Trash, for good. An organisation's owners and admins, or a person in their own
        account. An owner may also delete the own folder of a person who left, before it goes by itself.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/folders/{folder_id}/list:
    parameters:
      - $ref: "#/components/parameters/FolderId"
      - name: path
        in: query
        schema: { type: string, description: "A folder in the folder, such as `designs/2026`; its top when left out" }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      - $ref: "#/components/parameters/After"
    get:
      tags: [Folders]
      operationId: listFolderPath
      summary: What is in a folder
      description: Folders first, then files, each by name - a page at a time; `next` says where the next page starts, null after the last.
      responses:
        "200":
          description: What is in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/folders/{folder_id}/files:
    parameters:
      - $ref: "#/components/parameters/FolderId"
      - name: path
        in: query
        required: true
        schema: { type: string, description: "The file's path in the folder, such as `designs/logo.png`" }
    get:
      tags: [Folders]
      operationId: downloadFolderFile
      summary: Download a file
      description: |
        The whole of it, or the one part a `Range` header asks for (206), as bytes to keep. An organisation downloads 32
        files at once at most, a person's own account 8: past that, `rate_limited` (429) until one is done. A download
        slower than 32 KiB a second, after its first 30 seconds, ends.
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The part asked for
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      tags: [Folders]
      operationId: uploadFolderFile
      summary: Upload a file
      description: |
        The body is the file, with its `Content-Length`; it takes the place of the file at that path, and the folders it
        goes in are made as needed. Refused with `too_large` past 5 GB, and with `limit_reached` when the account would
        keep more than it may, or hold more than 250,000 files and folders - the error's `limit` says which (measure
        `file_bytes`, `folders_bytes` or `folder_entries`). An organisation uploads 16 files at once at most, a person's
        own account 4: past that, `rate_limited` until one is done. A body slower than 32 KiB a second, after its first
        30 seconds, ends the call. A part of a file (`Content-Range`) is refused (400). A path is at most 1,024 bytes and
        64 names deep, each name at most 255 bytes.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The file kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "411": { description: "No Content-Length" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Folders]
      operationId: deleteFolderFile
      summary: Delete a file or a folder in it
      description: Put in the folder's Trash, with everything under it, for 30 days - restore it from there.
      responses:
        "200":
          description: What went to the Trash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderTrash" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/folders/{folder_id}/mkdir:
    parameters:
      - $ref: "#/components/parameters/FolderId"
    post:
      tags: [Folders]
      operationId: makeFolderDir
      summary: Make a folder in a folder
      description: |
        The folders it goes in are made with it. Refused with `limit_reached` when the account's folders would hold more
        than 250,000 files and folders (measure `folder_entries`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "201":
          description: The folder made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/folders/{folder_id}/move:
    parameters:
      - $ref: "#/components/parameters/FolderId"
    post:
      tags: [Folders]
      operationId: moveFolderItem
      summary: Move or rename a file or a folder in it
      description: |
        Within the folder, or into `to_folder`, another folder you edit. Nothing may be at `to` already, and no path in
        what is moved may come to more than 1,024 bytes or 64 names deep there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string }
                to_folder: { type: string }
      responses:
        "200":
          description: Where it is now
          content:
            application/json:
              schema:
                type: object
                required: [object, folder, path]
                properties:
                  object: { type: string, enum: [shared_moved] }
                  folder: { type: string }
                  path: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/folders/{folder_id}/trash:
    parameters:
      - $ref: "#/components/parameters/FolderId"
    get:
      tags: [Folders]
      operationId: listFolderTrash
      summary: A folder's Trash
      description: What was deleted, newest first, each with when it goes for good.
      responses:
        "200":
          description: The Trash
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, enum: [list] }
                  data: { type: array, items: { $ref: "#/components/schemas/FolderTrash" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Folders]
      operationId: emptyFolderTrash
      summary: Empty a folder's Trash
      description: Everything in it deleted for good.
      responses:
        "204": { description: Emptied }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/folders/{folder_id}/trash/{trash_id}/restore:
    parameters:
      - $ref: "#/components/parameters/FolderId"
      - $ref: "#/components/parameters/TrashId"
    post:
      tags: [Folders]
      operationId: restoreFolderTrash
      summary: Put something deleted back
      description: Where it was - or beside it, as "name (restored)", when something is there now; the folders it was in made again.
      responses:
        "200":
          description: Where it is now
          content:
            application/json:
              schema:
                type: object
                required: [object, folder, path]
                properties:
                  object: { type: string, enum: [shared_restored] }
                  folder: { type: string }
                  path: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/folders/{folder_id}/trash/{trash_id}:
    parameters:
      - $ref: "#/components/parameters/FolderId"
      - $ref: "#/components/parameters/TrashId"
    delete:
      tags: [Folders]
      operationId: deleteFolderTrash
      summary: Delete something in the Trash for good
      responses:
        "204": { description: Deleted for good }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          $ref: "#/components/responses/PaymentRequired"
          description: The account's credit is used up, and its folders are read-only
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/projects/{project_id}/folders:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Folders]
      operationId: getTeamFolders
      summary: The folders a team is given
      responses:
        "200":
          description: Its folders
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, enum: [list] }
                  data: { type: array, items: { $ref: "#/components/schemas/FolderGrant" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{project_id}/folders/{folder_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/FolderId"
    put:
      tags: [Folders]
      operationId: giveTeamFolder
      summary: Give a team a folder
      description: |
        Its full managers, the organisation's owners and admins, or a person in their own account. `view`: its people
        and machines read it; `edit`: they change it too. Given again, its access changes; its machines have it at
        their next look.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access]
              properties:
                access: { type: string, enum: [view, edit] }
      responses:
        "200":
          description: What the team was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [Folders]
      operationId: takeTeamFolder
      summary: Take a folder from a team
      description: Its full managers, the organisation's owners and admins, or a person in their own account. Its machines lose it at once.
      responses:
        "204": { description: Taken away }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/github/installed:
    servers:
      - url: https://app.wheelmachine.ai
    get:
      tags: [Code]
      operationId: gitHubInstalled
      summary: Back from installing the GitHub App, or linking a GitHub account
      description: |
        Where GitHub sends the browser back after installing the App or linking an account. Back to the dashboard's Code
        page with `github=` one of `connected`, `expired`, `cancelled`, `elsewhere`, `forbidden`, `not_yours`, `failed`,
        `off`; for a linked account, `github_link=` one of `linked`, `expired`, `cancelled`, `elsewhere`, `failed`, `off`.
      security: []
      responses:
        "303": { description: "Back to the dashboard's Code page, with `github=` saying what became of it" }
  /auth/gitlab/connected:
    servers:
      - url: https://app.wheelmachine.ai
    get:
      tags: [Code]
      operationId: gitLabConnected
      summary: Back from approving Wheelmachine's GitLab application
      description: |
        Where GitLab sends the browser back after approving Wheelmachine's GitLab application or linking an account. It is
        named `@` and their GitLab username. Back to the dashboard's Code page with `gitlab=` one of `connected`, `expired`,
        `cancelled`, `elsewhere`, `forbidden`, `failed`, `off`; for a linked account, `gitlab_link=` one of `linked`,
        `expired`, `cancelled`, `elsewhere`, `failed`, `off`.
      security: []
      responses:
        "303": { description: "Back to the dashboard's Code page, with `gitlab=` saying what became of it" }

components:
  securitySchemes:
    key:
      type: http
      scheme: bearer
      description: "An API key: `ak_live_` and 40 characters."
    session:
      type: apiKey
      in: cookie
      name: __Host-wm_session
      description: |
        The person's sign-in to the dashboard, on https://app.wheelmachine.ai only. It lasts 30 days from its last
        call. A call acts in the person's own account, or in an organisation they are in, named with `X-Account`.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The sign-in's token (the cookie `__Host-wm_csrf`, which the dashboard's page reads), on every call made with the
        sign-in; a call that changes anything must also come from the dashboard's address (`Origin`). A WebSocket's handshake
        carries it as the protocol `wm.csrf.<token>`, and the account as `wm.account.<id>`, beside `wm.terminal` or `wm.screen`.

  parameters:
    ConfirmCode:
      name: X-Confirm-Code
      in: header
      description: The 6-digit code we e-mailed you for this step (`POST /v1/confirm-codes`), where it needs one.
      schema: { type: string, pattern: "^[0-9]{6}$" }
    MachineId:
      name: machine_id
      in: path
      required: true
      schema: { type: string, pattern: "^m_[0-9a-z]{26}$" }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, pattern: "^prj_[0-9a-z]{26}$" }
    FolderId:
      name: folder_id
      in: path
      required: true
      schema: { type: string, pattern: "^fld_[0-9a-z]{26}$" }
    TrashId:
      name: trash_id
      in: path
      required: true
      schema: { type: string, pattern: "^ftr_[0-9a-z]{26}$" }
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: { type: string, pattern: "^code_[0-9a-z]{26}$" }
    PurchaseId:
      name: purchase_id
      in: path
      required: true
      schema: { type: string, pattern: "^cp_[0-9a-z]{26}$" }
    OrgId:
      name: org_id
      in: path
      required: true
      schema: { type: string, pattern: "^acc_[0-9a-z]{26}$" }
    InviteId:
      name: invite_id
      in: path
      required: true
      schema: { type: string, pattern: "^inv_[0-9a-z]{26}$" }
    AccountId:
      name: account_id
      in: path
      required: true
      description: Your own account's id, or an organisation's.
      schema: { type: string, minLength: 1, maxLength: 255 }
    PersonId:
      name: person_id
      in: path
      required: true
      description: A person's id (`person.id`) or @handle, URL-encoded.
      schema: { type: string, minLength: 1, maxLength: 255 }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, pattern: "^ses_[0-9a-z]{26}$" }
    BackupLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    KeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string, pattern: "^key_[0-9a-f]{16}$" }
    Port:
      name: port
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 65535 }
    AppName:
      name: app
      in: path
      required: true
      description: The app's name, as the machine's list of apps gives it.
      schema: { type: string, pattern: "^[a-z0-9-]{1,32}$", examples: [desktop] }
    AgentName:
      name: agent
      in: path
      required: true
      description: The agent's name, as `GET /v1/agents` gives it.
      schema: { type: string, pattern: "^[a-z0-9-]{1,32}$", examples: [codex] }
    Team:
      name: project
      in: query
      description: |
        In an organisation, the team whose choices of yours these are; left out, your one team, when you
        are in one. Never in a person's own account, whose choices are for every machine of it.
      schema: { type: string, pattern: "^prj_[0-9a-z]{26}$" }
    SecretName:
      name: name
      in: path
      required: true
      description: Written as an environment variable's name is, which is what a machine's commands get it as.
      schema: { type: string, pattern: "^[A-Z_][A-Z0-9_]{0,63}$", examples: [DATABASE_URL] }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    After:
      name: after
      in: query
      description: The `next` of the page before.
      schema: { type: string }
    Then:
      name: then
      in: query
      description: Where on the dashboard to go once signed in, such as `/device`.
      schema: { type: string }
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { type: string, pattern: "^rq_[0-9a-z]{26}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Any string up to 255 characters, unique per attempt. The same key with the same request within 24 hours gets
        the first answer again (with `Idempotent-Replayed: true`); with a different request it is refused. Making a
        key is the one exception: its secret is kept nowhere, so the call sent again answers `409` with the key in
        `Location`.
      schema: { type: string, maxLength: 255 }

  headers:
    RequestId:
      description: This call's id.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: { type: integer }

  responses:
    BadRequest:
      description: The request is not right
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No key, or a key that does not work
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PaymentRequired:
      description: "The account cannot spend: its credit has run out, a limit for this month is reached, or it is on hold"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The key, or your role in the organisation, does not allow this
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Nothing of that id that this key can see
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Timeout:
      description: The state was not reached in time
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Not possible in the state it is in
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotImplemented:
      description: Not available
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Gone:
      description: The sign-in's code ran out, or was used already
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: Too large
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: A limit is reached; `Retry-After` says when to try again
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Not available just now; `Retry-After` says when to try again
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unreadable:
      description: The machine's answer about its apps could not be read (`unavailable`); try again in a moment
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotSetUp:
      description: Secrets are not available just now (`unavailable`); `Retry-After` says when to try again
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, description: "A link to the page that explains this `code`." }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [invalid_request, unauthorized, key_revoked, key_expired, forbidden, not_found, conflict,
                 project_not_empty, payment_required, rate_limited, limit_reached, unavailable, timeout,
                 too_large, not_open, no_apps, internal, login_denied, login_expired, confirm_required, confirm_wrong]
        request_id: { type: string }
        retry_after_s: { type: number }
        limit:
          $ref: "#/components/schemas/LimitHit"
          description: The limit that stopped it, where one did - with `payment_required`, `limit_reached` or `forbidden`.
        rule:
          $ref: "#/components/schemas/RuleHit"
          description: The team's rule that stopped it, where one did - with `forbidden`.
        confirm:
          $ref: "#/components/schemas/ConfirmAsk"
          description: What the code a step needs must be for - with `confirm_required` and `confirm_wrong`. Send it to `POST /v1/confirm-codes`.

    ConfirmAsk:
      type: object
      additionalProperties: false
      required: [step]
      description: What a confirm code is for - the step, and what of it the code is bound to.
      properties:
        step:
          type: string
          enum: [close_account, delete_org, hand_over, make_owner, full_access_key, key_making_key]
        org: { type: string, description: "The organisation deleted, transferred, or made an owner of (`delete_org`, `hand_over`, `make_owner`)." }
        to: { type: string, description: "Who it is for: for `hand_over`, the person's id or @handle; for `make_owner`, a person's id, or what the invitation names - an @handle, an e-mail address, or `github:` and a login." }
        account: { type: string, description: "The account a key with full access, or one that makes keys, is made in (`full_access_key`, `key_making_key`): the one the call acts in when left out." }
    ConfirmCodeSent:
      type: object
      required: [object, step, expires_at, sent_to]
      properties:
        object: { const: confirm_code }
        step: { type: string, enum: [close_account, delete_org, hand_over, make_owner, full_access_key, key_making_key] }
        org: { type: string }
        to: { type: string, description: "As the ask said it: a person in the organisation by their id, or an @handle, e-mail address or `github:` login." }
        account: { type: string }
        expires_at: { type: string, format: date-time, description: "When the code stops working: 10 minutes on." }
        sent_to: { type: string, description: "The address it went to, in part: `a…@example.com`." }

    RuleHit:
      type: object
      required: [team, name, value, changed_by]
      description: |
        Which of a team's rules stopped something, at what, and who can change it - on the team's Rules page. `detail`
        says the same in words.
      properties:
        team: { type: string, description: "The team's project." }
        name:
          type: string
          enum: [gpus, open_internet, max_machine_vcpus, idle_max_seconds, public_ports]
        value:
          description: "The rule as it is: false for `gpus` and `open_internet`, a number for `max_machine_vcpus` and `idle_max_seconds`, `links_only` or `off` for `public_ports`."
          oneOf:
            - type: boolean
            - type: integer
            - type: string
        changed_by:
          type: array
          items: { type: string, enum: [full_manager, owner, admin] }

    LimitHit:
      type: object
      required: [scope, measure, limit, used, resets_at, raised_by]
      description: |
        Which limit stopped something, at what and how much of it is used, who can raise it, and when it lifts by
        itself. `detail` says the same in words. An organisation's, a team's or another person's amounts for the month
        are null to those not shown them.
      properties:
        scope:
          type: string
          enum: [wheelmachine, account, team, person]
          description: |
            `wheelmachine`, Wheelmachine's own for the account; `account`, the account's own; `team`, a team's budget;
            `person`, a person's own limits in an organisation.
        measure:
          type: string
          enum: [month_usd, machines, vcpus, gpus, folders_bytes, file_bytes, folder_entries]
          description: |
            Dollars this month, machines held, CPUs running at once, or GPU machines (0 when none are allowed); for
            folders, the bytes the account keeps in them, one file's bytes, or the files and folders they hold.
        limit: { type: [number, "null"] }
        used: { type: [number, "null"], description: "Spent this month, machines held, or CPUs running." }
        resets_at:
          type: [string, "null"]
          format: date-time
          description: "When a limit for the month lifts: the first of the next month, 00:00 UTC. Null for a count."
        raised_by:
          type: array
          items:
            type: string
            enum: [owner, admin, billing, full_manager, team_manager, wheelmachine]
          description: "Who can raise it: a role in the organisation, a team's full managers or managers, or Wheelmachine's support."
          examples:
            - [owner, billing]

    Me:
      type: object
      required: [object, account, key, standing]
      properties:
        object: { const: me }
        account:
          type: object
          required: [id]
          description: The account the call acts in.
          properties:
            id: { type: string }
            kind:
              type: string
              enum: [person, org]
              description: "`person` for a person's own account; `org` for an organisation's."
            name: { type: string, description: "The account's name: an organisation's, or yours in your own account." }
            email: { type: string, description: "With the dashboard's sign-in in your own account: the e-mail address GitHub or Google verified." }
        person:
          description: |
            The person behind the call: the one signed in, or the one who made the key. Their e-mail address is said
            with the dashboard's sign-in only.
          $ref: "#/components/schemas/Person"
        role:
          description: Their role in the account; `owner` in their own.
          $ref: "#/components/schemas/Role"
        teams:
          type: [array, "null"]
          description: In an organisation, for a member, the projects of their teams; null otherwise.
          items: { type: string }
        scopes:
          type: array
          description: What the call holds.
          items: { $ref: "#/components/schemas/Scope" }
        limits:
          description: In an organisation, the person's own limits there; null in their own account.
          oneOf:
            - $ref: "#/components/schemas/PersonLimits"
            - type: "null"
        key:
          description: The key this call is made with; null for a call made with the dashboard's sign-in.
          oneOf:
            - $ref: "#/components/schemas/Key"
            - type: "null"
        session:
          description: The dashboard's sign-in this call is made with, when it is.
          $ref: "#/components/schemas/Session"
        standing: { $ref: "#/components/schemas/Standing" }
        levels:
          type: object
          description: In an organisation, your level in each team you manage, by its project; empty otherwise.
          additionalProperties: { $ref: "#/components/schemas/Level" }

    AccountClose:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Your GitHub login, or your e-mail address, in any case - what you type to say you mean it.

    Standing:
      type: object
      required: [can_spend]
      description: In an organisation, the person's own limit for the month there joins the organisation's.
      properties:
        can_spend: { type: boolean, description: "Whether the account can spend now; in an organisation, the person's own limit counts too." }
        balance_usd:
          type: [number, "null"]
          description: |
            What is left to spend this month under the limits, not the credit (`credit_usd`); null with no monthly limit. In an
            organisation, a member is told what is left of their own limit there, or null when they have none.
        credit_usd:
          type: [number, "null"]
          description: |
            The account's credit left, in dollars; at zero or below the account cannot spend. Null wherever
            `GET /v1/credit` would not answer: for an organisation's member - its credit is read by its owners, admins and
            billing - and for a key limited to some projects.
        reason: { type: string, description: "Why it cannot spend, in words a person reads." }

    Role:
      type: string
      description: |
        A person's role in an organisation: `owner` may do everything; `admin` everything but change owners and the
        organisation's own limit for the month; `billing` sees what everything costs and the people, never a machine, and
        sets the organisation's own limit for the month (signed in) and a member's limit for the month, nothing else;
        `member` makes and uses the machines they hold in their teams - and in a team they manage, sees the machines its
        members hold and does to them what their level allows, never using one.
      enum: [owner, admin, billing, member]
    Person:
      type: object
      required: [id, name, handle, email, github_login]
      properties:
        id: { type: string, description: "Their own account's id. Treat it as text of no fixed shape." }
        name: { type: string, description: "Their name, as they gave it; empty when they gave none. Name them by their handle then." }
        handle: { type: string, description: "Their @handle, without its @: lower-case letters, digits and -, theirs alone. May be empty." }
        email: { type: [string, "null"] }
        github_login: { type: [string, "null"] }
    Org:
      type: object
      required: [id, object, name, role, primary_owner, created_at, people]
      properties:
        id: { type: string, examples: [acc_01jb2xk3n4p5q6r7s8t9v0w1x2] }
        object: { const: org }
        name: { type: string }
        role:
          description: Your role in it.
          $ref: "#/components/schemas/Role"
        primary_owner: { type: boolean, description: "You are its primary owner, the owner who transfers it." }
        created_at: { type: string, format: date-time }
        people: { type: integer, description: "How many people are in it." }
    OrgList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Org" }
    OrgCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    OrgUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    TeamPick:
      type: object
      required: [project, lead]
      properties:
        project: { type: string }
        lead: { type: boolean, description: "They manage the team: a team manager, or the level `level` names." }
        level:
          description: |
            Their level as its manager, for a member: `approver`, `manager` or `full`. Named, they manage it at that level
            (lead is taken as true); left out with lead true, they are a team manager.
          $ref: "#/components/schemas/Level"
    Member:
      type: object
      required: [object, person, role, primary_owner, teams, joined_at]
      properties:
        object: { const: member }
        person: { $ref: "#/components/schemas/Person" }
        role: { $ref: "#/components/schemas/Role" }
        primary_owner: { type: boolean }
        teams:
          type: array
          description: The projects whose team they are in, with their level as its manager.
          items: { $ref: "#/components/schemas/MemberTeam" }
        limits:
          description: Their own limits there; null to a team manager, for one in none of the teams they manage.
          oneOf:
            - $ref: "#/components/schemas/PersonLimits"
            - type: "null"
        machines: { type: [integer, "null"], description: "The machines they hold in it; null as limits is." }
        spent_usd: { type: [number, "null"], description: "What they ran this month: the machines they hold, and their shares of those they held before; null as limits is." }
        joined_at: { type: string, format: date-time }
    MemberTeam:
      type: object
      required: [project, lead, level]
      properties:
        project: { type: string }
        lead: { type: boolean, description: "They manage the team, at any level." }
        level:
          description: Their level as its manager; null for none.
          oneOf:
            - $ref: "#/components/schemas/Level"
            - type: "null"
    Level:
      type: string
      enum: [approver, manager, full]
      description: |
        A manager's level in a team, each with more than the last. `approver`: sees the machines the team's members hold
        there, watches their screens and decides its hand-offs. `manager` (a team manager): also starts, stops, pauses and
        deletes those machines, sets their name, labels and internet, takes their secrets away, and puts people in the team.
        `full` (a full manager): also decides the team's forks, sets its rules and makes approvers. None of them uses a
        member's machine.
    PersonName:
      type: object
      required: [id, name, handle]
      properties:
        id: { type: string }
        name: { type: string, description: "Their name, as they gave it; empty when they gave none. Name them by their handle then." }
        handle: { type: string, description: "Their @handle, without its @: lower-case letters, digits and -, theirs alone. May be empty." }
    PersonLimits:
      type: object
      required: [max_machines, max_vcpus, gpus, month_cap_usd]
      description: |
        A person's own limits in an organisation, on top of its own: null is no limit. Give all four.
      properties:
        max_machines: { type: [integer, "null"], minimum: 0, description: "The machines they may hold." }
        max_vcpus: { type: [integer, "null"], minimum: 0, description: "The CPUs their machines may run at once." }
        gpus: { type: boolean, description: "Whether they may make GPU machines." }
        month_cap_usd: { type: [number, "null"], minimum: 0, description: "What their machines may come to in a month, in dollars, to the cent." }
    MemberList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    MemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }
        primary_owner:
          const: true
          description: The organisation transferred to them, one of its owners. Only its primary owner may.
        limits:
          description: |
            Their own limits there. Owners change anyone's; admins a member's or billing's; billing only a member's
            `month_cap_usd`; a team manager or full manager those of a member with no level, all of whose teams they manage,
            within each team's budget and GPU rule.
          $ref: "#/components/schemas/PersonLimits"
    Invite:
      type: object
      required: [id, object, email, github_login, person, role, teams, limits, made_by, created_at, sent_at, expires_at, state, accepted_by]
      properties:
        id: { type: string, examples: [inv_01jb2xk3n4p5q6r7s8t9v0w1x2] }
        object: { const: invite }
        email: { type: [string, "null"] }
        github_login: { type: [string, "null"] }
        person:
          description: A person invited by their @handle, by their name and handle alone - never their id; null for one by an address or a login.
          oneOf:
            - type: object
              required: [name, handle]
              properties:
                name: { type: string, description: "Their name; empty when they gave none - name them by their handle alone then." }
                handle: { type: string }
            - type: "null"
        role: { $ref: "#/components/schemas/Role" }
        teams:
          type: array
          items: { $ref: "#/components/schemas/TeamPick" }
        limits: { $ref: "#/components/schemas/PersonLimits" }
        made_by: { type: string, description: "The person who made it." }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, description: "When it was last sent: as it was made, or sent again." }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [pending, accepted, revoked, expired] }
        accepted_by: { type: [string, "null"], description: "The person who joined by it." }
    InviteList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Invite" }
    InviteCreate:
      type: object
      additionalProperties: false
      required: [role]
      description: "`email`, `github_login` or `handle`, one of them."
      properties:
        email: { type: string, maxLength: 254 }
        github_login: { type: string, pattern: "^[A-Za-z0-9-]{1,39}$" }
        handle: { type: string, maxLength: 31, description: "A person here by their @handle, with or without its @." }
        role: { $ref: "#/components/schemas/Role" }
        teams:
          type: array
          items: { $ref: "#/components/schemas/TeamPick" }
        limits: { $ref: "#/components/schemas/PersonLimits" }
    InviteCreated:
      allOf:
        - $ref: "#/components/schemas/Invite"
        - type: object
          required: [link, emailed]
          properties:
            link:
              type: string
              description: The link to send them, shown in this answer only. It works once, for seven days, for who it names.
              examples: ["https://app.wheelmachine.ai/invite#..."]
            emailed:
              type: boolean
              description: |
                Whether we are e-mailing it to the address it names: never for a GitHub login, nor when we cannot send it,
                nor past what an organisation e-mails in a day. The same whether or not the address has an account here.
                The link works either way.
    SpendAlerts:
      type: object
      required: [object, month, spent_usd, alert_usd, limit_usd, limit_percents, passed, your_emails, email_on]
      properties:
        object: { const: spend_alerts }
        month: { type: string, description: "This month, `YYYY-MM`, as months are counted: in UTC." }
        spent_usd: { type: number, description: "What the account's machines came to this month so far." }
        alert_usd:
          type: [number, "null"]
          description: The alert amount for the month; null for none.
        limit_usd:
          type: [number, "null"]
          description: The account's limit for the month - the lower of its own and Wheelmachine's - which pauses its machines once it is reached; null for none.
        limit_percents:
          type: array
          items: { type: integer }
          description: The shares of the limit that are told, when there is one.
          examples:
            - [50, 75, 90, 100]
        passed:
          type: array
          description: What passed this month, the first first.
          items:
            type: object
            required: [kind, usd, spent_usd, at, emails]
            properties:
              kind:
                type: string
                enum: [alert, limit_50, limit_75, limit_80, limit_90, limit_100]
                description: The alert amount, or 50%, 75%, 90% or 100% of the limit; an older entry may say 80%.
              usd: { type: number, description: "The alert's amount, or the limit's." }
              spent_usd: { type: number, description: What had been spent as it passed. }
              at: { type: string, format: date-time }
              emails: { type: integer, description: How many people were e-mailed of it. }
        your_emails: { type: boolean, description: Whether you get these e-mails in this account. }
        email_on: { type: boolean, description: "Whether we can send e-mail just now; when not, what passed is shown only here." }
    SpendAlertSet:
      type: object
      additionalProperties: false
      required: [alert_usd]
      properties:
        alert_usd:
          type: [number, "null"]
          minimum: 0.01
          maximum: 10000000
          description: Dollars a month; null for no alert.
          examples: [50]
    AccountLimitSet:
      type: object
      additionalProperties: false
      required: [month_cap_usd]
      properties:
        month_cap_usd:
          type: [number, "null"]
          minimum: 0
          maximum: 10000000
          description: Dollars a month; null for no limit of the account's own.
          examples: [200]
    UsageLimits:
      type: object
      required: [object, month, resets_at, alert_percents, account, folders, teams, people, yours, passed]
      properties:
        object: { const: usage_limits }
        folders:
          description: What the account keeps in its folders, the Trash included, against what it may; null when folders are not available.
          oneOf:
            - type: "null"
            - type: object
              required: [used_bytes, cap_bytes, percent]
              properties:
                used_bytes: { type: integer }
                cap_bytes: { type: integer }
                percent: { type: [integer, "null"] }
        month: { type: string, description: "This month, `YYYY-MM`, in UTC." }
        resets_at: { type: string, format: date-time, description: "When limits for the month lift: the first of the next month, 00:00 UTC." }
        alert_percents:
          type: array
          items: { type: integer }
          examples:
            - [50, 75, 90, 100]
        account:
          type: object
          required: [name, kind, month_cap_usd, in_force_usd, in_force, spent_usd, percent, limited, set_by, set_at, wheelmachine, changed_by,
            you_change]
          properties:
            name: { type: string }
            kind: { type: string, enum: [person, org] }
            month_cap_usd: { type: [number, "null"], description: "The account's own limit; null for none, or to those not shown it." }
            in_force_usd: { type: [number, "null"], description: "The lower of its own and Wheelmachine's: the one that applies." }
            in_force:
              type: string
              enum: [account, wheelmachine, ""]
              description: Whose limit holds; empty for none.
            spent_usd: { type: [number, "null"] }
            percent: { type: [integer, "null"], description: "How much of the limit in force is used, rounded down: said to everyone it holds." }
            limited: { type: boolean, description: "Whether a limit for the month holds the account: said to everyone in it." }
            set_by: { oneOf: [{ $ref: "#/components/schemas/PersonName" }, { type: "null" }] }
            set_at: { type: [string, "null"], format: date-time }
            wheelmachine:
              type: object
              required: [month_cap_usd, max_machines, max_vcpus]
              description: Wheelmachine's own limits for the account, which its support raises.
              properties:
                month_cap_usd: { type: [number, "null"] }
                max_machines: { type: integer }
                max_vcpus: { type: [integer, "null"] }
            changed_by:
              type: array
              items: { type: string }
              description: "Who sets the account's own limit: `owner` (and `billing`, in an organisation)."
            you_change: { type: boolean }
        teams:
          type: array
          items:
            type: object
            required: [id, name, month_budget_usd, spent_usd, percent, yours, changed_by, you_change]
            properties:
              id: { type: string }
              name: { type: string }
              month_budget_usd: { type: [number, "null"] }
              spent_usd: { type: [number, "null"], description: "Null to those not shown what the team spends: its members." }
              percent: { type: [integer, "null"] }
              yours: { type: boolean, description: "You are a member of it." }
              changed_by:
                type: array
                items: { type: string }
                description: "A team's budget is one of its rules: set by its full managers, owners and admins, signed in."
              you_change: { type: boolean }
        people:
          type: array
          items:
            type: object
            required: [person, role, month_cap_usd, spent_usd, percent, max_machines, max_vcpus, gpus, changed_by, you_change]
            properties:
              person: { $ref: "#/components/schemas/PersonName" }
              role: { type: string }
              month_cap_usd: { type: [number, "null"] }
              spent_usd: { type: [number, "null"] }
              percent: { type: [integer, "null"] }
              max_machines: { type: [integer, "null"] }
              max_vcpus: { type: [integer, "null"] }
              gpus: { type: boolean }
              changed_by:
                type: array
                items: { type: string }
                description: Who can change their limit for the month, by role.
              you_change: { type: boolean }
        yours:
          type: array
          description: The limits for the month that apply to you, with how near each is.
          items:
            type: object
            required: [scope, name, limit_usd, spent_usd, percent, reached]
            properties:
              scope: { type: string, enum: [wheelmachine, account, team, person] }
              name: { type: string }
              limit_usd: { type: [number, "null"], description: "Null to those not shown it." }
              spent_usd: { type: [number, "null"] }
              percent: { type: [integer, "null"] }
              reached: { type: boolean }
        passed:
          type: array
          description: The thresholds of a limit told this month that you are shown.
          items:
            type: object
            required: [scope, name, percent, at]
            properties:
              scope: { type: string, enum: [account, team, person] }
              name: { type: string }
              percent: { type: integer, enum: [50, 75, 80, 90, 100] }
              at: { type: string, format: date-time }
    MailPreference:
      type: object
      required: [object, account, role, spend_alerts]
      properties:
        object: { const: mail_preference }
        account:
          type: object
          required: [id, name, kind]
          properties:
            id: { type: string }
            name: { type: string }
            kind: { type: string, enum: [person, org] }
        role:
          type: string
          description: "Your role there: `owner` in your own account. Empty when a link's token turned it off for an organisation you are no longer in."
        spend_alerts: { type: boolean, description: Whether you get spend alerts in that account. }
    MailPreferenceList:
      type: object
      required: [object, data, email_on]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/MailPreference" }
        email_on: { type: boolean, description: Whether we can send e-mail just now. }
    MailPreferenceSet:
      type: object
      additionalProperties: false
      required: [spend_alerts]
      properties:
        spend_alerts: { type: boolean }
    UnsubscribeRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, description: "The token of a spend alert's link." }
        spend_alerts: { type: boolean, description: "True turns the alerts back on; left out or false turns them off." }
    SignOutRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, description: "What follows `#` in the e-mail's link." }
    SignedOut:
      type: object
      required: [object, sign_ins, programs]
      properties:
        object: { const: signed_out }
        sign_ins: { type: integer, description: "How many sign-ins to the dashboard ended." }
        programs: { type: integer, description: "How many programs signed in through the browser were signed out, their keys revoked." }
    InviteToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, description: "What follows `#` in the link." }
    InviteAccept:
      type: object
      additionalProperties: false
      required: [token, notice_seen]
      properties:
        token: { type: string }
        notice_seen: { const: true, description: "You read the invitation's `notice`." }
    InviteSeen:
      type: object
      required: [object, org, role, teams, limits, made_by, expires_at, for_you, notice]
      properties:
        object: { const: invite_seen }
        org:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        teams:
          type: array
          items:
            type: object
            properties:
              project: { type: string }
              name: { type: string }
              lead: { type: boolean }
              level: { $ref: "#/components/schemas/Level" }
        limits: { $ref: "#/components/schemas/PersonLimits" }
        made_by:
          type: object
          description: Who invites you.
          properties:
            name: { type: string }
            handle: { type: string }
            github_login: { type: [string, "null"] }
        expires_at: { type: string, format: date-time }
        for_you: { type: boolean, description: "It is for your e-mail address, your GitHub login or you by your @handle: you may join by it." }
        notice: { type: string, description: "What the organisation's owners and admins can see of your machines there. Read before you join." }
    AuditEvent:
      type: object
      required: [id, object, at, action, target, person, by, address, request_id, detail]
      properties:
        id: { type: string }
        object: { const: audit_event }
        at: { type: string, format: date-time }
        action: { type: string, examples: [machine.create, member.role, machine.terminal.open] }
        target: { type: string, description: "What it was done to: a machine, a key, a person." }
        person:
          type: [object, "null"]
          description: The person who did it, by their id, name and @handle; null for what Wheelmachine or its staff did.
          properties:
            id: { type: string }
            name: { type: string }
            handle: { type: string, description: "Their @handle, without its @: lower-case letters, digits and -, theirs alone. May be empty." }
        by: { type: string, description: "The key (`key_...`) or the sign-in (`ses_...`) it was done with; `system` for what Wheelmachine did by itself; `wheelmachine` for its staff." }
        address: { type: string, description: "The IP address it came from." }
        request_id: { type: string }
        detail:
          type: object
          additionalProperties: { type: string }
    AuditEventList:
      type: object
      required: [object, data, next]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next: { type: [string, "null"] }
    TeamMember:
      type: object
      required: [object, project, person, role, lead, added_at]
      properties:
        object: { const: team_member }
        project: { type: string }
        person:
          description: To a member, a teammate by their name alone - `email` and `github_login` are null; to the team's managers, in full.
          $ref: "#/components/schemas/Person"
        role:
          description: Their role in the organisation; null to a member.
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        lead: { type: boolean, description: "They manage the team, at any level: a member who does reaches the machines its members hold there." }
        level:
          description: Their level as its manager; null for none.
          oneOf:
            - $ref: "#/components/schemas/Level"
            - type: "null"
        added_at: { type: string, format: date-time }
    TeamMemberList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/TeamMember" }
    TeamMemberSet:
      type: object
      additionalProperties: false
      properties:
        level:
          description: Their level as its manager, or null for none; left out, a person in the team keeps theirs.
          oneOf:
            - $ref: "#/components/schemas/Level"
            - type: "null"
        lead: { type: boolean, description: "Older form of `level`: true for a team manager, false for none." }

    Project:
      type: object
      required: [id, object, name, created_at]
      properties:
        id: { type: string, examples: [prj_01jb2xk3n4p5q6r7s8t9v0w1x2] }
        object: { const: project }
        name: { type: string }
        created_at: { type: string, format: date-time }
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    ProjectUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    ProjectList:
      type: object
      required: [object, data, next]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        next: { type: [string, "null"] }

    Scope:
      type: string
      description: |
        `cloud:machines:read` see machines, and the names of secrets; `cloud:machines:write` make, change, pause,
        fork and delete them; `cloud:machines:exec` run commands and read or write files in them; `cloud:gpus` make
        GPU machines; `cloud:projects:write` make and change projects; `cloud:keys:write` make and revoke keys;
        `cloud:secrets:write` set and delete secrets, and give them to machines; `cloud:folders:read` see folders and
        what is in them; `cloud:folders:write` change what is in them, and make team folders; `cloud:*` all of these.
      enum: ["cloud:*", "cloud:machines:read", "cloud:machines:write", "cloud:machines:exec", "cloud:gpus",
             "cloud:projects:write", "cloud:keys:write", "cloud:secrets:write", "cloud:folders:read", "cloud:folders:write"]
    Key:
      type: object
      required: [id, object, name, scopes, projects, shown, state, created_at]
      properties:
        id: { type: string, examples: [key_3f9a1c2b4d5e6f70] }
        object: { const: key }
        name: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        projects:
          type: array
          description: The projects it is limited to; empty for every project of the account.
          items: { type: string }
        shown: { type: string, description: "Its first and last characters, to recognise it by.", examples: ["ak_live_abcd…wxyz"] }
        state: { type: string, enum: [active, revoked, expired] }
        rate_per_minute: { type: [integer, "null"], description: "Calls a minute it may make; a key cannot give more than its own." }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        made_by:
          type: [string, "null"]
          description: In an organisation, the person who made it, by their own account's id; null in your own account.
    KeyCreate:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Scope" }
        projects:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
        rate_per_minute: { type: integer, minimum: 1, maximum: 6000, description: "Calls a minute it may make; a key cannot give more than its own." }
    KeyCreated:
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "The key itself. Shown in this answer only." }
    KeyList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Key" }

    MachineState:
      type: string
      description: |
        `starting` being made ready; `running`; `paused` memory kept, nothing running; `stopped` files kept, memory
        not; `archived` files in storage; `recovering` a fault on our side stopped it, and it is being brought back; `deleted`; `failed` it never came up, and `failure` says why - nothing is charged for it, and it is
        gone as a deleted machine is.
      enum: [starting, running, paused, stopped, archived, recovering, deleted, failed]
    Machine:
      type: object
      required: [id, object, name, project, state, labels, network, files_sealed, created_at]
      properties:
        id: { type: string, examples: [m_01jb2xk3n4p5q6r7s8t9v0w1x2] }
        object: { const: machine }
        name: { type: string }
        project: { type: string }
        made_by:
          type: [string, "null"]
          description: In an organisation, the person who made it, by their own account's id; null in your own account.
        held_by:
          description: In an organisation, whose machine it is - the person who holds it; null in your own account.
          oneOf:
            - $ref: "#/components/schemas/HeldBy"
            - type: "null"
        access:
          type: string
          enum: [full, watch]
          description: |
            What you may do with it. `full`: you hold it and use it all. `watch`: you see it and watch its screen, and never use
            it. Only its holder runs commands in it and opens its terminal, files, ports and SSH. Owners, admins and team managers
            still start, stop, pause and delete it, and set its name, team, labels and internet; owners and admins give it
            secrets, and team managers may take them away. An owner or admin uses one whose holder has left the organisation, or
            holds no machine there.
        state: { $ref: "#/components/schemas/MachineState" }
        gpu:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/GpuRef"
        size:
          type: [object, "null"]
          properties:
            cpus: { type: integer }
            memory_gb: { type: number }
            disk_gb: { type: number }
        location:
          type: [object, "null"]
          description: Where it runs now.
          properties:
            city: { type: string }
            country: { type: string, description: ISO 3166-1 alpha-2 }
        cpus:
          type: [integer, "null"]
          description: |
            Its CPUs, with 2 GB of memory each; null for a GPU machine, whose size comes with its GPU.
          enum: [2, 4, 8, 16, null]
        memory_gb:
          type: [number, "null"]
          description: Its memory; null for a GPU machine.
        sleep_when_idle:
          type: boolean
          description: |
            True: it pauses by itself once it is idle - no call or connection has reached it for `idle_after_s` and
            its programs have been quiet as long. False: it never pauses by itself.
        idle_after_s:
          type: [integer, "null"]
          description: How long it must be idle before it pauses by itself; null when it never does.
        labels:
          type: object
          additionalProperties: { type: string }
        secrets:
          type: array
          description: The names of the secrets every command, terminal and SSH session in it gets as environment variables; never their values.
          items: { type: string }
        ai_keys:
          type: array
          description: |
            The names of the account's secrets on every machine (AI keys, `every_machine`) that reach it: it gets each
            as it gets its secrets, a placeholder in place of the key, and the key is added on the way out, only to the key's hosts.
            Empty for a closed machine, and for one whose list allows none of a key's hosts.
          items: { type: string }
          examples: [[ANTHROPIC_API_KEY, OPENAI_API_KEY]]
        network: { $ref: "#/components/schemas/Network" }
        files_sealed:
          type: boolean
          description: Its files in storage are encrypted.
        running_seconds: { type: number, description: "All the time it has run, which is what is charged." }
        disk_bytes: { type: integer }
        cpu_cores: { type: number, description: "CPUs it used, about a minute's average, when running." }
        memory_bytes: { type: integer }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        ready_ms:
          type: number
          description: How long making it ready took, when this answer made it ready (create, start, fork).
        failure:
          type: string
          description: Why it never came up, in plain words, when its `state` is `failed`.
          examples: ["no GPU came free in 15 minutes; nothing is charged for it"]
        pause_reason:
          description: |
            Why it is paused, while a limit holds it so: the limit that paused it, in the words you are told it in - its
            amounts only to those who may see them - and the same limit as a `limit` error carries it. Null otherwise:
            a machine paused by its holder, or by itself, has none, and neither has one whose limit has lifted.
          oneOf:
            - $ref: "#/components/schemas/PauseReason"
            - type: "null"
        clearing:
          type: boolean
          description: |
            It is being handed off, or is a fork being cleared for the person it was made for: every way into it is refused
            until that ends.
        origin:
          description: Where it came from, when another person's machine was its start; null otherwise - and once it is back with the one who handed it off.
          oneOf:
            - $ref: "#/components/schemas/Origin"
            - type: "null"
        given_by:
          description: |
            In an organisation, who handed it off to the person who holds it, or forked it for them: they watch it, and take it back whenever
            they choose, with whatever is in it then (`take-back`); its holder gives it back to them (`give-back`), and
            deletes it only once they can no longer hold it. Null when nobody did - it belongs to the person who made it - and in a person's
            own account.
          oneOf:
            - $ref: "#/components/schemas/PersonName"
            - type: "null"
        made_for_by:
          description: |
            In an organisation, who made it for the person who holds it (`POST /v1/machines/batch`): it is theirs as their
            own, never taken back - they may give it back (`give-back`). Null otherwise.
          oneOf:
            - $ref: "#/components/schemas/PersonName"
            - type: "null"
        type:
          type: [string, "null"]
          description: The team's machine type it was made from, by id; null for none.
        put_away_after_s:
          type: [integer, "null"]
          description: |
            Archived once nobody has used it this long, paused or stopped; null for no time of its own. It
            may be archived sooner.
    PauseReason:
      type: object
      required: [why, limit]
      properties:
        why:
          type: string
          description: The limit that holds the machine paused, who can raise it and when it lifts by itself, in plain words.
          examples: ["This organisation's limit for this month is reached. Its machines run again on 1 December, or once an owner or billing raises it. Everything in them is kept."]
        limit: { $ref: "#/components/schemas/LimitHit" }
    Origin:
      type: object
      required: [kind, from, machine_name, at]
      properties:
        kind: { type: string, enum: [fork, hand_off] }
        from: { $ref: "#/components/schemas/PersonName" }
        machine_name: { type: string, description: "The name the machine it came from had then." }
        at: { type: string, format: date-time }
    GpuRef:
      type: object
      required: [id]
      properties:
        id: { type: string, description: "An `id` from `GET /v1/gpus`." }
        model: { type: string }
        count: { type: integer }
        memory_gb: { type: integer }
    MachineCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80, description: "For people; ids are made by us." }
        project: { type: string, description: "Its project; the account's first project when left out." }
        region:
          type: string
          description: "A region `id` from `GET /v1/regions` to run near. Where it runs is said in `location`."
        gpu: { type: string, description: "A GPU `id` from `GET /v1/gpus`. Needs the `cloud:gpus` scope." }
        cpus:
          type: integer
          enum: [2, 4, 8]
          default: 2
          description: |
            Its CPUs, with 2 GB of memory each. Charged by the second: 8 CPUs cost 4 times 2. Not with `gpu`: a GPU machine's
            size comes with it.
        labels:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 200 }
        secrets: { $ref: "#/components/schemas/SecretNames" }
        network:
          allOf:
            - $ref: "#/components/schemas/NetworkSet"
          description: |
            Its internet policy. Left out, the machine is open.
        sleep_when_idle:
          type: boolean
          default: true
          description: |
            True: it pauses by itself once it is idle - no call or connection has reached it for `idle_after_s`
            and its programs have been quiet as long (under 5% of one CPU on average), so a job left running keeps
            it going. Paused, it keeps its memory and no running time is charged. False: it never pauses by itself;
            it runs, and is charged, until it is paused or stopped.
        idle_after_s:
          type: integer
          minimum: 60
          maximum: 86400
          default: 300
          description: How long it must be idle before it pauses by itself. Only with `sleep_when_idle` true.
        put_away_after_s:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 0
          description: |
            Archive it once nobody has used it this long, paused or stopped: from 3600 (an hour) to 2592000 (30
            days), or 0 for no time of its own.
        type:
          type: string
          description: |
            One of its team's machine types, by id or name: it is made as the type says, so `cpus`, `gpu`, `network`,
            `sleep_when_idle`, `idle_after_s` and `put_away_after_s` are refused beside it. In a team whose `types_only`
            rule is on, its members and managers make machines from its types alone.
        wait_s: { type: number, minimum: 0, maximum: 600, default: 60, description: "How long to wait for it to be running, in seconds; past that the answer is `202`." }
    MachineUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        project: { type: string, description: "Another of the account's projects to move it to, one this key reaches." }
        labels:
          type: object
          additionalProperties: { type: [string, "null"], maxLength: 200 }
        secrets:
          allOf:
            - $ref: "#/components/schemas/SecretNames"
          description: |
            Every secret it is to get, said whole: the list takes the place of the one it had, and `[]` takes them all
            away (which needs no `cloud:secrets:write`: it gives nothing).
        network:
          allOf:
            - $ref: "#/components/schemas/NetworkSet"
          description: |
            Its internet policy, said whole: it takes the place of the one it had. On a running machine it takes
            effect at once, without a restart.
    Network:
      type: object
      required: [internet, allow]
      description: A machine's internet policy.
      properties:
        internet:
          type: string
          enum: [open, closed, allowed]
          description: |
            `open`: it reaches the whole internet. `closed`: no outbound connections, apart from name lookups
            (DNS). `allowed`: only what `allow` lists.
        allow:
          type: array
          description: Where an `allowed` machine may reach; empty for `open` and `closed`.
          items: { type: string }
    NetworkSet:
      type: object
      additionalProperties: false
      required: [internet]
      properties:
        internet:
          type: string
          enum: [open, closed, allowed]
        allow:
          type: array
          maxItems: 64
          description: |
            For `allowed` only (empty or left out otherwise). Each entry is a domain name for HTTP and HTTPS - exact
            (`api.github.com`) or a single leading `*.` for every name under it (`*.githubusercontent.com`) - or an
            IPv4/IPv6 range as a CIDR (`140.82.112.0/20`) for any other port. HTTP and HTTPS reach only the listed
            names (a connection that names no host, or an unlisted one, is
            refused); other ports reach only the listed ranges.
          items: { type: string, maxLength: 253 }
    SecretNames:
      type: array
      maxItems: 200
      uniqueItems: true
      description: |
        Names of the account's secrets that commands in the machine get as environment variables, and its terminals and SSH
        sessions too while they are 64 KiB or less together (past that those open without them). Giving them needs
        `cloud:secrets:write` and a key not limited to some projects; each must be set already. A secret kept outside must have a
        host the machine's network allows. Any key that may run commands in the machine can read what it was given. The
        account's AI keys reach it as well (`ai_keys`).
      items: { type: string, pattern: "^[A-Z_][A-Z0-9_]{0,63}$" }
    HeldBy:
      type: object
      required: [id, name, handle, role, level]
      description: Whose a machine of an organisation is.
      properties:
        id: { type: string, description: "The person, by their own account's id." }
        name: { type: string, description: "Their name, as they gave it; empty when they gave none. Name them by their handle then." }
        handle: { type: string, description: "Their @handle, without its @: lower-case letters, digits and -, theirs alone. May be empty." }
        role:
          description: Their role in the organisation; null once they are no longer in it.
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        level:
          description: Their level when they manage the machine's team; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Level"
            - type: "null"
    MachineFork:
      type: object
      additionalProperties: false
      description: How a fork differs from its original - its name is the original's with `-fork` after it, and its labels are the original's, when left out.
      properties:
        name: { type: string, maxLength: 80 }
        labels:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 200 }
        backup:
          type: string
          description: |
            One of the machine's backups to make the fork from - its id, or `latest` for its newest - its files as they
            were then, starting afresh. Left out, the fork is of the machine as it is now. In an organisation, a backup
            taken before the machine was last handed off is its owners' and admins' alone to fork from.
        cpus:
          type: integer
          enum: [2, 4, 8]
          description: |
            Only with `backup`: the fork's CPUs, with 2 GB of memory each - the original's when left out. A fork of
            the machine as it is now is always the original's size. Not for a GPU machine, whose size comes with its GPU.
        wait_s: { type: number, minimum: 0, maximum: 600, default: 60, description: "How long to wait for it to be running, in seconds; past that the answer is `202`." }
    GiveTo:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: { type: string, description: "The teammate: their @handle, id, e-mail address or GitHub login." }
        team: { type: string, description: "The team it goes into, of theirs: the machine's own when left out, else their only team." }
        why: { type: string, maxLength: 280 }
    BackTo:
      type: object
      additionalProperties: false
      properties:
        team: { type: string, description: "The team it goes back into, of the one it goes back to: where it is when they may hold machines there, else the one it was handed off from, else their only team." }
    RequestAsk:
      type: object
      additionalProperties: false
      required: [kind, of]
      properties:
        kind: { type: string, enum: [fork, hand_off] }
        of: { type: string, description: "The teammate whose machine: their @handle, id, e-mail address or GitHub login." }
        team: { type: string, description: "The team of yours it goes into, when it is another than the machine's." }
        why: { type: string, maxLength: 280 }
    RequestDecide:
      type: object
      additionalProperties: false
      properties:
        machine: { type: string, description: "For an ask, its holder's pick of their machines, as they approve." }
        why: { type: string, maxLength: 280 }
    GivingAsk:
      type: object
      additionalProperties: false
      required: [for, to]
      properties:
        for: { type: string, enum: [hand_off, fork] }
        to: { type: string }
    Request:
      type: object
      required: [id, object, kind, way, machine, holder, receiver, asked_by, state, created_at, expires_at]
      properties:
        id: { type: string, examples: [rq_01jb2xk3n4p5q6r7s8t9v0w1x2] }
        object: { const: request }
        kind: { type: string, enum: [fork, hand_off] }
        way:
          type: string
          enum: [give, ask, back]
          description: "`give`: by its holder or someone above them, or a member's fork of their own machine (`holder` and `receiver` both them); `ask`: by the person who would get it; `back`: returning a handed-off machine, taken back (`asked_by` is its `receiver`) or given back by its holder."
        machine:
          description: The machine - by its name when it was picked; null while an ask waits for its holder's pick.
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: [string, "null"] }
                name: { type: string }
            - type: "null"
        holder: { $ref: "#/components/schemas/PersonName" }
        receiver: { $ref: "#/components/schemas/PersonName" }
        asked_by: { $ref: "#/components/schemas/PersonName" }
        from_team: { type: [string, "null"] }
        to_team: { type: [string, "null"], description: "The team it goes into, when it is another." }
        gpu: { type: boolean }
        why: { type: string }
        state: { type: string, enum: [waiting, approved, done, failed, declined, expired, taken_back] }
        waiting_on:
          description: |
            Whose OK it waits on - the person who made the key (`asker`, by name: one given or asked with a key, approved in the
            dashboard), its holder (by name), a manager (for a fork, a full manager) or an admin; null once it
            waits no more.
          oneOf:
            - type: object
              required: [who, name]
              properties:
                who: { type: string, enum: [asker, holder, manager, admin] }
                name: { type: [string, "null"] }
            - type: "null"
        decided_by:
          oneOf:
            - $ref: "#/components/schemas/PersonName"
            - type: "null"
        decision_why: { type: string }
        result: { type: [string, "null"], description: "The fork, once it is made." }
        backup: { type: [string, "null"], description: "A fork from one of the machine's backups: that backup's id; null for a fork of the machine as it is, and for a hand-off." }
        cpus: { type: [integer, "null"], description: "A fork from a backup asked at another size: that size; null for the original's." }
        failure: { type: [string, "null"], description: "Why it could not be carried out." }
        restarted: { type: boolean, description: "The machine started again on the way, its programs ended." }
        keys_revoked: { type: integer, description: "Wheelmachine keys found in it as it was handed off or cleared, and revoked." }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        done_at: { type: [string, "null"], format: date-time }
    RequestList:
      type: object
      required: [object, data, next]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Request" }
        next: { type: [string, "null"] }
    GivingCheck:
      type: object
      required: [object, cleared, ended, left, left_count, restarted, needs, secrets]
      properties:
        object: { const: giving_check }
        cleared:
          type: object
          properties:
            browser_profiles: { type: integer }
            sign_ins: { type: array, items: { type: string } }
            home: { type: array, items: { type: string } }
            keys: { type: integer, description: "Wheelmachine keys found in it, which would be revoked." }
            sessions: { type: integer, description: "For a hand-off: your sign-ins to the dashboard found in its browsers, which would end." }
        ended: { type: array, items: { type: string }, description: "Agents signed in with their own account, whose session would end." }
        left:
          type: object
          description: What would stay, by name - never by value. A hand-off clears nothing, so it names nothing.
          properties:
            settings:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  programs: { type: integer }
            files: { type: array, items: { type: string } }
            remotes: { type: array, items: { type: string } }
            config: { type: array, items: { type: string } }
            profiles: { type: array, items: { type: string }, description: "Browser profiles outside the places it clears, by their paths: named, never removed." }
            links: { type: array, items: { type: string }, description: "Links out of the home, removed, whose targets stay as they were." }
            shells: { type: integer, minimum: 0, description: "Interactive shells and REPLs open in it, their histories still in memory." }
            service: { type: array, items: { type: string }, description: "Keyring programs running in it, which keep secrets of their own." }
        left_count: { type: integer, description: "How many things would stay - each setting, file, remote, profile, link, keyring program and open shell." }
        goes: { type: array, items: { type: string }, description: "For a hand-off: what goes with it - everything, the sign-ins in it too." }
        every_sign_in_ends:
          type: boolean
          description: "For a hand-off: every one of your sign-ins to the dashboard would end, not only those found in it, as its browsers could not all be read."
        gets: { type: array, items: { type: string }, description: "For a fork: what its receiver gets." }
        restarted: { type: boolean, description: "The machine started again to be asked, its programs ended." }
        needs:
          type: string
          enum: [none, manager, admin, "off"]
          description: What it would wait on, beyond its holder's OK; `off` when a rule of the machine's team refuses it to you.
        secrets: { type: array, items: { type: string }, description: "The names of the secrets that go with it." }
    Code:
      type: object
      required: [object, github, gitlab, connections, grants, protected_branches, links]
      properties:
        object: { type: string, enum: [code] }
        github: { type: boolean, description: "Whether GitHub can be connected, and GitHub accounts linked" }
        gitlab: { type: boolean, description: "Whether GitLab can be connected in one approval, and GitLab accounts linked" }
        connections: { type: array, items: { $ref: "#/components/schemas/CodeConnection" } }
        grants: { type: array, items: { $ref: "#/components/schemas/CodeGrant" } }
        protected_branches: { type: array, items: { type: string }, description: "The branches no machine of the account pushes to" }
        links: { type: array, items: { $ref: "#/components/schemas/CodeLink" }, description: "The caller's own linked accounts" }
    CodeLink:
      type: object
      required: [object, provider, host, login, held, linked_at]
      properties:
        object: { type: string, enum: [code_link] }
        provider: { type: string, enum: [github, gitlab] }
        host: { type: string, description: "github.com, or the GitLab of Wheelmachine's GitLab application" }
        login: { type: string, description: "Your username there" }
        held: { type: boolean, description: "GitHub or GitLab no longer takes it: your machines push nothing there until you link it again" }
        linked_at: { type: string, format: date-time }
    CodeProtected:
      type: object
      required: [object, branches]
      properties:
        object: { type: string, enum: [code_protected] }
        branches: { type: array, items: { type: string } }
    CodePush:
      type: object
      required: [branches, tags]
      properties:
        branches: { type: array, items: { type: string }, description: "The branches its machines push to; none for any the account allows" }
        tags: { type: boolean, description: "Whether they push its tags too" }
    CodeConnection:
      type: object
      required: [object, id, provider, host, name, suspended, added_at]
      properties:
        object: { type: string, enum: [code_connection] }
        id: { type: string }
        provider: { type: string, enum: [github, gitlab] }
        host: { type: string, description: "github.com, gitlab.com, or a company's own GitLab" }
        name: { type: string, description: "The GitHub account it is installed on; the GitLab person who approved it, as `@` and their username; or, connected by a token, the GitLab group" }
        suspended: { type: boolean, description: "Suspended on GitHub, or no longer accepted by GitLab: no machine reaches its repositories until that is fixed" }
        added_at: { type: string, format: date-time }
    CodeGrant:
      type: object
      required: [object, id, project, connection, host, repo, access, push, granted_at]
      properties:
        object: { type: string, enum: [code_grant] }
        id: { type: string }
        project: { type: string }
        connection: { type: string }
        host: { type: string }
        repo: { type: string }
        access: { type: string, enum: [read, write] }
        push:
          description: "The team's own rule for pushes to it; null for any branch the account does not protect, and its tags"
          oneOf: [{ $ref: "#/components/schemas/CodePush" }, { type: "null" }]
        granted_at: { type: string, format: date-time }
    CodeRepo:
      type: object
      required: [object, repo, host, connection]
      properties:
        object: { type: string, enum: [code_repo] }
        repo: { type: string }
        host: { type: string }
        connection: { type: string }
    SharedFolder:
      type: object
      required: [object, id, kind, name, person, left_at, goes_at, access, teams, bytes, changed_at, made_at]
      properties:
        object: { type: string, enum: [shared_folder] }
        id: { type: string }
        kind: { type: string, enum: [team, own], description: "A team folder, or a person's own (My files)" }
        name: { type: string, description: "A team folder's name; My files for your own; Files of <name> for another's" }
        person: { oneOf: [{ $ref: "#/components/schemas/PersonName" }, { type: "null" }], description: "Whose own it is" }
        left_at: { type: [string, "null"], format: date-time, description: "A person's own: when they left the organisation" }
        goes_at: { type: [string, "null"], format: date-time, description: "...and when it goes for good" }
        access: { type: string, enum: [edit, view, size], description: "What you may do: `size` sees how much it keeps, alone" }
        teams: { type: array, items: { $ref: "#/components/schemas/FolderGrant" } }
        bytes: { type: integer, description: "What it keeps, its Trash included" }
        changed_at: { type: [string, "null"], format: date-time }
        made_at: { type: string, format: date-time }
    FolderGrant:
      type: object
      required: [object, folder, folder_name, project, access, granted_at]
      properties:
        object: { type: string, enum: [folder_grant] }
        folder: { type: string }
        folder_name: { type: string }
        project: { type: string }
        access: { type: string, enum: [view, edit] }
        granted_at: { type: string, format: date-time }
    SharedEntry:
      type: object
      required: [name, type, size, changed_at, changed_by]
      properties:
        name: { type: string }
        type: { type: string, enum: [file, folder] }
        size: { type: integer }
        changed_at: { type: string, format: date-time }
        changed_by: { oneOf: [{ $ref: "#/components/schemas/PersonName" }, { type: "null" }], description: "Who changed it last - from one of their machines too" }
    SharedListing:
      type: object
      required: [object, folder, path, entries, next]
      properties:
        object: { type: string, enum: [shared_listing] }
        folder: { type: string }
        path: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/SharedEntry" } }
        next: { type: [string, "null"], description: "Where the next page starts, as `after`; null after the last" }
    FolderTrash:
      type: object
      required: [object, id, folder, path, type, bytes, deleted_at, deleted_by, goes_at]
      properties:
        object: { type: string, enum: [shared_trash] }
        id: { type: string }
        folder: { type: string }
        path: { type: string, description: "Where it was" }
        type: { type: string, enum: [file, folder] }
        bytes: { type: integer }
        deleted_at: { type: string, format: date-time }
        deleted_by: { oneOf: [{ $ref: "#/components/schemas/PersonName" }, { type: "null" }] }
        goes_at: { type: string, format: date-time }
    FolderChange:
      type: object
      required: [at, action, path, by, from_machine]
      description: |
        A change of the folder's. In a team folder, its path - where it left from, for a file moved to another folder -
        and where it went in this folder; in a person's own folder, never a path, only its kind and size.
      properties:
        at: { type: string, format: date-time }
        action: { type: string, description: "As the audit says it: folder.file.put, folder.file.delete, folder.file.move, folder.grant, ..." }
        path: { type: string }
        to: { type: string }
        type: { type: string, enum: [file, folder] }
        bytes: { type: integer }
        project: { type: string, description: "The team given the folder, or taken from (folder.grant, folder.revoke)" }
        access: { type: string, enum: [view, edit] }
        by: { oneOf: [{ $ref: "#/components/schemas/PersonName" }, { type: "null" }] }
        from_machine: { type: boolean, description: "Made from one of their machines" }
    CodeInstall:
      type: object
      required: [object, url]
      properties:
        object: { type: string, enum: [code_install] }
        url: { type: string, format: uri }
    TeamRules:
      type: object
      required: [object, project, hand_offs, forks, gpus, open_internet, month_budget_usd, spent_usd, open_machines, models, set_by, set_at]
      properties:
        object: { const: team_rules }
        project: { type: string }
        hand_offs: { type: string, enum: [free, ask, "off"] }
        forks: { type: string, enum: [ask, "off"], description: "Every member's fork waits for a full manager, an owner or an admin (`ask`), or none is made (`off`)." }
        gpus: { type: boolean }
        open_internet: { type: boolean }
        month_budget_usd: { type: [number, "null"] }
        spent_usd: { type: [number, "null"], description: "What its machines came to this month: shown to its managers at any level, owners, admins and billing; null to its members." }
        open_machines: { type: [integer, "null"], description: "Its machines whose internet is open; null as spent_usd is." }
        models:
          type: string
          enum: [any, allowed]
          description: "`allowed` where the team or the organisation keeps a list of the models people may use (`GET /v1/models/allowed`) - a team level's or a person's list may hold some of its people too - else `any`."
        set_by:
          oneOf:
            - $ref: "#/components/schemas/PersonName"
            - type: "null"
        set_at: { type: [string, "null"], format: date-time }
        max_machine_vcpus:
          type: [integer, "null"]
          description: "The largest machine it holds, in CPUs: a bigger one is not made, forked, moved or handed into it, nor started in it. Null for no rule."
        idle_max_seconds:
          type: [integer, "null"]
          description: "The longest its machines stay up idle before they sleep, in seconds: a machine may not ask for longer, or never to sleep. Null for no rule."
        public_ports:
          type: string
          enum: ["on", links_only, "off"]
          description: "Whether its machines' ports may be opened to the whole internet (`on`), only shared by a five-minute link (`links_only`), or neither (`off`)."
        types_only:
          type: boolean
          description: "Its members and managers make machines from its machine types alone, and neither change a machine's internet in it nor move one into it. Owners and admins set it."
        applied:
          $ref: "#/components/schemas/RulesApplied"
          description: Only in the answer to setting them - what they did to the team's machines there and then.
    RulesApplied:
      type: object
      required: [idle_lowered, ports_private, links_ended]
      properties:
        idle_lowered: { type: integer, description: "Machines whose idle stop was lowered to the rule." }
        ports_private: { type: integer, description: "Ports no longer open to the whole internet." }
        links_ended: { type: integer, description: "Ports whose links ended, under `off`." }
    TeamRulesSet:
      type: object
      additionalProperties: false
      required: [hand_offs, forks, gpus, open_internet, month_budget_usd]
      properties:
        hand_offs: { type: string, enum: [free, ask, "off"] }
        forks: { type: string, enum: [ask, "off"], description: "`free` is refused: a member's fork always waits for a full manager, an owner or an admin." }
        gpus: { type: boolean }
        open_internet: { type: boolean }
        month_budget_usd: { type: [number, "null"], minimum: 0 }
        max_machine_vcpus: { type: [integer, "null"], minimum: 1, maximum: 1024, description: "Left out: as it is." }
        idle_max_seconds: { type: [integer, "null"], minimum: 60, maximum: 86400, description: "Left out: as it is." }
        public_ports: { type: string, enum: ["on", links_only, "off"], description: "Left out: as it is." }
        types_only: { type: boolean, description: "Left out: as it is. Owners and admins alone change it." }
    TeamRulesChange:
      type: object
      additionalProperties: false
      description: Any of a team's rules; each left out stays as it is.
      properties:
        hand_offs: { type: string, enum: [free, ask, "off"] }
        forks: { type: string, enum: [ask, "off"] }
        gpus: { type: boolean }
        open_internet: { type: boolean }
        month_budget_usd: { type: [number, "null"], minimum: 0 }
        max_machine_vcpus: { type: [integer, "null"], minimum: 1, maximum: 1024 }
        idle_max_seconds: { type: [integer, "null"], minimum: 60, maximum: 86400 }
        public_ports: { type: string, enum: ["on", links_only, "off"] }
        types_only: { type: boolean, description: "Owners and admins alone change it." }
    MachineType:
      type: object
      required: [object, id, project, name, cpus, gpu, apps, network, sleep_when_idle, idle_after_s, put_away_after_s, repos, folders, made_by, made_at, changed_by, changed_at]
      properties:
        object: { const: machine_type }
        id: { type: string, examples: [mty_01jb2xk3n4p5q6r7s8t9v0w1x2] }
        project: { type: string }
        name: { type: string, examples: [builder] }
        cpus: { type: [integer, "null"], description: "Null for a GPU machine, whose size comes with its GPU." }
        gpu: { type: [string, "null"], description: "A GPU `id` from `GET /v1/gpus`, or null." }
        apps:
          type: [array, "null"]
          description: "The apps its machines have on, the code editor always among them; null: those a new machine has on."
          items: { type: string }
        network: { $ref: "#/components/schemas/Network" }
        sleep_when_idle: { type: boolean }
        idle_after_s: { type: [integer, "null"] }
        put_away_after_s: { type: [integer, "null"] }
        repos:
          type: [array, "null"]
          description: "The team's repositories its machines reach, by their grants' ids (`GET /v1/projects/{project_id}/code`); null: every one."
          items: { type: string }
        folders:
          type: [array, "null"]
          description: "The team's folders its machines reach, by id (`GET /v1/projects/{project_id}/folders`); null: every one."
          items: { type: string }
        made_by: { $ref: "#/components/schemas/PersonName" }
        made_at: { type: string, format: date-time }
        changed_by: { $ref: "#/components/schemas/PersonName" }
        changed_at: { type: string, format: date-time }
    MachineTypeSet:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9._-]{1,40}$", description: "The team's own: no other of its types has it, whatever its capitals." }
        cpus: { type: integer, enum: [2, 4, 8], default: 2, description: "Not with `gpu`." }
        gpu: { type: string, description: "A GPU `id` from `GET /v1/gpus`." }
        apps:
          type: [array, "null"]
          description: "The apps its machines have on, of `apps` in the list of types; the code editor is always on. Null or left out: those a new machine has on."
          items: { type: string }
        network: { $ref: "#/components/schemas/NetworkSet" }
        sleep_when_idle: { type: boolean, default: true }
        idle_after_s: { type: integer, minimum: 60, maximum: 86400, default: 300 }
        put_away_after_s: { type: integer, minimum: 0, maximum: 2592000, default: 0, description: "From 3600 to 2592000, or 0 for none." }
        repos:
          type: [array, "null"]
          description: "Some of the team's repositories, by their grants' ids; null: every one. Left out: every one for a new type, as they are for a change."
          items: { type: string }
        folders:
          type: [array, "null"]
          description: "Some of the team's folders, by id; null: every one. Left out: every one for a new type, as they are for a change."
          items: { type: string }
    MachineTypeList:
      type: object
      required: [object, data, apps]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/MachineType" }
        apps:
          type: array
          description: The apps a new machine carries, which a type may turn on.
          items: { $ref: "#/components/schemas/MachineApp" }
    MachineApp:
      type: object
      required: [name, title, kind, default_on, always_on]
      properties:
        name: { type: string, examples: [codex] }
        title: { type: string, examples: [Codex] }
        kind: { type: string, enum: [web, service, agent] }
        default_on: { type: boolean, description: "On in a new machine." }
        always_on: { type: boolean, description: "Never turned off: the code editor." }
    MachineBatchCreate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        project: { type: string, description: "The team; the account's first when left out." }
        type: { type: string, description: "One of the team's machine types, by id or name." }
        people:
          type: array
          maxItems: 100
          description: "Whom for: each by their `@handle`, id, e-mail address or GitHub login, as a teammate is named. Left out (and no `everyone`): yourself."
          items: { type: string }
          examples: [["@ada", "lin@example.com"]]
        everyone: { type: boolean, description: "Everyone in the team, in place of `people`." }
        each: { type: integer, minimum: 1, maximum: 10, default: 1, description: "How many for each person." }
        names:
          type: string
          maxLength: 80
          default: "<type>-<handle>"
          description: "The pattern of their names: `<type>`, `<handle>` and `<n>`, each one's number among its person's. With `each` over 1 and no `<n>`, `-<n>` goes at the end."
        region: { type: string, description: "A region `id` from `GET /v1/regions` to run near." }
        labels:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 200 }
        wait_s: { type: number, minimum: 0, maximum: 600, default: 0, description: "How long to wait for it to be running, in seconds; past that the answer is `202`." }
    MachineBatch:
      type: object
      required: [object, project, type, data, made, refused]
      properties:
        object: { const: machine_batch }
        project: { type: string }
        type: { type: string }
        data:
          type: array
          description: Each machine, in the order asked - each person's in turn.
          items: { $ref: "#/components/schemas/MachineBatchItem" }
        made: { type: integer, description: "Machines made or on their way." }
        refused: { type: integer }
    MachineBatchItem:
      type: object
      required: [person, name, status, machine, error]
      properties:
        person: { $ref: "#/components/schemas/PersonName" }
        name: { type: string }
        status: { type: integer, description: "201 made, 202 on its way, or the error's status." }
        machine:
          oneOf:
            - $ref: "#/components/schemas/Machine"
            - type: "null"
        error:
          description: Why it was not made; null when it was.
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
    WaitOptions:
      type: object
      additionalProperties: false
      properties:
        wait_s: { type: number, minimum: 0, maximum: 600, default: 60, description: "How long to wait for it to be running, in seconds; past that the answer is `202`." }
    MachineList:
      type: object
      required: [object, data, next]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Machine" }
        next: { type: [string, "null"] }
    Backup:
      type: object
      required: [id, object, machine, created_at]
      properties:
        id: { type: string }
        object: { const: backup }
        machine: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }
    BackupList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Backup" }

    Folder:
      type: object
      description: A folder inside a machine.
      required: [object, machine, path, entries, truncated]
      properties:
        object: { const: folder }
        machine: { type: string }
        path: { type: string, examples: ["home/notes"] }
        entries:
          type: array
          items: { $ref: "#/components/schemas/FolderEntry" }
        truncated: { type: boolean, description: "True when it holds more than 1,000 and the list was cut there." }
    FolderEntry:
      type: object
      required: [name, type, size, modified_at]
      properties:
        name: { type: string }
        type: { type: string, enum: [file, folder, link, other] }
        size: { type: integer, description: "Bytes; 0 for a folder." }
        modified_at: { type: [string, "null"], format: date-time }

    MachineMetrics:
      type: object
      required: [object, machine, step_s, cpus, kept_since, points]
      properties:
        object: { const: metrics }
        machine: { type: string }
        step_s: { type: integer, description: "How long each point covers." }
        cpus: { type: [number, "null"], description: "Its CPUs: what cpu_percent is a share of." }
        kept_since:
          type: [string, "null"]
          format: date-time
          description: The oldest point kept; null when there is none.
        points:
          type: array
          items: { $ref: "#/components/schemas/MetricsPoint" }
    MetricsPoint:
      type: object
      required: [at]
      description: |
        A step of the machine. A number that could not be read is null, and so are
        the rates of a step its readings cover none of: the first after it woke.
      properties:
        at: { type: string, format: date-time, description: "Where the step begins." }
        cpu_percent: { type: [number, "null"], description: "Its CPUs' use, a share of its own size, 0 to 100." }
        memory_bytes: { type: [number, "null"], description: "The most memory it used in the step, not counting file cache." }
        memory_limit_bytes: { type: [number, "null"], description: "All the memory it has: the most it may hold." }
        disk_read_bps: { type: [number, "null"], description: "Bytes a second read from its disk." }
        disk_write_bps: { type: [number, "null"], description: "Bytes a second written to its disk." }
        net_rx_bps: { type: [number, "null"], description: "Bytes a second received on its network." }
        net_tx_bps: { type: [number, "null"], description: "Bytes a second sent on its network." }

    ExecRequest:
      type: object
      additionalProperties: false
      description: Give `command` (the words, no shell) or `shell` (a line for `sh -lc`), not both.
      properties:
        command:
          type: array
          minItems: 1
          maxItems: 4096
          items: { type: string }
          examples: [["python3", "-c", "print(2+2)"]]
        shell: { type: string, maxLength: 131072, examples: ["ls -la | wc -l"] }
        env:
          type: object
          maxProperties: 256
          additionalProperties: { type: string }
          description: |
            Environment variables for this command, beside the machine's secrets, which it gets as variables too. Of a
            name in both, the one given here wins: the secret is left out of this command, and the answer does not
            say so. The command, its variables and the machine's secrets are at most 1 MiB together (413).
        cwd: { type: string, description: "Where it starts; the work folder when left out." }
        user: { type: string, enum: [user, root], default: user }
        binary_output: { type: boolean, default: false, description: "Give stdout as base64 in `stdout_base64`." }
    ExecResult:
      type: object
      required: [exit_code, stderr, duration_ms, truncated]
      properties:
        exit_code: { type: integer }
        stdout: { type: string }
        stdout_base64: { type: string }
        stderr: { type: string }
        duration_ms: { type: number }
        truncated: { type: boolean, description: "True when the output was longer than 8 MiB and was cut there." }

    Port:
      type: object
      required: [object, machine, port, public, url, created_at]
      properties:
        object: { const: port }
        machine: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        public:
          type: boolean
          description: |
            True: anyone may reach the address. False: only a call with an API key that can see the machine, and a
            browser that opened a link made for it.
        url:
          type: string
          format: uri
          examples: ["https://8080-01jb2xk3n4p5q6r7s8t9v0w1x2.run.wheelmachine.ai"]
        created_at: { type: string, format: date-time }
    PortOpen:
      type: object
      additionalProperties: false
      required: [port]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        public: { type: boolean, default: false }
    PortList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Port" }
    PortLinkCreate:
      type: object
      additionalProperties: false
      properties:
        access_s:
          type: integer
          minimum: 60
          maximum: 3600
          default: 1800
          description: How long the browser that opens the link may reach the address.
        path:
          type: string
          maxLength: 2048
          default: /
          description: |
            Where on the address the link lands: a path beginning with a single `/` (not `//` or `/\`), with no space
            or backslash in it; a query may follow it.
    PortLink:
      type: object
      required: [object, machine, port, url, expires_at, access_s]
      properties:
        object: { const: port_link }
        machine: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        url: { type: string, format: uri, description: "Opens once. Shown in this answer only." }
        expires_at: { type: string, format: date-time, description: "When the link stops opening, if it was not opened." }
        access_s: { type: integer, description: "How long the browser that opens it may reach the address." }

    App:
      type: object
      required: [object, machine, name, title, kind, "on", running, port, path, url, command]
      description: An app in a machine, as the machine says it is now.
      properties:
        object: { const: app }
        machine: { type: string }
        name: { type: string, pattern: "^[a-z0-9-]{1,32}$", examples: [desktop] }
        title: { type: string, maxLength: 64, examples: [Desktop] }
        kind:
          type: string
          enum: [web, service, agent, terminal]
          description: |
            `web`: a page reached at the machine's private web address for its port. `service`: reached from inside
            the machine alone. `agent`: an agent that keeps a session of its own in the machine's terminal, running
            `command`; on, it is offered, and off, its session ends. `terminal`: an agent run by typing `command` in the machine's
            terminal (older machines).
        "on":
          type: [boolean, "null"]
          description: Whether it is turned on; null for a `terminal` agent, which runs while it is typed.
        running:
          type: [boolean, "null"]
          description: Whether it runs now - for an `agent`, whether its session does; null for a `terminal` agent.
        port:
          type: [integer, "null"]
          minimum: 1
          maximum: 65535
          description: Where it listens inside the machine, when that is said.
        path:
          type: [string, "null"]
          description: A web app's own page on its address, such as `/`; null for any other kind.
        url:
          type: [string, "null"]
          format: uri
          description: |
            A web app's private address; null for any other kind. It answers a call with an API key that can see the
            machine, and a browser that opened a link made for it.
          examples: ["https://6901-01jb2xk3n4p5q6r7s8t9v0w1x2.run.wheelmachine.ai"]
        command:
          type: [string, "null"]
          description: |
            What an `agent`'s session runs, or what to type in the machine's terminal to run a `terminal` agent: a
            word or a few, of letters, digits, spaces and `._/:=@+-` alone. Null for any other kind.
          examples: [codex]
        keys_changed:
          type: boolean
          description: |
            For an `agent`: whether its session, which runs, began with other AI keys than the machine has now. A
            session keeps the keys it began with; turning the agent off and on again ends it, and the next session
            begins with the machine's keys. Left out for any other kind, and when the machine does not say it (one
            made before it did).
        suppliers:
          type: array
          description: |
            For an `agent`, and a `web` app with an agent of its own: the providers whose AI keys it can use, in the order
            it takes them by itself. Left out when the machine does not say them, and so are
            `model`, `model_by` and `model_changed`.
          items: { type: string }
          examples: [[openai, openrouter]]
        model:
          type: [string, "null"]
          description: |
            With `suppliers`: what it last started on, as its provider and the provider's id for the model; null when it has
            not started yet, or picks a model of its own.
          examples: [openai/gpt-6.1-sol]
        model_by:
          type: [string, "null"]
          enum: [chosen, team, default, agent, null]
          description: |
            With `suppliers`: who chose what it last started on - `chosen`, you (`GET /v1/agents`); `team`, your team;
            `default`, it, on the first of the machine's keys it can use; `agent`, a setting inside it. Null when it
            has not started yet.
        model_changed:
          type: boolean
          description: |
            With `suppliers`: whether it runs on another model than the one chosen for it now. Turning it off and on
            again starts it on the one chosen; one that does not run never says so.
        link:
          type: string
          format: uri
          description: |
            In the answer to turning a web app on and to asking for a link: a link that lets one browser into the
            app's address and lands on its page. It opens once, before `expires_at`, and is shown in that answer only.
        expires_at: { type: string, format: date-time, description: "With `link`: when it stops opening, if it was not opened." }
        access_s: { type: integer, description: "With `link`: how long the browser that opens it may reach the address." }
        token:
          type: string
          description: |
            In the answer to turning on an app that has a token of its own, such as OpenClaw: the token its
            page asks for. It is shown in that answer only and kept nowhere by the API.
    AppList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/App" }
    AppLinkCreate:
      type: object
      additionalProperties: false
      properties:
        access_s:
          type: integer
          minimum: 60
          maximum: 3600
          default: 1800
          description: How long the browser that opens the link may reach the app's address.

    Secret:
      type: object
      required: [object, name, machines, every_machine, created_at, updated_at]
      description: A secret as it is shown, always without its value.
      properties:
        object: { const: secret }
        name: { type: string, examples: [DATABASE_URL] }
        machines:
          type: array
          description: The machines that name it (those this key can see).
          items: { type: string }
        outside:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Outside"
          description: |
            Set when the secret is kept outside the machines: its value never enters one (its environment holds only a
            placeholder) and it is added on the way out, only to requests going to its hosts.
        every_machine:
          type: boolean
          description: |
            On every machine of the account that may send it somewhere, not only on those that name it. An AI key is,
            unless it was set with `every_machine: false`; only a secret kept outside can be.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: "When its value was last set." }
    Outside:
      type: object
      required: [preset, hosts, header, format, headers, query]
      description: How a secret kept outside the machines is sent; never its value.
      properties:
        preset:
          type: [string, "null"]
          description: |
            The preset it follows (`GET /v1/secrets/presets`), whose hosts and headers these are as the preset has them
            now; null for a policy of its own.
          examples: [anthropic]
        hosts:
          type: array
          minItems: 1
          maxItems: 32
          description: |
            The hosts its value may be sent to (exact, or a leading `*.` for every name under one). From a machine that
            reaches only what its list names, it is sent only to those the list allows too; such a machine gets it only
            when its list allows at least one.
          items: { type: string, maxLength: 253 }
        header:
          type: string
          description: The request header its value is written into, such as `Authorization`; the first of `headers`.
        format:
          type: string
          description: How the value is written, with `{value}` once; `Bearer {value}`, or `{value}` for the value alone.
        headers:
          type: array
          description: Every request header its value goes in, each written as its `format` says.
          items: { $ref: "#/components/schemas/HeaderRule" }
        query:
          type: array
          description: Query parameters whose value may carry it, for the clients that send a key in the address.
          items: { type: string }
    HeaderRule:
      type: object
      required: [name, format]
      properties:
        name: { type: string, examples: [x-api-key] }
        format: { type: string, description: "How the value is written, with `{value}` once.", examples: ["{value}"] }
    SecretList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
    SecretSet:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 32768
          writeOnly: true
          description: The value, up to 32 KiB of text with no NUL in it. It is never shown again.
        outside:
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/OutsideSet"
          description: |
            Keep the secret outside the machines: its value never enters one - not its environment (which holds only a
            placeholder `wm_secret_<NAME>_<hex>`), its files, its process memory or any answer. It is added on the
            way out, only to requests going to its
            hosts. `true`: the preset of the secret's name (a name `GET /v1/secrets/presets` lists; any other is
            refused, 400). An object: a policy of its own. `false`: an ordinary secret, whose value reaches the
            machines' commands, terminals and SSH sessions as an environment variable - for a tool that cannot work
            with a placeholder. Left out, or null: the name's preset when it has one, else an ordinary secret.
        every_machine:
          type: boolean
          description: |
            On every machine of the account (each as its internet lets it), not only on those that name it. Left out:
            true for a secret kept outside by its name's preset, false for any other. Only a secret kept outside can be
            on every machine (400 otherwise): an ordinary secret's value would enter each of them.
    OutsideSet:
      type: object
      additionalProperties: false
      required: [hosts, header]
      description: A policy of its own, for a secret kept outside the machines.
      properties:
        hosts:
          type: array
          minItems: 1
          maxItems: 32
          description: |
            Where its value may be sent (exact, or a leading `*.`). A machine that reaches only what its list names may
            be given it when its list allows at least one of these, and its value is sent only to those the list allows.
          items: { type: string, maxLength: 253 }
        header:
          type: string
          maxLength: 64
          description: The request header its value is written into, such as `Authorization`.
        format:
          type: string
          maxLength: 256
          description: How the value is written, with `{value}` exactly once; `{value}` (the value alone) by default.
    SecretPreset:
      type: object
      required: [object, id, title, names, hosts, headers, query]
      description: A model provider's key, as the API knows it by its names.
      properties:
        object: { const: secret_preset }
        id: { type: string, examples: [anthropic] }
        title: { type: string, description: "The provider, as people know it.", examples: [Anthropic] }
        names:
          type: array
          description: The secret names it is set under, the one agents read first first.
          items: { type: string }
          examples: [[ANTHROPIC_API_KEY]]
        hosts:
          type: array
          description: The provider's hosts its key is sent to.
          items: { type: string }
          examples: [[api.anthropic.com]]
        headers:
          type: array
          description: The request headers its key goes in.
          items: { $ref: "#/components/schemas/HeaderRule" }
        query:
          type: array
          description: Query parameters whose value may carry it.
          items: { type: string }
    SecretPresetList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/SecretPreset" }

    ModelList:
      type: object
      required: [object, data, suppliers, allowed]
      description: The models of your AI keys, and how each provider's list stands.
      properties:
        object: { const: list }
        data:
          type: array
          description: The models - limited to a list, those of the list alone.
          items: { $ref: "#/components/schemas/Model" }
        suppliers:
          type: array
          description: Each provider of your AI keys, in the order agents choose between keys - one with no list too; limited to a list, the providers of its models alone.
          items: { $ref: "#/components/schemas/ModelSupplier" }
        allowed:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AllowedModels"
          description: The list of the models you may use that applies to your choices, and which it is; null when none does - always for owners and admins, and in a person's own account.
    Model:
      type: object
      required: [object, id, supplier, model, name, created_at, retiring_at, agents, price, intelligence]
      description: A model one of your AI keys can use, as its provider lists it.
      properties:
        object: { const: model }
        id:
          type: string
          description: Its provider and the provider's own id for it, parted by the first `/`.
          examples: [openai/gpt-6.1-sol]
        supplier: { type: string, description: "Its provider, as the presets name it.", examples: [openai] }
        model:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/@+-]{0,159}$"
          description: The provider's own id for it.
          examples: [gpt-6.1-sol]
        name: { type: string, maxLength: 120, description: "As its provider names it; its id where the provider gives no name." }
        created_at: { type: [string, "null"], format: date-time, description: "When it came out, where its provider says." }
        retiring_at: { type: [string, "null"], format: date-time, description: "When its provider says it is to be retired." }
        agents:
          type: array
          description: The agents in your machines that can use its provider's models, as your machines said them.
          items: { type: string }
          examples: [[codex, aider]]
        price:
          description: What it costs, as the provider that bills for it lists it; null where that is not known.
          oneOf:
            - $ref: "#/components/schemas/ModelPrice"
            - type: "null"
        intelligence:
          description: Its score on LMArena's text leaderboard; null where the board has no score for it.
          oneOf:
            - $ref: "#/components/schemas/ModelIntelligence"
            - type: "null"
    ModelPrice:
      type: object
      required: [input_per_million_usd, output_per_million_usd, source, url, as_of]
      description: |
        A model's list price: a million tokens in and a million out, in US dollars, at the provider's standard rate - a
        request of ordinary length, with no batch, cache or off-peak discount. You pay it to that provider with your own
        key; Wheelmachine charges nothing for a model.
      properties:
        input_per_million_usd: { type: number, minimum: 0, examples: [2] }
        output_per_million_usd: { type: number, minimum: 0, examples: [10] }
        source: { type: string, description: "The provider whose list price it is.", examples: [OpenAI] }
        url: { type: string, format: uri, description: "Where that provider lists its prices.", examples: ["https://developers.openai.com/api/docs/pricing"] }
        as_of: { type: string, format: date, description: "The day the price was checked, or the day the provider's list was read.", examples: ["2026-11-02"] }
    ModelIntelligence:
      type: object
      required: [score, source, url, license, as_of]
      description: |
        A model's score on LMArena's text leaderboard, which people's votes between two models' answers rank: the best
        the model has there at any effort, as a whole number. Higher is better.
      properties:
        score: { type: number, examples: [1481] }
        source: { type: string, examples: [LMArena text leaderboard] }
        url: { type: string, format: uri, examples: ["https://lmarena.ai/leaderboard/text"] }
        license: { type: string, description: "The licence LMArena publishes the board under.", examples: [CC BY 4.0] }
        as_of: { type: string, format: date, description: "The day the board was published.", examples: ["2026-10-28"] }
    ModelSupplier:
      type: object
      required: [object, id, title, key, whose, state, listed_at, detail]
      description: A provider of your AI keys, and how its list stands.
      properties:
        object: { const: model_supplier }
        id: { type: string, examples: [openai] }
        title: { type: string, description: "The provider, as people know it.", examples: [OpenAI] }
        key: { type: string, description: "The name of the AI key its list is read with.", examples: [OPENAI_API_KEY] }
        whose:
          type: string
          enum: [account, organisation]
          description: Whose the key is - the account's own, or, in an organisation, the organisation's.
        state:
          type: string
          enum: [listed, refused, busy, unreachable, unlisted]
          description: |
            `listed`: read. `refused`: the provider refused the key - replace it. `busy`: the provider turned the request
            away just now, or the account's lists were asked for too often. `unreachable`: the provider did not answer, or
            has not yet. `unlisted`: no agent in a machine works with this provider's keys yet, so its models are not
            listed. While a provider does not answer, the list it last gave in the last day is shown.
        listed_at:
          type: [string, "null"]
          format: date-time
          description: When the list shown was read; null when none is shown.
        detail:
          type: [string, "null"]
          description: How it stands, in plain words, when it is not `listed`.

    ModelChoice:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          type: string
          maxLength: 193
          description: The model, as `GET /v1/models` gives its `id` - its provider, then the provider's own id for it.
          examples: [openai/gpt-6.1-sol]
    AgentList:
      type: object
      required: [object, data, every_agent, allowed]
      description: The agents in your machines, the one model chosen for every agent, and the list of the models you may use.
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
        every_agent:
          oneOf:
            - type: "null"
            - type: object
              required: [model, chosen_by]
              properties:
                model: { type: string, examples: [openai/gpt-6.1-sol] }
                chosen_by: { type: string, enum: [you] }
          description: The model chosen for every agent, by whom; null for none, or one not on the list of the models you may use.
        allowed:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AllowedModels"
          description: The list of the models you may use that applies to your choices in this team, and which it is; null when none does.
    Agent:
      type: object
      required: [object, name, title, suppliers, model, chosen_by, starts_on, state, note]
      description: An agent in your machines, and the model it starts on.
      properties:
        object: { const: agent }
        name: { type: string, pattern: "^[a-z0-9-]{1,32}$", examples: [codex] }
        title: { type: string, maxLength: 64, examples: [Codex] }
        suppliers:
          type: array
          description: The providers whose AI keys it can use, in the order it takes them by itself.
          items: { $ref: "#/components/schemas/AgentSupplier" }
        model:
          type: [string, "null"]
          description: |
            The model chosen for it: for it, for every agent, or by a list of the models you may use; null for none.
          examples: [openai/gpt-6.1-sol]
        chosen_by:
          type: [string, "null"]
          enum: [you, every_agent, allowed, null]
          description: Who `model` was chosen by - you, for it or for every agent, or the list of the models you may use (`allowed`); null for none.
        starts_on:
          type: [string, "null"]
          description: What it starts on with your keys, as its provider and the provider's id for the model; null with none it can use, or when it picks its own.
          examples: [openai/gpt-6.1-sol]
        state:
          type: string
          enum: [chosen, default, own, no_key, needs_key, cannot_use, retired, not_allowed]
          description: |
            `chosen`: on the model chosen for it. `default`: on its default, with the first of your keys it can use. `own`: on a
            model it picks itself. `no_key`: none of your keys works with it. On its default because the chosen model cannot be
            used: `needs_key`, you have no key of its provider; `cannot_use`, it does not work with that provider; `retired`, the
            provider no longer lists the model. `not_allowed`: none of the models on your list is of a provider it can use, so it
            starts as if nothing was chosen.
        note:
          type: [string, "null"]
          description: How it stands, in a sentence, when it is not as chosen. instead, and a choice the list of the models you may use does not hold, set aside.
    AllowedModels:
      type: object
      required: [object, level, id, name, models, set_by, set_at]
      description: A list of the models an organisation's people may use.
      properties:
        object: { const: allowed_models }
        level:
          type: string
          enum: [organisation, team, role, person]
          description: What the list is for - the whole organisation, a team, a role or one person.
        id:
          type: string
          description: The organisation's id, the team's project id, the role (`member`, `approver`, `manager` or `full`), or the person's id.
          examples: [prj_01hzy3k6m2v9r8q7p5n4j3h2g1]
        name:
          type: string
          description: The organisation's name, the team's, the role's as the dashboard says it (Members, Approvers, Team managers, Full managers), or the person's; empty for a team or a person since gone.
          examples: [Research]
        models:
          type: array
          minItems: 1
          maxItems: 10
          description: The models, in order - the first the one an agent starts on where its person chose none of them.
          items: { type: string, examples: [openai/gpt-6.1-sol] }
        set_by:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PersonName"
          description: Who set it.
        set_at: { type: string, format: date-time }
    AllowedModelsList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/AllowedModels" }
    AllowedModelsSet:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: The models people may use, in order, as `GET /v1/models` gives their ids.
          items: { type: string, maxLength: 193, examples: [openai/gpt-6.1-sol] }
    AgentSupplier:
      type: object
      required: [id, title, default]
      properties:
        id: { type: string, examples: [openai] }
        title: { type: string, examples: [OpenAI] }
        default:
          type: [string, "null"]
          description: The model it starts on with this provider's key when none is chosen; null when it picks its own.
          examples: [gpt-6.1-sol]

    SSHCertificateRequest:
      type: object
      required: [public_key, machine]
      properties:
        public_key: { type: string, description: "One line of an OpenSSH public key (ssh-ed25519 AAAA..., or ecdsa/rsa)." }
        machine: { type: string, description: "The machine's id; the certificate opens that machine alone." }
        ttl_s: { type: integer, minimum: 1, maximum: 3600, description: "How long it lives, in seconds; one hour at most, and the default." }

    SSHAccess:
      type: object
      required: [object, open, ssh_host, ca_public_key, host_public_key]
      properties:
        object: { const: ssh }
        open: { type: boolean, description: "False when SSH is not available." }
        ssh_host: { type: [string, "null"], description: "The address to reach the SSH server by." }
        ca_public_key: { type: string, description: "The authority's public key (@cert-authority); empty when none is set." }
        host_public_key: { type: string, description: "The SSH server's host key, to pin in known_hosts; empty when none is set." }

    SSHCertificate:
      type: object
      required: [object, certificate, principal, ssh_user, expires_at]
      properties:
        object: { type: string, enum: [ssh_certificate] }
        certificate: { type: string, description: "The signed certificate, one OpenSSH line; save it next to the public key." }
        principal: { type: string, description: "The one principal: the machine's id." }
        ssh_user: { type: string, description: "The SSH user to connect as (the machine's id)." }
        expires_at: { type: string, format: date-time }
        ca_public_key: { type: string, description: "The authority's public key, to trust the certificate (@cert-authority)." }
        host_public_key: { type: string, description: "The SSH server's host key, to pin in known_hosts." }
        ssh_host: { type: string, description: "The address to reach the SSH server by, when one is set." }

    MachineSize:
      type: object
      required: [cpus, memory_gb, price_per_hour_usd]
      properties:
        cpus: { type: integer, enum: [2, 4, 8] }
        memory_gb: { type: integer }
        price_per_hour_usd: { type: number, description: "What an hour of it running comes to." }
    SizeList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/MachineSize" }

    Region:
      type: object
      required: [id, city, country]
      properties:
        id: { type: string, examples: [helsinki] }
        city: { type: string }
        country: { type: string }

    GpuList:
      type: object
      required: [object, data, for_sale]
      properties:
        object: { const: list }
        for_sale:
          type: boolean
          description: False while this account cannot make GPU machines; the list shows what they would cost.
        data:
          type: array
          items: { $ref: "#/components/schemas/GpuOffer" }
    GpuOffer:
      type: object
      required: [id, model, count, memory_gb, price_per_hour_usd, available]
      properties:
        id: { type: string }
        model: { type: string, examples: ["H100 80GB"] }
        count: { type: integer }
        memory_gb: { type: integer }
        cpus: { type: integer }
        ram_gb: { type: number }
        disk_gb: { type: number }
        location:
          type: object
          properties:
            city: { type: string }
            country: { type: string }
        price_per_hour_usd: { type: number }
        interruptible: { type: boolean, description: "Can be interrupted at any time; cheaper for it." }
        available: { type: boolean }

    Usage:
      type: object
      required: [object, month, machines, total_usd]
      properties:
        object: { const: usage }
        month: { type: string }
        total_usd: { type: number }
        machines:
          type: array
          items:
            type: object
            required: [machine, running_seconds, usd]
            properties:
              machine: { type: string }
              name: { type: string, description: "The machine's name." }
              project: { type: string }
              made_by:
                type: [string, "null"]
                description: In an organisation, the person who made the machine; null in your own account.
              held_by:
                description: In an organisation, whose machine it is; null in your own account.
                oneOf:
                  - $ref: "#/components/schemas/HeldBy"
                  - type: "null"
              running_seconds: { type: number }
              usd: { type: number }
        folders_usd:
          type: [number, "null"]
          description: |
            What the account's folders came to in the month, taken from its credit and under no limit: shown to you in your own
            account, and to an organisation's owners, admins and billing; null otherwise.
        held_before:
          type: array
          description: In an organisation, what you ran this month of machines you no longer reach - handed off, or moved to another team.
          items:
            type: object
            required: [machine, name, usd]
            properties:
              machine: { type: string }
              name: { type: string }
              usd: { type: number }

    Credit:
      type: object
      required: [object, account, balance_usd, empty, buy, charging, low_usd, free_credit, data, next]
      properties:
        object: { const: credit }
        account: { type: string, description: "The account it is: your own, or the organisation's." }
        balance_usd:
          type: number
          description: |
            The credit left, in dollars to the millionth: what was put in, less what was taken. It may be a little
            below zero: the running time of the minute it ran out in is taken too.
        empty: { type: boolean, description: "Zero or below: the account's machines are paused, and none starts until the balance is above $0." }
        buy:
          type: object
          required: [open, amounts_usd, paddle]
          description: Whether credit can be bought, in which amounts, and what Paddle's checkout is opened with.
          properties:
            open: { type: boolean, description: "False when credit cannot be bought." }
            amounts_usd:
              type: array
              description: "The amounts credit is bought in, in dollars, one at a time (`POST /v1/credit/purchases`): 10, 25, 50 and 100. Empty while not open."
              items: { type: integer }
            paddle:
              type: [object, "null"]
              required: [environment, client_token]
              description: What Paddle.js is opened with in a browser; null while not open.
              properties:
                environment: { type: string, enum: [sandbox, live], description: "Which Paddle environment the checkout opens in." }
                client_token: { type: string, description: "Paddle's client-side token: made to be given to browsers, it opens the checkout and nothing else." }
        charging:
          type: object
          required: [state, from]
          description: |
            Whether use is taken from credit now. `on`: it is. `from`: not until `from`, for an older account; use is counted and
            shown, and nothing stops for its credit until then (`from` is null until its notice is sent). `off`: not charged at
            all.
          properties:
            state: { type: string, enum: ["on", "from", "off"] }
            from: { type: [string, "null"], format: date-time }
        low_usd:
          type: number
          description: |
            Below this the credit is running low, and those who buy it are e-mailed once: the larger of $1 and a fifth of
            the latest purchase.
        free_credit:
          description: |
            The free credit your own account is still to get, and what it waits for: a GitHub account linked on the
            dashboard's Code page, at least `github_min_days` old - with, once one too new was linked, when it is old
            enough (`too_new_until`; link it again then). Null when there is none to get: given, ruled out, or in an
            organisation.
          oneOf:
            - type: object
              required: [usd, needs, github_min_days, too_new_until]
              properties:
                usd: { type: number, examples: [5] }
                needs: { const: github }
                github_min_days: { type: integer }
                too_new_until: { type: [string, "null"], format: date-time }
            - type: "null"
        data:
          type: array
          description: A page of its entries, the newest first.
          items: { $ref: "#/components/schemas/CreditEntry" }
        next:
          type: [string, "null"]
          description: The page after this one, as `after`; null for the last.
    CreditEntry:
      type: object
      required: [id, object, kind, amount_usd, reason, machine, machine_name, at, updated_at]
      properties:
        id: { type: string, examples: [ce_01jb2xk3n4p5q6r7s8t9v0w1x2] }
        object: { const: credit_entry }
        kind:
          type: string
          description: |
            `welcome` the $5 of free credit your own account gets; `machine_time` a machine's running time of a day
            (UTC); `folders` what the account's folders kept that day; `purchase` credit you bought - and a disputed
            payment that came back; `refund` credit refunded through Paddle, or disputed with your bank;
            `staff_credit` and `staff_debit` credit our staff put in or took back, with why.
          enum: [welcome, machine_time, folders, purchase, refund, staff_credit, staff_debit]
        amount_usd: { type: number, description: "Put in above zero, taken below zero; dollars to the millionth." }
        reason: { type: string, description: "What it is, in words a person reads." }
        machine: { type: [string, "null"], description: "The machine whose running time it is; null for any other entry." }
        machine_name: { type: [string, "null"], description: "That machine's name, a deleted one's too." }
        at: { type: string, format: date-time, description: "When it was written; for running time, the day's first minute it ran." }
        updated_at:
          type: string
          format: date-time
          description: When it last changed. A day's running time grows each minute until the day ends; no other entry changes.
    CreditPurchaseCreate:
      type: object
      required: [amount_usd]
      properties:
        amount_usd: { type: integer, enum: [10, 25, 50, 100], description: "How much credit to buy, in dollars." }
    CreditCheckout:
      type: object
      required: [object, provider, environment, client_token, prices, custom_data]
      properties:
        object: { const: credit_checkout }
        provider: { const: paddle }
        environment: { type: string, enum: [sandbox, live], description: "Which Paddle environment the checkout opens in." }
        client_token: { type: string, description: "Paddle's client-side token, which the page opens the checkout with: made to be given to browsers." }
        prices:
          type: array
          description: The four amounts' prices at Paddle, by the dollars of credit each buys.
          items:
            type: object
            required: [amount_usd, price_id]
            properties:
              amount_usd: { type: integer, enum: [10, 25, 50, 100] }
              price_id: { type: string }
        custom_data:
          type: object
          description: Passed to the checkout as it is.
          additionalProperties: { type: string }
    CreditPurchase:
      type: object
      required: [object, id, account, amount_usd, checkout, created_at]
      properties:
        object: { const: credit_purchase }
        id: { type: string, examples: [cp_01jb2xk3n4p5q6r7s8t9v0w1x2] }
        account: { type: string, description: "The account the credit is for." }
        amount_usd: { type: number, description: "The credit it gives once it is paid, in dollars." }
        checkout:
          type: object
          required: [provider, environment, client_token, transaction_id, price_id, prices, custom_data, url]
          description: |
            Where this payment is paid, and what the dashboard opens Paddle's checkout with. Paddle
            charges the price of where the person is - rupees in India, pounds in the United Kingdom, euros in the euro
            area, US dollars elsewhere - and the credit given is the dollars of the price bought.
          properties:
            provider: { const: paddle }
            environment: { type: string, enum: [sandbox, live], description: "Which Paddle environment the checkout opens in." }
            client_token: { type: string, description: "Paddle's client-side token, which the dashboard's page opens the checkout with: made to be given to browsers." }
            transaction_id: { type: [string, "null"], description: "Paddle's id for the purchase's transaction, or null while it has none. A purchase can have one before it is paid." }
            price_id: { type: string, description: "Paddle's price of this purchase's amount." }
            prices:
              type: array
              description: The four amounts' prices at Paddle, by the dollars of credit each buys.
              items:
                type: object
                required: [amount_usd, price_id]
                properties:
                  amount_usd: { type: integer, enum: [10, 25, 50, 100] }
                  price_id: { type: string }
            custom_data:
              type: object
              description: Passed to the checkout as it is.
              additionalProperties: { type: string }
            url:
              type: string
              format: uri
              description: The dashboard's Billing page with this purchase in its address, which opens Paddle's checkout on it for a person signed in there who buys the account's credit.
              examples: ["https://app.wheelmachine.ai/billing?purchase=cp_01jb2xk3n4p5q6r7s8t9v0w1x2"]
        created_at: { type: string, format: date-time }
    PaddleNotification:
      type: object
      required: [event_id, event_type, data]
      description: A notification as Paddle sends it.
      properties:
        event_id: { type: string }
        event_type: { type: string, description: "The kind of notification." }
        occurred_at: { type: string, format: date-time }
        notification_id: { type: string }
        data: { type: object, description: "The transaction or adjustment it is of." }

    Session:
      type: object
      required: [id, object, provider, device, address, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, examples: [ses_01jb2xk3n4p5q6r7s8t9v0w1x2] }
        object: { const: session }
        provider: { type: string, enum: [github, google] }
        device: { type: string, description: "The browser it was made in, as a person names it.", examples: ["Firefox on Windows"] }
        address: { type: string, description: "The IP address it was made from." }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: "The sign-in this call is made with." }
    SessionList:
      type: object
      required: [object, data]
      properties:
        object: { const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Session" }

    DeviceLoginRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80, description: "What the key will be called, such as `wm on laptop`." }
        scopes:
          type: array
          description: What the program asks for; `cloud:*` when left out. The person may give it less.
          items: { $ref: "#/components/schemas/Scope" }
        account:
          type: string
          pattern: "^acc_[0-9a-z]{26}$"
          description: The organisation the program asks its key to be made in. The person chooses, and is shown it first.
    DeviceLoginStarted:
      type: object
      required: [object, device_code, user_code, verification_uri, expires_in, expires_at, interval]
      properties:
        object: { const: device_login_start }
        device_code: { type: string, description: "The program's own: never shown, never sent anywhere else." }
        user_code: { type: string, examples: [BCDF-GHJK], description: "What the person types at verification_uri, from their terminal." }
        verification_uri: { type: string, examples: ["https://app.wheelmachine.ai/device"] }
        expires_in: { type: integer, description: "Seconds the codes last: 600." }
        expires_at: { type: string, format: date-time }
        interval: { type: integer, description: "Seconds between two asks for the key." }
    DeviceLoginToken:
      type: object
      additionalProperties: false
      required: [device_code]
      properties:
        device_code: { type: string }
    DeviceLoginPending:
      type: object
      required: [object, state, interval, expires_at]
      properties:
        object: { const: device_login }
        state: { const: pending }
        interval: { type: integer }
        expires_at: { type: string, format: date-time }
    DeviceLoginDecision:
      type: object
      additionalProperties: false
      required: [user_code]
      properties:
        user_code: { type: string, description: "As the person typed it; case, spaces and dashes do not matter." }
        scopes:
          type: array
          description: Approving only - what the program is given, within what it asked for.
          items: { $ref: "#/components/schemas/Scope" }
        account:
          type: string
          description: The account the key is made in - your own, or an organisation you are in; the account the call acts in when left out.
    DeviceLogin:
      type: object
      required: [id, object, name, scopes, state, address, device, created_at, expires_at]
      properties:
        id: { type: string }
        object: { const: device_login }
        name: { type: string }
        scopes:
          type: array
          description: What it asked for, as you would give it in `account`; once decided, what it was given.
          items: { $ref: "#/components/schemas/Scope" }
        projects:
          type: array
          description: The projects its key is limited to, in an organisation where your role is limited to teams.
          items: { type: string }
        account:
          type: [object, "null"]
          description: The account its key is made in.
          properties:
            id: { type: string }
            name: { type: string }
        asked_account:
          type: [object, "null"]
          description: The organisation the program asked its key to be made in, when you are in it; give it as `account` to choose it.
          properties:
            id: { type: string }
            name: { type: string }
        state: { type: string, enum: [pending, approved, denied, done] }
        address: { type: string, description: "The IP address the program asked from: compare it with where you are." }
        device: { type: string, examples: ["wm 0.1.2 on Linux"] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    Providers:
      type: object
      required: [object, github, google]
      properties:
        object: { const: providers }
        github: { type: boolean }
        google: { type: boolean }
